<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>領航系統畫面預覽</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a4d68;--navy-d:#123b52;--navy-l:#eef4f7;
  --mint:#2DC8A0;--mint-d:#1f9e7e;--mint-l:#edfaf6;
  --slate:#6b8a9c;--mist:#dce6ec;--line:#eef3f6;--bg:#f6fafb;
  --warn:#e0992a;--danger:#e05c5c;
  --ink:#1f3a47;
  --r:14px;--r-sm:10px;--r-lg:20px;
  --sh:0 1px 3px rgba(26,77,104,.04),0 1px 2px rgba(26,77,104,.06);
  --sh-md:0 4px 16px rgba(26,77,104,.07);
  --sh-lg:0 12px 48px rgba(26,77,104,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:#e8f0f4;color:var(--ink);font-size:13px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
::placeholder{color:#a8bcc8}

.outer{max-width:1180px;margin:0 auto;padding:26px 18px}
.switcher{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.sw-label{font-size:12px;color:var(--slate);font-weight:600;margin-right:2px}
.sw{padding:8px 14px;border-radius:999px;border:1px solid var(--mist);background:#fff;font-size:12px;font-weight:500;color:var(--slate);transition:.18s}
.sw.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(26,77,104,.18)}
.sw:hover:not(.active){border-color:var(--mint);color:var(--mint-d)}

.frame{background:#fff;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-lg);min-height:620px}

.btn{padding:10px 18px;background:var(--mint);color:#fff;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:600;transition:.15s;box-shadow:0 1px 2px rgba(45,200,160,.2)}
.btn:hover{background:var(--mint-d);box-shadow:0 2px 8px rgba(45,200,160,.28)}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:8px}
.btn.ghost{background:var(--mint-l);color:var(--mint-d);box-shadow:none}
.btn.ghost:hover{background:#def5ee}
.btn.gray{background:#f0f5f7;color:var(--slate);box-shadow:none}
.btn.gray:hover{background:#e6eef2}
.btn.danger{background:#fdecec;color:var(--danger);box-shadow:none}
.btn.danger:hover{background:#fbdede}
.tag{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.2px}
.tag.green{background:#e3f6ea;color:#1a8a4f}
.tag.gray{background:#eef3f6;color:var(--slate)}
.tag.blue{background:#e4eefc;color:#2563c4}
.tag.mint{background:var(--mint-l);color:var(--mint-d)}
.tag.amber{background:#fdf3e0;color:#b07818}

.login-wrap{min-height:620px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#eef4f7,#edfaf6)}
.login-box{background:#fff;border-radius:var(--r-lg);padding:40px 38px;width:320px;box-shadow:var(--sh-md)}
.login-logo{width:52px;height:52px;background:var(--navy);border-radius:15px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.login-box h2{font-size:18px;margin-bottom:4px;letter-spacing:-.2px}
.login-box p{font-size:12px;color:var(--slate);margin-bottom:24px}
.login-box input{width:100%;padding:12px 15px;border:1.5px solid var(--mist);border-radius:var(--r-sm);outline:none;font-size:14px;margin-bottom:11px;transition:.15s}
.login-box input:focus{border-color:var(--mint)}
.login-box .btn{width:100%;padding:13px;font-size:14px}

.layout{display:flex;min-height:620px}
.sidebar{width:222px;background:var(--navy);color:#fff;flex-shrink:0;padding:18px 0;display:flex;flex-direction:column}
.brand{padding:0 20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .ic{width:34px;height:34px;background:var(--mint);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand b{font-size:13px;display:block;letter-spacing:.2px}
.brand span{font-size:10px;color:#9fc0d4}
.menu{padding:12px 12px;flex:1;overflow-y:auto}
.menu-group{font-size:10px;color:#6f9bb5;font-weight:700;letter-spacing:1px;padding:14px 12px 6px}
.menu a{display:flex;align-items:center;gap:11px;padding:10px 12px;color:#c2d6e2;border-radius:var(--r-sm);font-size:13px;font-weight:500;margin-bottom:2px;cursor:pointer;transition:.15s}
.menu a:hover{background:rgba(255,255,255,.06);color:#fff}
.menu a.active{background:var(--mint);color:#fff;box-shadow:0 2px 10px rgba(45,200,160,.3)}
.menu a svg{width:17px;height:17px;flex-shrink:0;opacity:.9}
.s-logout{margin:10px 12px 0;padding:10px;background:rgba(255,255,255,.06);color:#c2d6e2;border:none;border-radius:var(--r-sm);font-size:12px;transition:.15s}
.s-logout:hover{background:rgba(255,255,255,.1)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.topbar h2{font-size:17px;letter-spacing:-.3px}
.content{padding:26px;background:var(--bg);flex:1;overflow:auto}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:var(--r);padding:18px 20px;border:1px solid var(--line);box-shadow:var(--sh);transition:.15s}
.stat:hover{box-shadow:var(--sh-md)}
.stat .n{font-size:26px;font-weight:700;color:var(--mint);letter-spacing:-.5px}
.stat .n.navy{color:var(--navy)}
.stat .l{font-size:11px;color:var(--slate);margin-top:3px}
.stat .sub{font-size:11px;margin-top:5px;font-weight:600}
.up{color:#1a8a4f}.down{color:var(--danger)}

.card{background:#fff;border-radius:var(--r);border:1px solid var(--line);margin-bottom:16px;overflow:hidden;box-shadow:var(--sh)}
.card-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-head h3{font-size:14px;letter-spacing:-.2px}
.card-body{padding:20px}
.card-body.flush{padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 18px;font-size:11px;color:var(--slate);font-weight:700;letter-spacing:.4px;background:var(--bg);border-bottom:1px solid var(--line)}
td{padding:13px 18px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--bg)}
.t-name{font-weight:600;color:var(--ink)}
.t-sub{font-size:11px;color:var(--slate)}
.num{font-variant-numeric:tabular-nums}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border:1.5px solid var(--mist);border-radius:var(--r-sm);outline:none;transition:.15s;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(45,200,160,.1)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .bl{width:78px;font-size:12px;text-align:right;color:var(--slate);flex-shrink:0}
.bar-track{flex:1;background:var(--bg);border-radius:6px;height:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11px;font-weight:600;white-space:nowrap}
.bar-row .bv{width:66px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

.banner{padding:12px 16px;border-radius:10px;font-size:12px;margin-bottom:14px;display:flex;gap:8px;line-height:1.7}
.banner.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.banner.info{background:var(--navy-l);border:1px solid #bcd6e6;color:var(--navy)}

.status-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.status-row:last-child{border-bottom:none}
.status-row b{display:block;font-size:13px}
.status-row span{font-size:11px;color:var(--slate)}

.phone{width:360px;margin:0 auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 40px rgba(0,75,115,.12)}
.book-hero{background:linear-gradient(135deg,var(--navy),var(--mint));color:#fff;padding:26px 22px 22px}
.book-hero h1{font-size:19px;font-weight:700}
.book-hero p{font-size:12px;opacity:.9;margin-top:3px}
.book-steps{display:flex;padding:14px 22px 0;gap:5px}
.dot{flex:1;height:3px;border-radius:2px;background:#e3edf2}
.dot.on{background:var(--mint)}
.book-body{padding:20px}
.book-label{font-size:11px;color:var(--slate);font-weight:600;letter-spacing:.4px;margin-bottom:10px}
.opt{border:1.5px solid var(--line);border-radius:11px;padding:13px;margin-bottom:8px;cursor:pointer;overflow:hidden}
.opt.sel{border-color:var(--mint);background:var(--mint-l)}
.opt .ot{font-size:14px;font-weight:600}
.opt .os{font-size:11px;color:var(--slate);margin-top:2px}
.opt .price{float:right;font-size:13px;color:var(--mint-d);font-weight:700}
.opt .dur{display:block;text-align:right;font-size:11px;color:var(--slate);font-weight:600}
.book-btn{display:block;width:100%;padding:13px;background:var(--mint);color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:700;margin-top:6px}

.modal-bg{position:fixed;inset:0;background:rgba(26,77,104,.38);backdrop-filter:blur(3px);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);width:448px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:var(--sh-lg)}
.modal-head{padding:17px 22px;color:#fff;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.modal-head .x{background:rgba(255,255,255,.2);border:none;width:30px;height:30px;border-radius:9px;font-size:18px;color:#fff;line-height:1;cursor:pointer;transition:.15s}
.modal-head .x:hover{background:rgba(255,255,255,.32)}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.status-picker{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.sp{padding:8px 15px;border-radius:999px;border:1.5px solid transparent;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;background:var(--bg);color:var(--slate)}
.sp:hover{opacity:.85}
.sp.sel{color:#fff!important}
.sp[data-s="confirmed"]     {border-color:#a8caf5;color:#2563c4}
.sp[data-s="confirmed"].sel {background:#3b82f6;border-color:#3b82f6}
.sp[data-s="in_progress"]   {border-color:var(--mint);color:var(--mint-d)}
.sp[data-s="in_progress"].sel{background:var(--mint);border-color:var(--mint)}
.sp[data-s="completed"]     {border-color:#9be0b5;color:#1a8a4f}
.sp[data-s="completed"].sel {background:#22c55e;border-color:#22c55e}
.sp[data-s="no_show"]       {border-color:#f3b4b4;color:#d04848}
.sp[data-s="no_show"].sel   {background:#e05c5c;border-color:#e05c5c}
.sp[data-s="cancelled"]     {border-color:#d9e0e5;color:#7a909c}
.sp[data-s="cancelled"].sel {background:#7a909c;border-color:#7a909c}
@keyframes pulse-border{0%,100%{opacity:1}50%{opacity:.55}}
#sToast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 24px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:var(--sh-md)}
#sToast.show{opacity:1}

/* ── 客戶預約頁額外元件 ── */
.book-section{border:1.5px solid var(--line);border-radius:11px;padding:16px;margin-bottom:12px}
.book-section.active{border-color:var(--mint);background:var(--mint-l)}
.book-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:0}
.book-section-head.open{margin-bottom:14px}

/* toggle switch */
.toggle{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:#d1d5db;border-radius:12px;transition:.2s;cursor:pointer}
.toggle input:checked+.toggle-track{background:var(--mint)}
.toggle-track:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.toggle-track:before{transform:translateX(20px)}

/* 付款方式 pills */
.pay-pills{display:flex;gap:7px;flex-wrap:wrap}
.pay-pill{padding:7px 16px;border-radius:20px;border:1.5px solid var(--mist);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--slate);transition:.12s;font-family:inherit}
.pay-pill.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.pay-pill:hover:not(.sel){border-color:var(--navy);color:var(--navy)}

/* 收據預覽 */
.receipt-preview{background:#fff;border:1px dashed var(--mist);border-radius:10px;padding:16px;margin-top:12px;font-size:12px}
.receipt-preview .rh{text-align:center;font-size:15px;font-weight:700;margin-bottom:10px;color:var(--navy)}
.receipt-preview .rl{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted var(--line)}
.receipt-preview .rl:last-child{border-bottom:none;font-weight:700;color:var(--mint-d)}
.receipt-preview .stamp-note{text-align:center;margin-top:10px;font-size:10px;color:var(--slate);border-top:1px dashed var(--mist);padding-top:8px}

/* 步驟切換 tabs */
.book-tabs{display:flex;gap:8px;margin-bottom:16px}
.book-tab{flex:1;padding:9px;border:none;border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s;background:var(--bg);color:var(--slate)}
.book-tab.active{background:var(--navy);color:#fff}

/* ════ SOAP 病歷 ════ */
.soap-layout{display:grid;grid-template-columns:220px 1fr;gap:0;min-height:560px}
.soap-plist{border-right:1px solid var(--line);background:#fff;overflow-y:auto}
.soap-plist-head{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;position:sticky;top:0;background:#fff;z-index:1}
.soap-pi{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.soap-pi:hover{background:var(--bg)}
.soap-pi.sel{background:var(--navy-l);border-left:3px solid var(--navy)}
.soap-pi .pn{font-weight:700;font-size:13px}
.soap-pi .ps{font-size:11px;color:var(--slate);margin-top:2px}

.soap-main{background:var(--bg);overflow-y:auto;display:flex;flex-direction:column}
.soap-ptop{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:1}
.soap-ptop .pname{font-size:16px;font-weight:700}
.soap-ptop .pmeta{font-size:12px;color:var(--slate)}
.soap-notes-list{padding:16px;flex:1}

/* SOAP card */
.soap-card{background:#fff;border-radius:12px;border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.soap-card-head{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.soap-card-head .date{font-size:14px;font-weight:700}
.soap-card-head .meta{font-size:12px;color:var(--slate)}
.soap-card-head .tags{display:flex;gap:6px;align-items:center}
.soap-card-body{padding:0 18px 18px;display:none}
.soap-card-body.open{display:block}

/* SOAP sections S/O/A/P */
.soap-sec{border-radius:9px;margin-bottom:10px;overflow:hidden}
.soap-sec-head{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;font-weight:700}
.soap-sec-head .badge{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;flex-shrink:0}
.soap-sec-body{padding:4px 14px 12px}
.soap-sec textarea{width:100%;padding:8px 10px;border:1.5px solid var(--mist);border-radius:8px;resize:vertical;min-height:72px;outline:none;font-family:inherit;font-size:13px;line-height:1.6}
.soap-sec textarea:focus{border-color:var(--mint)}
.soap-sec.S .soap-sec-head{background:#eff6ff}.soap-sec.S .badge{background:#3b82f6}
.soap-sec.O .soap-sec-head{background:var(--mint-l)}.soap-sec.O .badge{background:var(--mint)}
.soap-sec.A .soap-sec-head{background:#fef3c7}.soap-sec.A .badge{background:#f59e0b}
.soap-sec.P .soap-sec-head{background:#f5f3ff}.soap-sec.P .badge{background:#8b5cf6}

/* ROM 測量表格 */
.rom-table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
.rom-table th{background:var(--bg);padding:6px 10px;text-align:center;border:1px solid var(--line);font-weight:600;color:var(--slate)}
.rom-table td{padding:6px 10px;border:1px solid var(--line);text-align:center}
.rom-table input{width:54px;padding:4px 6px;border:1px solid var(--mist);border-radius:5px;text-align:center;font-size:12px;outline:none}
.rom-table input:focus{border-color:var(--mint)}

/* 疼痛量表 VAS */
.vas-wrap{display:flex;align-items:center;gap:10px;margin:8px 0}
.vas-track{flex:1;height:8px;border-radius:4px;background:linear-gradient(to right,#22c55e,#f59e0b,#ef4444);position:relative;cursor:pointer}
.vas-thumb{width:18px;height:18px;background:#fff;border:2.5px solid var(--navy);border-radius:50%;position:absolute;top:-5px;transform:translateX(-50%);cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.vas-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--slate);margin-top:4px}

/* 圖片上傳 */
.img-drop{border:2px dashed var(--mist);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg)}
.img-drop:hover,.img-drop.drag{border-color:var(--mint);background:var(--mint-l)}
.img-drop svg{width:32px;height:32px;color:var(--mist);margin-bottom:8px}
.img-drop p{font-size:13px;color:var(--slate)}
.img-drop .sub{font-size:11px;margin-top:4px;color:#94a3b8}
.img-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.img-thumb{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--line);cursor:pointer}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-thumb .del{position:absolute;top:4px;right:4px;width:20px;height:20px;background:rgba(0,0,0,.55);border:none;border-radius:4px;color:#fff;font-size:14px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center}
.img-thumb:hover .del{display:flex}
.img-thumb .img-tag{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:10px;padding:4px 6px}

/* 全螢幕圖片預覽 */
#img-viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:none;align-items:center;justify-content:center}
#img-viewer.show{display:flex}
#img-viewer img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain}
#img-viewer .close{position:absolute;top:16px;right:20px;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer}

/* ── 預約編輯 modal ── */
.edit-tabs{display:flex;border-bottom:1px solid var(--line);background:#fff;padding:0 20px;gap:2px}
.edit-tab{padding:11px 16px;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;color:var(--slate);border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:.15s;font-family:inherit}
.edit-tab.active{color:var(--navy);border-bottom-color:var(--mint)}
.edit-tab:hover:not(.active){color:var(--navy)}
.edit-panel{display:none;padding:18px 20px}
.edit-panel.active{display:block}
.sec-label{font-size:11px;font-weight:700;color:var(--slate);letter-spacing:.5px;text-transform:uppercase;margin:16px 0 10px;display:flex;align-items:center;gap:6px}
.sec-label:first-child{margin-top:0}
.sec-label::after{content:'';flex:1;height:1px;background:var(--line)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0}
.change-row{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.change-row:last-child{border-bottom:none}
.change-row .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);margin-top:5px;flex-shrink:0}
.change-row .ct{font-size:13px;line-height:1.5}
.change-row .cd{font-size:11px;color:var(--slate);margin-top:2px}

/* ════ 結帳 / 收據 ════ */
.checkout-step{padding:18px 20px}
.amount-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.amount-row .big{font-size:28px;font-weight:800;color:var(--navy)}
.amount-row .sub{font-size:13px;color:var(--slate)}
.disc-row{display:flex;align-items:center;gap:8px}
.disc-row input{width:100px;padding:8px 12px;border:1.5px solid var(--mist);border-radius:8px;font-size:15px;outline:none;text-align:right}
.disc-row input:focus{border-color:var(--mint)}
.final-amount{background:var(--mint-l);border:1.5px solid var(--mint);border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.final-amount .label{font-size:14px;font-weight:600;color:var(--mint-d)}
.final-amount .val{font-size:22px;font-weight:800;color:var(--mint-d)}

/* 收據 */
.receipt-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:480px;margin:0 auto}
.receipt-header{background:var(--navy);color:#fff;padding:20px 24px;text-align:center}
.receipt-header h2{font-size:18px;font-weight:700;letter-spacing:1px}
.receipt-header p{font-size:12px;opacity:.8;margin-top:4px}
.receipt-body{padding:20px 24px}
.receipt-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dotted #e8eef3;font-size:13px}
.receipt-row:last-of-type{border-bottom:none}
.receipt-row .rk{color:var(--slate)}
.receipt-row .rv{font-weight:600}
.receipt-total{background:var(--bg);margin:0 -24px;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--navy)}
.receipt-total .rk{font-size:15px;font-weight:700;color:var(--navy)}
.receipt-total .rv{font-size:22px;font-weight:800;color:var(--navy)}
.receipt-footer{padding:18px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;border-top:1px dashed #e8eef3}
.receipt-footer .sig-area{text-align:center}
.receipt-footer .sig-label{font-size:11px;color:var(--slate);margin-top:8px}

/* 印章 */
.stamp-svg-wrap{display:inline-block;position:relative}
.stamp-svg-wrap.stamped svg{opacity:.85;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.stamp-svg-wrap.unstamped{opacity:.3}

/* print */
@media print{
  body *{visibility:hidden}
  .print-area,
  .print-area *{visibility:visible}
  .print-area{position:fixed;inset:0;background:#fff;padding:24px}
  .no-print{display:none!important}
}

/* ════ 收據設計器 ════ */
.rd-layout{display:grid;grid-template-columns:340px 1fr;min-height:560px}
.rd-settings{border-right:1px solid var(--line);background:#fff;overflow-y:auto;padding:0}
.rd-settings-head{padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;position:sticky;top:0;background:#fff;z-index:1;display:flex;align-items:center;justify-content:space-between}
.rd-settings-body{padding:16px 18px}
.rd-preview{background:#e8eef3;overflow-y:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rd-preview-label{font-size:11px;font-weight:700;color:var(--slate);letter-spacing:.6px;align-self:flex-start}

/* 模板選擇 */
.tpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:4px}
.tpl-card{border:2px solid var(--line);border-radius:10px;padding:10px 8px;cursor:pointer;text-align:center;transition:.15s}
.tpl-card:hover{border-color:var(--mint)}
.tpl-card.sel{border-color:var(--mint);background:var(--mint-l)}
.tpl-card .tpl-thumb{height:48px;border-radius:6px;margin-bottom:6px;overflow:hidden;position:relative}
.tpl-card .tpl-name{font-size:11px;font-weight:700;color:var(--navy)}
.tpl-card .tpl-desc{font-size:10px;color:var(--slate);margin-top:2px}

/* toggle row */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:none}
.toggle-row .trl{font-size:13px}
.toggle-row .trs{font-size:11px;color:var(--slate)}

/* color swatch */
.color-swatch-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cs{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:.1s;flex-shrink:0}
.cs.sel{border-color:var(--navy);transform:scale(1.15)}
.cs:hover{transform:scale(1.1)}

/* 收據模板 — 共用基底 */
.rc{width:360px;background:#fff;font-family:'Noto Sans TC',sans-serif;font-size:12px;box-shadow:0 4px 20px rgba(0,0,0,.12);line-height:1.6;flex-shrink:0}
.rc .rh{padding:18px 22px;color:#fff;text-align:center}
.rc .rh .rh1{font-size:17px;font-weight:700;letter-spacing:.5px}
.rc .rh .rh2{font-size:11px;opacity:.85;margin-top:2px}
.rc .rb{padding:16px 20px}
.rc .rr{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px dotted #e8eef3}
.rc .rr:last-of-type{border-bottom:none}
.rc .rk{color:#6b7f8e;font-size:11px}
.rc .rv{font-weight:600;font-size:12px}
.rc .rtot{padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.rc .rtot .rk{font-size:13px;font-weight:700}
.rc .rtot .rv{font-size:20px;font-weight:800}
.rc .rf{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed #e8eef3}
.rc .rf .rftext{font-size:10px;color:#6b7f8e;text-align:right;line-height:1.7}
.rc .rfoot{padding:10px 20px;text-align:center;font-size:10px;color:#9ca3af;border-top:1px solid #f0f0f0}

/* ── SOAP O 簡答格 ── */
.o-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.o-wide{grid-column:1/-1}
.o-item{display:flex;flex-direction:column;gap:4px}
.o-lbl{font-size:11px;font-weight:700;color:var(--slate);letter-spacing:.3px}
.o-inp{padding:8px 10px;border:1.5px solid var(--mist);border-radius:8px;font-size:13px;outline:none;font-family:inherit}
.o-inp:focus{border-color:var(--mint)}
.o-ta{padding:8px 10px;border:1.5px solid var(--mist);border-radius:8px;font-size:13px;outline:none;font-family:inherit;resize:vertical;min-height:60px;width:100%}
.o-ta:focus{border-color:var(--mint)}
/* ── VAS 臉部點選 ── */
.vas-face-grid{display:flex;gap:6px;justify-content:space-between;user-select:none}
.vas-face-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px 6px;border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;background:#fff;font-family:inherit;min-width:0}
.vas-face-btn:hover{border-color:currentColor;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.10)}
.vas-face-btn.sel{border-width:2.5px;background:var(--face-bg,#f0fdf4)}
.vas-face-btn .vf-score{font-size:16px;font-weight:900;line-height:1}
.vas-face-btn .vf-lbl{font-size:9px;font-weight:700;white-space:nowrap;opacity:.85}
@media (max-width:880px){
}

/* ── 搜尋高亮 ── */
.search-wrap{position:relative;flex:1;min-width:160px}
.search-wrap input{width:100%;padding:9px 36px 9px 13px;border:1.5px solid var(--mist);border-radius:9px;outline:none;font-family:inherit;font-size:13px}
.search-wrap input:focus{border-color:var(--mint)}
.search-wrap .s-ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--slate);pointer-events:none;width:16px;height:16px}
.search-wrap .s-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--slate);cursor:pointer;font-size:16px;line-height:1;display:none;background:none;border:none;padding:0}
.search-wrap input:not(:placeholder-shown) ~ .s-clear{display:block}
.search-wrap input:not(:placeholder-shown) ~ .s-ico{display:none}
.hl{background:#fef3c7;border-radius:2px}
tr.hidden-row{display:none}

/* ── 排班 ── */
.sched-grid{display:grid;grid-template-columns:100px repeat(7,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.sched-hdr{padding:8px 6px;text-align:center;font-size:11px;font-weight:700;background:var(--navy);color:#fff}
.sched-hdr.today{background:var(--mint)}
.sched-row{display:contents}
.sched-label{padding:10px 10px;font-size:12px;font-weight:600;background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sched-label .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sched-cell{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;min-height:44px;cursor:pointer;transition:background .1s}
.sched-cell:hover{background:var(--mint-l)}
.sched-cell.off{background:#f8fafb}
.sched-cell.exc{background:#fef2f2}
.shift-tag{display:flex;align-items:center;justify-content:center;background:var(--navy-l);color:var(--navy);font-size:10px;font-weight:600;border-radius:5px;padding:4px 6px;margin:2px;cursor:pointer;line-height:1.3;text-align:center}
.shift-tag:hover{background:var(--mint-l);color:var(--mint-d)}
.shift-tag.exc-tag{background:#fee2e2;color:#dc2626}
.shift-add{display:flex;align-items:center;justify-content:center;color:var(--mist);font-size:18px;height:28px;cursor:pointer;border-radius:5px;transition:background .1s}
.shift-add:hover{background:var(--mint-l);color:var(--mint-d)}

/* ── 角色權限 ── */
.role-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.role-admin{background:#fee2e2;color:#dc2626}
.role-therapist{background:var(--mint-l);color:var(--mint-d)}
.role-assistant{background:#fef3c7;color:#b45309}
.role-viewer{background:#eef2f5;color:var(--slate)}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.perm-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px}
.perm-item.on{border-color:var(--mint);background:var(--mint-l)}
.perm-item input{width:16px;height:16px;accent-color:var(--mint)}
.therapist-avatar{width:48px;height:48px;border-radius:50%;background:var(--navy-l);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--navy);flex-shrink:0}

/* ── 課程套餐 ── */
.pkg-card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:18px;cursor:pointer;transition:.15s;position:relative}
.pkg-card:hover{border-color:var(--mint);box-shadow:0 2px 12px rgba(45,200,160,.15)}
.pkg-card.inactive{opacity:.5}
.pkg-sessions{font-size:28px;font-weight:800;color:var(--navy);line-height:1}
.pkg-price{font-size:14px;font-weight:700;color:var(--mint-d);margin-top:4px}
.pkg-info{font-size:11px;color:var(--slate);margin-top:6px}
.pp-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.pp-fill{height:100%;background:var(--mint);border-radius:3px;transition:width .3s}
.pp-fill.warn{background:var(--warn)}
.pp-fill.done{background:#9ca3af}
.redeem-btn{padding:6px 14px;background:var(--mint);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.redeem-btn:disabled{background:var(--mist);cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;margin:2px}
.hint{font-size:11px;color:var(--slate);margin-top:3px}

/* ── 初診問卷（手機版）── */
.intake-wrap{background:var(--bg);min-height:620px;padding:20px 16px}
.intake-phone{max-width:390px;margin:0 auto;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 40px rgba(0,75,115,.18)}
.intake-hero{background:linear-gradient(135deg,#1a4d68,#2DC8A0);color:#fff;padding:28px 24px 24px}
.intake-hero h1{font-size:18px;font-weight:700;letter-spacing:.3px}
.intake-hero p{font-size:12px;opacity:.88;margin-top:4px;line-height:1.6}
.intake-steps{display:flex;padding:14px 24px 0;gap:4px}
.intake-steps .s{flex:1;height:4px;border-radius:2px;background:#e8f4f8;transition:background .3s}
.intake-steps .s.done{background:#2DC8A0}
.intake-steps .s.cur{background:#1a4d68}
.intake-section{padding:20px 24px;display:none}
.intake-section.active{display:block}
.intake-section-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.intake-section-title .num{width:24px;height:24px;background:var(--navy);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.intake-field{margin-bottom:14px}
.intake-field label{display:block;font-size:12px;font-weight:700;color:var(--slate);margin-bottom:5px;letter-spacing:.3px}
.intake-field input,.intake-field select,.intake-field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--mist);border-radius:10px;font-size:14px;outline:none;font-family:inherit;color:var(--navy)}
.intake-field input:focus,.intake-field select:focus,.intake-field textarea:focus{border-color:var(--mint)}
.intake-field textarea{resize:none;height:72px;line-height:1.5}
.intake-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk-group{display:flex;flex-direction:column;gap:8px}
.chk-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-size:13px;transition:border-color .15s}
.chk-item:has(input:checked){border-color:var(--mint);background:var(--mint-l)}
.chk-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--mint);flex-shrink:0}
.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nrs-wrap{display:flex;gap:6px;margin-top:6px}
.nrs-btn{flex:1;padding:10px 0;border:1.5px solid var(--mist);border-radius:8px;font-size:14px;font-weight:700;text-align:center;cursor:pointer;transition:.12s;background:#fff;color:var(--slate)}
.nrs-btn:hover{border-color:var(--mint)}
.nrs-btn.sel{color:#fff}
.body-diagram{display:flex;justify-content:center;margin:8px 0}
.body-diagram svg .body-part{cursor:pointer;fill:#e8f0f5;stroke:#cdd9e0;stroke-width:1.5;transition:fill .15s}
.body-diagram svg .body-part:hover{fill:#b3d4e8}
.body-diagram svg .body-part.marked{fill:#2DC8A0;stroke:#1ea883}
.consent-box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12px;line-height:1.8;color:var(--slate);margin-bottom:14px;max-height:160px;overflow-y:auto}
.sig-area{border:2px dashed var(--mist);border-radius:10px;height:80px;display:flex;align-items:center;justify-content:center;color:var(--mist);font-size:13px;cursor:pointer;position:relative;overflow:hidden}
.sig-area canvas{position:absolute;inset:0;width:100%;height:100%}
.intake-nav{display:flex;gap:10px;padding:16px 24px 20px}
.intake-nav .prev-btn{flex:0 0 auto;padding:12px 20px;background:var(--bg);color:var(--slate);border:none;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.intake-nav .next-btn{flex:1;padding:13px;background:var(--mint);color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.intake-nav .next-btn:active{background:var(--mint-d)}
.intake-complete{text-align:center;padding:36px 24px;display:none}
.intake-complete .ic{width:64px;height:64px;background:var(--mint-l);border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.intake-complete h2{font-size:18px;font-weight:700;margin-bottom:8px}
.intake-complete p{font-size:13px;color:var(--slate);line-height:1.7}

/* ── 新版客戶預約 ── */
.bk-phone{max-width:390px;margin:0 auto;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 40px rgba(0,75,115,.18)}
.bk-hero{background:linear-gradient(135deg,#1a4d68,#2DC8A0);color:#fff;padding:24px 22px 20px;position:relative}
.bk-hero h1{font-size:18px;font-weight:700}
.bk-hero p{font-size:11px;opacity:.85;margin-top:3px}
.bk-progress{height:3px;background:rgba(255,255,255,.25);margin-top:14px;border-radius:2px;overflow:hidden}
.bk-progress-fill{height:100%;background:#fff;border-radius:2px;transition:width .3s}
.bk-step-label{font-size:10px;opacity:.7;margin-top:5px}
.bk-line-bar{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:6px 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;font-weight:600;margin-top:10px}
.bk-line-bar .line-ic{width:20px;height:20px;background:#06C755;border-radius:5px;display:flex;align-items:center;justify-content:center}

/* 步驟內容 */
.bk-body{padding:18px 20px 16px}
.bk-step{display:none}
.bk-step.active{display:block}
.bk-label{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:12px}

/* 服務卡片 */
.svc-card{border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:center;gap:14px}
.svc-card:hover{border-color:var(--mint)}
.svc-card.sel{border-color:var(--mint);background:var(--mint-l)}
.svc-card .svc-ic{width:44px;height:44px;border-radius:12px;background:var(--navy-l);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.svc-card .svc-name{font-size:14px;font-weight:700}
.svc-card .svc-meta{font-size:11px;color:var(--slate);margin-top:2px}
.svc-card .svc-price{font-size:14px;font-weight:800;color:var(--mint-d);margin-left:auto}

/* 治療師卡片 */
.t-card{border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:14px}
.t-card:hover{border-color:var(--mint)}
.t-card.sel{border-color:var(--mint);background:var(--mint-l)}
.t-card .t-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;flex-shrink:0}
.t-card .t-name{font-size:14px;font-weight:700}
.t-card .t-meta{font-size:11px;color:var(--slate);margin-top:2px}
.t-card .t-avail{margin-left:auto;font-size:11px;font-weight:600}

/* 日曆選日 */
.bk-cal{user-select:none}
.bk-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.bk-cal-head button{width:30px;height:30px;border:none;background:var(--bg);border-radius:8px;font-size:16px;cursor:pointer;color:var(--slate)}
.bk-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.bk-cal-grid .dow{font-size:10px;font-weight:700;color:var(--slate);padding:4px 0}
.bk-cal-grid .day{height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;font-weight:500}
.bk-cal-grid .day:hover:not(.empty):not(.past){background:var(--mint-l);color:var(--mint-d)}
.bk-cal-grid .day.sel{background:var(--navy);color:#fff;font-weight:700}
.bk-cal-grid .day.today{border:2px solid var(--mint)}
.bk-cal-grid .day.empty,.bk-cal-grid .day.past{color:var(--mist);cursor:default}
.bk-cal-grid .day.off{color:#e0e0e0;cursor:default}

/* 時段選擇 */

function vasRefreshUI(wrapId,v){
  const wrap=document.getElementById(wrapId);if(!wrap)return;
  wrap.querySelectorAll('.vas-face-btn').forEach(btn=>{
    const s=Number(btn.dataset?.s??btn.querySelector('.vf-score')?.textContent??-1);
    const f=VAS_FACES.find(x=>x.s===s);if(!f)return;
    const sel=(v===s);
    btn.classList.toggle('sel',sel);
    btn.style.borderColor=sel?f.c:'';
    btn.style.setProperty('--face-bg',f.c+'18');
    const svg=btn.querySelector('svg');
    const fg=sel?'#fff':f.c;
    if(svg){svg.setAttribute('fill',sel?f.c+'33':'none');svg.setAttribute('stroke',fg);svg.innerHTML=f.body.replace(/{c}/g,fg);}

function decodeGoogleJWT(token){
  try{
    const b64=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(atob(b64+'='.repeat((4-b64.length%4)%4)));
  }catch(e){return null;}
}
function onGoogleSignIn(response){
  const payload=decodeGoogleJWT(response.credential);
  if(!payload){showLoginError('登入失敗，請再試一次');return;}
  const cfg=EMAIL_WHITELIST[payload.email];
  if(!cfg){showLoginError('此帳號未獲授權\n'+payload.email);return;}
  currentUser={email:payload.email,name:cfg.name||payload.name,avatar:payload.picture||'',role:cfg.role,therapistId:cfg.therapistId,pages:ROLE_PAGES[cfg.role]||[]};
  go('dashboard');
}
function signOut(){
  currentUser=null;
  try{if(typeof google!=='undefined')google.accounts.id.disableAutoSelect();}catch(e){}
  go('login');
}
function showLoginError(msg){
  const el=document.getElementById('loginErr');

// ════ Google Calendar 同步 ════
let gcalToken = null;       // OAuth access token with calendar scope
let gcalTokenClient = null; // Token client for calendar scope
let gcalSyncing = false;
const GCAL_SYNC_STATUS = {}; // {bookingId: 'synced'|'error'|'pending'}
const GCAL_EVENT_IDS  = {}; // {bookingId: googleEventId}

// Google Calendar 顏色對應治療師
const GCAL_COLORS = {Sky:'1', B:'2', C:'5', D:'3', E:'6'}; // Google Calendar colorId

function initGCalClient(){
  if(typeof google === 'undefined' || !GOOGLE_CLIENT_ID.includes('YOUR_GOOGLE')) return;
  try{
    gcalTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/calendar.events',
      callback: (tokenResponse) => {
        if(tokenResponse.error){ showToast('Google Calendar 授權失敗'); return; }
        gcalToken = tokenResponse.access_token;
        const pendingFn = window._gcalPendingFn;
        if(pendingFn){ window._gcalPendingFn = null; pendingFn(); }
        updateGCalBtn();
        showToast('Google Calendar 已授權 ✓');
      }
    });
  }catch(e){ console.warn('GCal init failed:', e); }
}

function requireGCalToken(fn){
  if(gcalToken){ fn(); return; }
  if(!gcalTokenClient){ showToast('請先設定 Google Client ID'); return; }
  window._gcalPendingFn = fn;
  gcalTokenClient.requestAccessToken();
}

function updateGCalBtn(){
  const btn = document.getElementById('gcal-sync-btn');
  if(!btn) return;
  if(gcalToken){
    btn.textContent = '📅 同步 Google Calendar';
    btn.style.background = 'var(--mint)';
    btn.style.color = '#fff';
  }
}

// ── 建立 / 更新 Calendar 事件 ──
async function gcalUpsertEvent(b){
  const svc = svcOf(b.svc);
  if(!svc) return;
  const [hh, mm] = (b.time||'09:00').split(':');
  const startDT = b.date + 'T' + String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0') + ':00+08:00';
  const endMs = new Date(startDT).getTime() + svc.dur * 60000;
  const endDT = new Date(endMs).toISOString().replace('Z','+08:00').slice(0,19) + '+08:00';
  const body = {
    summary: b.name + ' — ' + svc.name,
    description: '服務：' + svc.name + '\n治療師：' + (TN[b.t]||b.t) + '\n電話：' + b.phone + (b.note?'\n備註：'+b.note:''),
    start: { dateTime: startDT, timeZone: 'Asia/Taipei' },
    end:   { dateTime: endDT,   timeZone: 'Asia/Taipei' },
    colorId: GCAL_COLORS[b.t] || '1',
    extendedProperties: { private: { naviBookingId: String(b.id) } }
  };
  const existingId = GCAL_EVENT_IDS[b.id];
  const url = existingId
    ? 'https://www.googleapis.com/calendar/v3/calendars/primary/events/' + existingId
    : 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
  const method = existingId ? 'PUT' : 'POST';
  try{
    const resp = await fetch(url, {
      method, headers: { 'Authorization': 'Bearer ' + gcalToken, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if(resp.ok){
      const data = await resp.json();
      GCAL_EVENT_IDS[b.id] = data.id;
      GCAL_SYNC_STATUS[b.id] = 'synced';
      return true;
    } else {
      const err = await resp.json();
      if(err.error?.code === 401){ gcalToken = null; }
      GCAL_SYNC_STATUS[b.id] = 'error';
      return false;
    }
  }catch(e){ GCAL_SYNC_STATUS[b.id] = 'error'; return false; }
}

async function gcalDeleteEvent(b){
  const eventId = GCAL_EVENT_IDS[b.id];
  if(!eventId || !gcalToken) return;
  try{
    await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events/' + eventId, {
      method: 'DELETE', headers: { 'Authorization': 'Bearer ' + gcalToken }
    });
    delete GCAL_EVENT_IDS[b.id];
    delete GCAL_SYNC_STATUS[b.id];
  }catch(e){}
}

// ── 同步所有預約 ──
async function syncAllToGCal(){
  if(gcalSyncing) return;
  requireGCalToken(async () => {
    gcalSyncing = true;
    updateSyncProgress(0);
    const toSync = BOOKINGS.filter(b => b.status !== 'cancelled');
    let done = 0, success = 0;
    for(const b of toSync){
      const ok = await gcalUpsertEvent(b);
      if(ok) success++;
      done++;
      updateSyncProgress(Math.round(done/toSync.length*100));
      await new Promise(r => setTimeout(r, 80)); // rate limiting
    }
    gcalSyncing = false;
    renderCal();
    showToast('同步完成：' + success + '/' + toSync.length + ' 筆成功 ✓');
  });
}

function updateSyncProgress(pct){
  const bar = document.getElementById('gcal-progress');
  if(bar){
    bar.style.width = pct + '%';
    bar.parentElement.style.display = pct < 100 ? 'block' : 'none';
  }
}

// ── 單筆同步（新增/更新預約後呼叫）──
function syncSingleBk(id){
  const b = BOOKINGS.find(x => x.id === id);
  if(!b || !gcalToken) return;
  gcalUpsertEvent(b).then(ok => {
    if(ok) renderCal();
  });
}

// ── 取得同步狀態 icon ──
function gcalStatusIcon(id){
  const st = GCAL_SYNC_STATUS[id];
  if(!gcalToken) return '';
  if(st === 'synced') return '<span title="已同步至 Google Calendar" style="position:absolute;top:3px;right:3px;font-size:9px;background:#fff;border-radius:50%;width:13px;height:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.15)">📅</span>';
  if(st === 'error')  return '<span title="同步失敗" style="position:absolute;top:3px;right:3px;font-size:9px;color:#e05c5c">⚠</span>';
  return '<span title="待同步" style="position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#f59e0b;display:block"></span>';
}

function toggleRepeat(){const on=document.getElementById('nb-repeat')?.checked;const opts=document.getElementById('nb-repeat-opts');if(opts)opts.style.display=on?'block':'none';if(on)previewRepeat();updateSubmitBtnLabel();}
function previewRepeat(){
  const dateEl=document.getElementById('nb-date'),rtypeEl=document.getElementById('nb-rtype'),rcountEl=document.getElementById('nb-rcount'),preview=document.getElementById('nb-rpreview');
  if(!dateEl||!preview)return;
  const startDate=new Date(dateEl.value+'T00:00:00');if(isNaN(startDate))return;
  const rtype=rtypeEl?.value||'weekly',count=Math.min(52,Math.max(2,Number(rcountEl?.value)||8));
  const DAYS=['日','一','二','三','四','五','六'];
  const dates=[new Date(startDate)];
  for(let i=1;i<count;i++){const prev=new Date(dates[dates.length-1]);if(rtype==='weekly')prev.setDate(prev.getDate()+7);else if(rtype==='biweekly')prev.setDate(prev.getDate()+14);else prev.setMonth(prev.getMonth()+1);dates.push(new Date(prev));}
  const chips=dates.map((d,i)=>'<span style="display:inline-block;padding:4px 10px;background:'+(i===0?'var(--navy)':'var(--navy-l)')+';color:'+(i===0?'#fff':'var(--navy)')+';border-radius:16px;font-size:12px;font-weight:600;margin:3px">'+(i===0?'⬤ ':'')+d.toLocaleDateString('sv-SE')+'（'+DAYS[d.getDay()]+'）</span>').join('');
  preview.innerHTML='<div style="font-size:11px;font-weight:700;color:var(--slate);margin-bottom:8px">預計建立 '+count+' 筆預約</div>'+chips;
  updateSubmitBtnLabel();
}

function submitNewBk(){
  const name=document.getElementById('nb-name')?.value.trim(),phone=document.getElementById('nb-phone')?.value.trim(),date=document.getElementById('nb-date')?.value,time=document.getElementById('nb-time')?.value||'09:00',tId=document.getElementById('nb-t')?.value||'Sky',svcId=document.getElementById('nb-s')?.value||'redcord',note=document.getElementById('nb-note')?.value||'',repeat=document.getElementById('nb-repeat')?.checked;
  if(!name||!phone){showToast('請填寫姓名與電話');return;}if(!date){showToast('請選擇預約日期');return;}
  const[hh,mm]=time.split(':');const startMin=Number(hh)*60+Number(mm);
  if(repeat){
    const rtype=document.getElementById('nb-rtype')?.value||'weekly',count=Math.min(52,Math.max(2,Number(document.getElementById('nb-rcount')?.value)||8));
    const startDate=new Date(date+'T00:00:00');let maxId=Math.max(...BOOKINGS.map(b=>b.id),0);
    for(let i=0;i<count;i++){const d=new Date(startDate);if(rtype==='weekly')d.setDate(startDate.getDate()+i*7);else if(rtype==='biweekly')d.setDate(startDate.getDate()+i*14);else d.setMonth(startDate.getMonth()+i);maxId++;const bk={id:maxId,name,phone,t:tId,svc:svcId,date:d.toLocaleDateString('sv-SE'),start:startMin,time,note,line:false,pay:'cash',status:'confirmed'};BOOKINGS.push(bk);BK_LOG[maxId]=[d.toLocaleDateString('sv-SE')+' '+time+'　預約成立（批次建立第'+(i+1)+'筆）'];}
    closeModal();renderCal();showToast('已建立 '+count+' 筆重複預約 ✓');
  }else{
    const maxId=Math.max(...BOOKINGS.map(b=>b.id),0)+1;BOOKINGS.push({id:maxId,name,phone,t:tId,svc:svcId,date,start:startMin,time,note,line:false,pay:'cash',status:'confirmed'});BK_LOG[maxId]=[date+' '+time+'　預約成立（後台建立）'];closeModal();renderCal();showToast('預約已建立 ✓');syncSingleBk(maxId);
  }
}

function togglePtTag(phone,tid,btn){
  const tags=getPtTags(phone);
  const t=PT_TAG_MAP[tid];
  if(tags.has(tid)){
    tags.delete(tid);
    btn.classList.remove('on');
    btn.style.background='';btn.style.fontWeight='';
    btn.textContent=t.name;
  } else {
    tags.add(tid);
    btn.classList.add('on');
    btn.style.background=t.color+'22';btn.style.fontWeight='700';
    btn.textContent='✓ '+t.name;
  }
}
function addCustomPtTag(phone){
  const name=document.getElementById('new-tag-inp')?.value.trim();

  const id='custom_'+Date.now();
  ALL_PT_TAGS.push({id,name,color});
  PT_TAG_MAP[id]={id,name,color};
  getPtTags(phone).add(id);
  const btns=document.getElementById('pt-tag-btns');
  if(btns){
    const btn=document.createElement('button');
    btn.className='pt-tag-toggle on';
    btn.style.cssText='border-color:'+color+'40;color:'+color+';background:'+color+'22;font-weight:700;';
    btn.innerHTML='✓ '+name;
    btn.onclick=function(){togglePtTag(phone,id,this);};
    btns.appendChild(btn);
  }
  if(document.getElementById('new-tag-inp')) document.getElementById('new-tag-inp').value='';
}
function removePtTag(phone,tid){

views.analytics=()=>{
  const completed=BOOKINGS.filter(b=>b.status==='completed');
  const monthDone=completed.filter(b=>b.date>='2026-06-01');
  const monthRev=monthDone.reduce((a,b)=>a+svcOf(b.svc).price,0);

  // 服務人次 + 營收
  const svcStats={};SERVICES.forEach(s=>{svcStats[s.id]={name:s.name,count:0,rev:0,color:['#1a4d68','#2DC8A0','#F59E0B','#8B5CF6','#EC4899','#38b6ff'][SERVICES.indexOf(s)%6]};});
  monthDone.forEach(b=>{if(svcStats[b.svc]){svcStats[b.svc].count++;svcStats[b.svc].rev+=svcOf(b.svc).price;}});
  const totalCount=monthDone.length||1;
  const svcArr=Object.values(svcStats).sort((a,b)=>b.count-a.count);
  const maxCount=Math.max(...svcArr.map(s=>s.count),1);

  const svcRows=svcArr.map(s=>{
    const pct=Math.round(s.count/totalCount*100);
    return '<div class="bar-row" style="align-items:center">'+
      '<div class="bl" style="font-size:12px">'+s.name+'</div>'+
      '<div class="bar-track" style="flex:1"><div class="bar-fill" style="width:'+Math.round(s.count/maxCount*100)+'%;background:'+s.color+';position:relative">'+
        '<span style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;color:#fff;font-weight:700">'+s.count+'</span>'+
      '</div></div>'+
      '<div style="min-width:90px;text-align:right;font-size:12px;color:var(--slate)">'+fmtNT(s.rev)+'　<span style="color:var(--mint-d);font-weight:700">'+pct+'%</span></div>'+
    '</div>';
  }).join('');

  // 治療師人次詳細
  const tStats=THERAPISTS.map(t=>{
    const bks=monthDone.filter(b=>b.t===t.id);
    const rev=bks.reduce((a,b)=>a+svcOf(b.svc).price,0);
    return {t,bks,rev,count:bks.length};
  }).sort((a,b)=>b.count-a.count);
  const maxT=Math.max(...tStats.map(x=>x.count),1);

  const tStatRows=tStats.map(({t,count,rev,bks})=>{
    const pct=Math.round(count/maxT*100);
    const noShow=BOOKINGS.filter(b=>b.t===t.id&&b.status==='no_show').length;
    return '<tr>'+

    donutPaths+

    '</svg><div class="donut-legend">'+legendRows+'</div></div>';

  return shell('analytics','營運分析',
    '<div class="stat-grid">'+
      '<div class="stat-card highlight"><div class="sc-n mint">'+monthDone.length+'</div><div class="sc-l">本月治療人次</div></div>'+
      '<div class="stat-card"><div class="sc-n">'+fmtNT(monthRev)+'</div><div class="sc-l">本月總營收</div></div>'+
      '<div class="stat-card"><div class="sc-n mint">'+Math.round(monthRev/(monthDone.length||1)).toLocaleString()+'</div><div class="sc-l">平均客單價（NT$）</div></div>'+

    '</div>'+
    '<div class="grid2">'+
      '<div class="card"><div class="card-head"><h3>服務人次分佈</h3></div><div class="card-body">'+donut+'</div></div>'+
      '<div class="card"><div class="card-head"><h3>服務人次 × 營收</h3></div><div class="card-body">'+svcRows+'</div></div>'+
    '</div>'+
    '<div class="card"><div class="card-head"><h3>治療師本月人次統計</h3></div><div class="card-body flush">'+
      '<table><thead><tr><th>治療師</th><th>人次</th><th>佔比</th><th>貢獻營收</th><th>備註</th></tr></thead><tbody>'+tStatRows+'</tbody></table>'+

function savePR(tid){
  const t=THERAPISTS.find(x=>x.id===tid);if(!t)return;
  const b=document.getElementById('ps-base')?.value;

  SERVICES.forEach(s=>{

}

// 每位治療師對每個服務項目可設定獨立抽成 %
const T_SVC_RATES = {
  Sky: {assess:30, myofascia:35, redcord:40, cranio:35, energy:40, cycling:45},
  B:   {assess:28, myofascia:32, redcord:32, cranio:30, energy:35, cycling:35},
  C:   {assess:28, myofascia:30, redcord:30, cranio:32, energy:30, cycling:30},
  D:   {assess:28, myofascia:30, redcord:32, cranio:28, energy:28, cycling:35},
  E:   {assess:28, myofascia:30, redcord:28, cranio:30, energy:38, cycling:30},
};
function getSvcRate(tid, svcId){
  return (T_SVC_RATES[tid]||{})[svcId] ?? THERAPISTS.find(t=>t.id===tid)?.rate ?? 30;
}
function calcComm(tid, bookings){
  return bookings.reduce((total, b)=>{
    const rate = getSvcRate(tid, b.svc);
    return total + Math.round(svcOf(b.svc).price * rate / 100);
  }, 0);
}

  const rows=THERAPISTS.map(t=>{

function rmSpec(tid,val){if(T_PROFILES[tid])T_PROFILES[tid].specialties=T_PROFILES[tid].specialties.filter(s=>s!==val);document.getElementById('frame').innerHTML=views.clinic();setTimeout(()=>therapistProfileModal(tid),50);}

function toggleSelectAll(chk){
  document.querySelectorAll('.send-chk:not(:disabled)').forEach(c=>c.checked=chk.checked);
}
function confirmSendEdu(id){
  const selected=[...document.querySelectorAll('.send-chk:checked:not(:disabled)')];
  if(!selected.length){showToast('請選擇至少一位病患');return;}
  const now=new Date().toLocaleString('sv-SE',{hour12:false}).slice(0,16);
  if(!EDU_SENT[id])EDU_SENT[id]=[];
  const existing=new Set(EDU_SENT[id].map(r=>r.phone));
  let newCount=0;
  selected.forEach(chk=>{
    if(!existing.has(chk.value)){
      EDU_SENT[id].push({phone:chk.value,name:chk.dataset.name,sentAt:now});
      newCount++;
    }
  });
  closeModal();
  document.getElementById('frame').innerHTML=views.education();
  showToast('已傳送給 '+newCount+' 位病患 ✓');
}
function sentCount(id){return (EDU_SENT[id]||[]).length;}
function sentHistory(id){
  const records=EDU_SENT[id]||[];
  if(!records.length)return '<div class="bp-empty">尚未傳送給任何病患</div>';
  return records.map(r=>'<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line);gap:10px">'+
    '<div style="flex:1"><div style="font-size:13px;font-weight:700">'+r.name+'</div><div style="font-size:11px;color:var(--slate)">'+r.phone+'</div></div>'+
    '<div style="font-size:11px;color:var(--slate)">'+r.sentAt+'</div>'+
  '</div>').join('');
}

// ── 排班設定 ──
const SCHED={Sky:{weeklyShifts:{1:[{start:'09:00',end:'18:00'}],2:[{start:'09:00',end:'18:00'}],4:[{start:'09:00',end:'18:00'}],5:[{start:'09:00',end:'18:00'}]},exceptions:[{id:'e1',date:'2026-06-24',type:'off',note:'端午節補假'}]},B:{weeklyShifts:{1:[{start:'10:00',end:'19:00'}],3:[{start:'10:00',end:'19:00'}],5:[{start:'10:00',end:'19:00'}],6:[{start:'10:00',end:'16:00'}]},exceptions:[]},C:{weeklyShifts:{2:[{start:'09:00',end:'17:00'}],3:[{start:'09:00',end:'17:00'}],4:[{start:'09:00',end:'17:00'}],6:[{start:'09:00',end:'14:00'}]},exceptions:[]},D:{weeklyShifts:{1:[{start:'09:00',end:'18:00'}],2:[{start:'09:00',end:'18:00'}],4:[{start:'09:00',end:'18:00'}],5:[{start:'09:00',end:'18:00'}],6:[{start:'09:00',end:'13:00'}]},exceptions:[]},E:{weeklyShifts:{3:[{start:'11:00',end:'20:00'}],4:[{start:'11:00',end:'20:00'}],5:[{start:'11:00',end:'20:00'}],6:[{start:'11:00',end:'20:00'}]},exceptions:[]}};
let schedWeekOffset=0;
views.schedule=()=>{
  const today=new Date('2026-06-17'),ws=new Date(today);ws.setDate(today.getDate()-today.getDay()+1+schedWeekOffset*7);
  const weekDays=[];for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);weekDays.push(d);}
  const DAYS=['日','一','二','三','四','五','六'];
  let hdrs='<div class="sched-hdr" style="border-right:1px solid rgba(255,255,255,.2)">治療師</div>';
  weekDays.forEach(d=>{const ds=d.toLocaleDateString('sv-SE'),isT=ds==='2026-06-17',dow=d.getDay();hdrs+='<div class="sched-hdr'+(isT?' today':'')+'" style="border-right:1px solid rgba(255,255,255,.2)">週'+DAYS[dow]+'<br><span style="font-size:14px;font-weight:800">'+d.getDate()+'</span></div>';});
  let tRows='';
  THERAPISTS.forEach(t=>{
    const sch=SCHED[t.id]||{weeklyShifts:{},exceptions:[]};
    tRows+='<div class="sched-label"><span class="dot" style="background:'+TC[t.id]+'"></span>'+t.name+'</div>';
    weekDays.forEach(d=>{
      const dow=d.getDay(),ds=d.toLocaleDateString('sv-SE'),exc=sch.exceptions.find(e=>e.date===ds),shifts=sch.weeklyShifts[dow]||[],hasShift=shifts.length>0;
      tRows+='<div class="sched-cell'+(exc?' exc':hasShift?'':' off')+'" onclick="schedCellClick(\''+t.id+'\','+dow+',\''+ds+'\')">'+
        (exc?'<div class="shift-tag exc-tag">'+exc.note+'</div>':hasShift?shifts.map(sh=>'<div class="shift-tag">'+sh.start+'–'+sh.end+'</div>').join(''):'<div class="shift-add">＋</div>')+
      '</div>';
    });
  });
  const weekStr=(ws.getMonth()+1)+'/'+ws.getDate()+' – '+(weekDays[6].getMonth()+1)+'/'+weekDays[6].getDate();
  return shell('schedule','排班設定',
    '<div class="row" style="margin-bottom:14px;justify-content:space-between"><div class="row" style="background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:4px"><button onclick="schedNav(-1)" style="width:28px;height:28px;border:none;background:none;border-radius:6px;font-size:16px;color:var(--slate)">‹</button><span style="font-size:13px;font-weight:600;min-width:130px;text-align:center">'+weekStr+'</span><button onclick="schedNav(1)" style="width:28px;height:28px;border:none;background:none;border-radius:6px;font-size:16px;color:var(--slate)">›</button></div><div class="row" style="gap:8px"><button onclick="schedNav(0)" class="btn gray sm">本週</button></div></div>'+
    '<div class="sched-grid">'+hdrs+tRows+'</div>');
};
function schedNav(d){if(d===0)schedWeekOffset=0;else schedWeekOffset+=d;document.getElementById('frame').innerHTML=views.schedule();}
function schedCellClick(tid,dow,date){
  const sch=SCHED[tid]||{weeklyShifts:{},exceptions:[]},exc=sch.exceptions.find(e=>e.date===date),shifts=sch.weeklyShifts[dow]||[];
  const DAYS=['日','一','二','三','四','五','六'],t=THERAPISTS.find(x=>x.id===tid);
  modal('<div class="modal-head" style="background:'+TC[tid]+'">'+t.name+'　排班編輯<button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="modal-body"><div style="font-size:13px;font-weight:600;margin-bottom:12px">'+date+'　（週'+DAYS[new Date(date+'T00:00:00Z').getUTCDay()]+'）</div>'+
    '<div class="sec-label">班別時段</div><div id="shift-slots">'+
    (shifts.length?shifts.map((sh,i)=>'<div class="row" style="margin-bottom:8px"><input type="time" value="'+sh.start+'" id="sh-s-'+i+'" style="padding:8px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><span style="color:var(--slate)">–</span><input type="time" value="'+sh.end+'" id="sh-e-'+i+'" style="padding:8px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><button onclick="removeShift('+i+')" class="btn sm danger" style="padding:6px 10px">×</button></div>').join('')
    :'<div style="color:var(--slate);font-size:13px;padding:8px 0">此日無排班（休診）</div>')+
    '</div><button onclick="addShiftSlot()" class="btn ghost sm" style="margin-top:8px">＋ 新增時段</button>'+
    '<div class="sec-label" style="margin-top:16px">例外設定</div>'+
    '<div class="grid2"><div class="field"><label>類型</label><select id="exc-type" style="width:100%;padding:8px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><option value="">— 無例外 —</option><option value="off"'+(exc&&exc.type==='off'?' selected':'')+'>休假 / 請假</option><option value="special"'+(exc&&exc.type==='special'?' selected':'')+'>特殊安排</option></select></div>'+
    '<div class="field"><label>說明</label><input id="exc-note" value="'+(exc?exc.note:'')+'" placeholder="如：端午假期" style="width:100%;padding:8px;border:1.5px solid var(--mist);border-radius:8px;outline:none"></div></div>'+
    '</div><div class="modal-foot"><button class="btn gray" onclick="closeModal()">取消</button><button class="btn" onclick="saveShift(\''+tid+'\','+dow+',\''+date+'\')">儲存</button></div>');
}
function addShiftSlot(){const c=document.getElementById('shift-slots');const n=c.querySelectorAll('.row').length;const div=document.createElement('div');div.className='row';div.style.marginBottom='8px';div.innerHTML='<input type="time" value="09:00" id="sh-s-'+n+'" style="padding:8px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><span style="color:var(--slate)">–</span><input type="time" value="18:00" id="sh-e-'+n+'" style="padding:8px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><button onclick="this.parentElement.remove()" class="btn sm danger" style="padding:6px 10px">×</button>';c.appendChild(div);}
function removeShift(i){const r=document.getElementById('shift-slots').querySelectorAll('.row')[i];if(r)r.remove();}
function saveShift(tid,dow,date){if(!SCHED[tid])SCHED[tid]={weeklyShifts:{},exceptions:[]};const slots=[];document.getElementById('shift-slots').querySelectorAll('.row').forEach((_,i)=>{const s=document.getElementById('sh-s-'+i),e=document.getElementById('sh-e-'+i);if(s&&e)slots.push({start:s.value,end:e.value});});SCHED[tid].weeklyShifts[dow]=slots;const excType=document.getElementById('exc-type')?.value,excNote=document.getElementById('exc-note')?.value;SCHED[tid].exceptions=SCHED[tid].exceptions.filter(e=>e.date!==date);if(excType)SCHED[tid].exceptions.push({id:'e'+Date.now(),date,type:excType,note:excNote});closeModal();document.getElementById('frame').innerHTML=views.schedule();showToast('排班已儲存 ✓');}

  return shell('packages','課程套餐','<div class="grid2"><div class="card"><div class="card-head"><h3>套餐目錄（'+PKG_DEFS.length+'）</h3><button class="btn sm" onclick="newPkgModal()">＋ 新增套餐</button></div><div class="card-body" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+pkgCards+'</div></div><div class="card"><div class="card-head"><h3>個案套餐</h3><button class="btn sm" onclick="sellPkgModal()">販售套餐</button></div><div class="card-body flush"><table><thead><tr><th>個案</th><th>套餐</th><th>使用進度</th><th>到期日</th><th>狀態</th><th></th></tr></thead><tbody>'+ptRows+'</tbody></table></div></div></div>');
};
function newPkgModal(){const sOpts=SERVICES.map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('');modal('<div class="modal-head" style="background:var(--navy)">新增套餐<button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>套餐名稱</label><input id="np-name" placeholder="如：紅繩懸吊 10 堂課程"></div><div class="field"><label>適用服務</label><select id="np-svc" style="width:100%;padding:9px;border:1.5px solid var(--mist);border-radius:8px;outline:none">'+sOpts+'</select></div><div class="grid2"><div class="field"><label>堂數</label><input id="np-ses" type="number" value="10" min="1"></div><div class="field"><label>售價（NT$）</label><input id="np-price" type="number" value="14000" min="0"></div></div><div class="grid2"><div class="field"><label>有效天數</label><input id="np-days" type="number" value="365" min="1"></div><div class="field"><label>備註說明</label><input id="np-note" placeholder="選填"></div></div></div><div class="modal-foot"><button class="btn gray" onclick="closeModal()">取消</button><button class="btn" onclick="submitNewPkg()">建立套餐</button></div>');}
function submitNewPkg(){const name=document.getElementById('np-name')?.value.trim();if(!name){showToast('請填寫套餐名稱');return;}PKG_DEFS.push({id:'pkg'+Date.now(),name,serviceId:document.getElementById('np-svc')?.value,sessions:Number(document.getElementById('np-ses')?.value||10),price:Number(document.getElementById('np-price')?.value||0),validityDays:Number(document.getElementById('np-days')?.value||365),note:document.getElementById('np-note')?.value||'',active:true});closeModal();document.getElementById('frame').innerHTML=views.packages();showToast('套餐已建立 ✓');}
function editPkgModal(id){const p=PKG_DEFS.find(x=>x.id===id);if(!p)return;modal('<div class="modal-head" style="background:var(--navy)">編輯套餐<button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>套餐名稱</label><input id="ep-name" value="'+p.name+'"></div><div class="grid2"><div class="field"><label>堂數</label><input id="ep-ses" type="number" value="'+p.sessions+'"></div><div class="field"><label>售價（NT$）</label><input id="ep-price" type="number" value="'+p.price+'"></div></div><div class="field"><label>有效天數</label><input id="ep-days" type="number" value="'+p.validityDays+'"></div><div class="field"><label>備註</label><input id="ep-note" value="'+(p.note||'')+'"></div><label class="row" style="font-size:13px;gap:8px"><input type="checkbox" id="ep-active" '+(p.active?'checked':'')+' style="width:auto;accent-color:var(--mint)"> 上架販售</label></div><div class="modal-foot"><button class="btn gray" onclick="closeModal()">取消</button><button class="btn" onclick="saveEditPkg(\''+id+'\')">儲存</button></div>');}
function saveEditPkg(id){const p=PKG_DEFS.find(x=>x.id===id);if(!p)return;const n=document.getElementById('ep-name')?.value;if(n)p.name=n;p.sessions=Number(document.getElementById('ep-ses')?.value)||p.sessions;p.price=Number(document.getElementById('ep-price')?.value)||p.price;p.validityDays=Number(document.getElementById('ep-days')?.value)||p.validityDays;p.note=document.getElementById('ep-note')?.value||'';p.active=document.getElementById('ep-active')?.checked!==false;closeModal();document.getElementById('frame').innerHTML=views.packages();showToast('套餐已更新 ✓');}
function sellPkgModal(){const pkgOpts=PKG_DEFS.filter(p=>p.active).map(p=>'<option value="'+p.id+'">'+p.name+'（'+p.sessions+'堂 NT$'+p.price.toLocaleString()+'）</option>').join('');const ptOpts=BOOKINGS.reduce((acc,b)=>{if(!acc.find(x=>x.phone===b.phone))acc.push({phone:b.phone,name:b.name});return acc;},[]).map(pt=>'<option value="'+pt.phone+'">'+pt.name+'　'+pt.phone+'</option>').join('');modal('<div class="modal-head" style="background:var(--navy)">販售套餐給個案<button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>選擇套餐</label><select id="sp-pkg" onchange="updateSellInfo()" style="width:100%;padding:9px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><option value="">— 請選擇 —</option>'+pkgOpts+'</select></div><div id="sp-info" style="background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--slate);margin-bottom:14px">選擇套餐後顯示詳細資訊</div><div class="field"><label>選擇個案</label><select id="sp-pt" style="width:100%;padding:9px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><option value="">— 請選擇 —</option>'+ptOpts+'</select></div></div><div class="modal-foot"><button class="btn gray" onclick="closeModal()">取消</button><button class="btn" onclick="submitSellPkg()">確認販售</button></div>');}
function updateSellInfo(){const id=document.getElementById('sp-pkg')?.value,p=PKG_DEFS.find(x=>x.id===id),info=document.getElementById('sp-info');if(!p||!info){if(info)info.textContent='選擇套餐後顯示詳細資訊';return;}info.innerHTML='<b>'+p.name+'</b>　'+(svcOf(p.serviceId)?.name||p.serviceId)+'　'+p.sessions+'堂　NT$'+p.price.toLocaleString()+'　有效期 '+p.validityDays+' 天';}
function submitSellPkg(){const pkgId=document.getElementById('sp-pkg')?.value,ptPhone=document.getElementById('sp-pt')?.value;if(!pkgId||!ptPhone){showToast('請選擇套餐與個案');return;}const pkg=PKG_DEFS.find(x=>x.id===pkgId),ptName=BOOKINGS.find(b=>b.phone===ptPhone)?.name||'';const expiry=new Date();expiry.setDate(expiry.getDate()+(pkg.validityDays||365));PT_PKGS.push({id:'pp'+Date.now(),packageId:pkgId,packageName:pkg.name,serviceId:pkg.serviceId,patientPhone:ptPhone,patientName:ptName,totalSessions:pkg.sessions,usedSessions:0,price:pkg.price,expiryDate:expiry.toLocaleDateString('sv-SE'),purchaseDate:new Date().toLocaleDateString('sv-SE'),redemptions:[],status:'active'});closeModal();document.getElementById('frame').innerHTML=views.packages();showToast('套餐已販售給 '+ptName+' ✓');}
function redeemModal(ppId){const pp=PT_PKGS.find(x=>x.id===ppId);if(!pp)return;const remaining=pp.totalSessions-pp.usedSessions;modal('<div class="modal-head" style="background:var(--mint)">核銷套餐<button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div style="background:var(--bg);border-radius:10px;padding:14px;margin-bottom:14px"><div style="font-size:14px;font-weight:700;margin-bottom:4px">'+pp.packageName+'</div><div style="font-size:13px;color:var(--slate)">個案：'+pp.patientName+'</div><div style="font-size:13px;color:var(--slate);margin-top:6px">剩餘堂數：<b style="color:var(--mint-d);font-size:18px">'+remaining+'</b> / '+pp.totalSessions+'堂</div><div class="pp-bar" style="margin-top:8px"><div class="pp-fill" style="width:'+(pp.usedSessions/pp.totalSessions*100)+'%"></div></div></div><div class="field"><label>核銷說明（選填）</label><input id="rd-note" placeholder="如：2026-06-17 紅繩訓練第5次"></div></div><div class="modal-foot"><button class="btn gray" onclick="closeModal()">取消</button><button class="btn" onclick="doRedeem(\''+ppId+'\')">確認核銷 1 堂</button></div>');}
function doRedeem(ppId){const pp=PT_PKGS.find(x=>x.id===ppId);if(!pp)return;if(pp.usedSessions>=pp.totalSessions){showToast('堂數已用完');return;}pp.usedSessions++;pp.redemptions=pp.redemptions||[];pp.redemptions.push({date:new Date().toLocaleDateString('sv-SE'),note:document.getElementById('rd-note')?.value||''});if(pp.usedSessions>=pp.totalSessions)pp.status='exhausted';closeModal();document.getElementById('frame').innerHTML=views.packages();showToast('核銷成功！剩餘 '+(pp.totalSessions-pp.usedSessions)+' 堂');}

  '<div class="banner warn"><span>⚠️</span><div><b>資料未持久化</b>　重新部署時資料會清空。請在 Render 加掛持久磁碟並設定 DATA_DIR 環境變數。</div></div>');

// ── 客戶預約 ──
views.book=()=>{
  if(!window._bk)window._bk={step:0,svc:null,t:null,date:null,time:null,lineLogin:false,name:'',phone:''};
  const bk=window._bk;const STEPS=['選擇服務','選擇治療師','選擇日期','選擇時段','確認預約'];
  const ico={assess:'🩺',myofascia:'💆',redcord:'🔵',cranio:'🧠',energy:'✨',cycling:'🚲'};
  const svcItems=SERVICES.map(s=>'<div class="svc-card'+(bk.svc===s.id?' sel':'')+'" onclick="bkSel(\'svc\',\''+s.id+'\')"><div class="svc-ic">'+(ico[s.id]||'💊')+'</div><div><div class="svc-name">'+s.name+'</div><div class="svc-meta">'+s.dur+' 分鐘</div></div><div class="svc-price">NT$'+s.price.toLocaleString()+'</div></div>').join('');
  const anyCard='<div class="t-card'+(bk.t==="any"?' sel':'')+'" onclick="window._bk.t=\'any\';bkRefresh()"><div class="t-av" style="background:var(--slate)">🎲</div><div><div class="t-name">不指定治療師</div><div class="t-meta">系統自動安排最近空檔</div></div><div class="t-avail" style="color:var(--mint-d)">最快</div></div>';
  const tCards=THERAPISTS.map((t,i)=>{const sel=(bk.t===t.id)?' sel':'';const initials=(t.name||'T').replace(/[^\u4e00-\u9fff]/g,'').slice(-2)||'PT';return '<div class="t-card'+sel+'" onclick="bkSel(\'t\',\''+t.id+'\')"><div class="t-av" style="background:'+TC[t.id]+'">'+initials+'</div><div><div class="t-name">'+t.name+'</div><div class="t-meta">'+t.title+'</div></div><div class="t-avail" style="color:var(--slate)">最近 '+[2,3,4,1,3][i]+' 天後</div></div>';}).join('');
  const calYear=2026,calMon=5,firstDay=new Date(calYear,calMon,1).getDay(),lastDate=new Date(calYear,calMon+1,0).getDate();
  const DOW=['日','一','二','三','四','五','六'];
  let calHTML='<div class="bk-cal"><div class="bk-cal-head"><button onclick="event.stopPropagation()">‹</button><b>2026 年 6 月</b><button onclick="event.stopPropagation()">›</button></div><div class="bk-cal-grid">'+DOW.map(d=>'<div class="dow">'+d+'</div>').join('');
  for(let i=0;i<firstDay;i++)calHTML+='<div class="day empty"></div>';
  for(let d=1;d<=lastDate;d++){const ds='2026-06-'+String(d).padStart(2,'0');const isT=d===17,isPast=d<17,isOff=(new Date(calYear,calMon,d).getDay()===0);const sel=bk.date===ds?' sel':'';const cls='day'+(isT?' today':'')+(isPast?' past':'')+(isOff&&!isPast?' off':'')+sel;const act=(!isPast&&!isOff)?'onclick="bkSel(\'date\',\''+ds+'\')"':'';calHTML+='<div class="'+cls+'" '+act+'>'+d+'</div>';}
  calHTML+='</div></div>';
  const allSlots=['09:00','09:30','10:00','10:30','11:00','11:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30'];
  const takenSlots=['09:00','10:00','14:00'];
  const slotHTML=bk.date?'<div class="slot-grid">'+allSlots.map(sl=>{const taken=takenSlots.includes(sl),sel=bk.time===sl?' sel':'';const act=taken?'':('onclick="bkSel(\'time\',\''+sl+'\')"');return '<div class="slot'+(taken?' taken':'')+sel+'" '+act+'>'+sl+(taken?'<br><span style="font-size:9px;opacity:.5">已預約</span>':'')+'</div>';}).join('')+'</div>':'<div style="color:var(--slate);padding:20px;text-align:center;font-size:13px">請先選擇日期</div>';
  const selSvc=SERVICES.find(s=>s.id===bk.svc)||SERVICES[2],selT=bk.t&&bk.t!=='any'?THERAPISTS.find(t=>t.id===bk.t):null;
  const lineSection=bk.lineLogin?'<div class="line-logged"><div style="width:32px;height:32px;background:#06C755;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800">L</div><div><div style="font-weight:700">LINE 已登入</div><div style="font-size:11px;color:var(--slate)">基本資料已自動帶入</div></div></div>':'<button class="line-login-btn" onclick="bkLineLogin()"><div class="ic"><span style="color:#06C755;font-weight:900">L</span></div>LINE 快速登入（自動帶入姓名電話）</button>';
  const confirmHTML='<div class="bk-summary"><div class="bk-sum-row"><span>服務</span><span>'+selSvc.name+'</span></div><div class="bk-sum-row"><span>治療師</span><span>'+(selT?selT.name:'不指定')+'</span></div><div class="bk-sum-row"><span>日期時間</span><span>'+(bk.date||'—')+' '+(bk.time||'—')+'</span></div><div class="bk-sum-row"><span>費用</span><span>NT$'+selSvc.price.toLocaleString()+'</span></div></div>'+lineSection+'<input class="bk-inp" id="bk-f-name" placeholder="姓名 *" value="'+(bk.name||'')+'" oninput="window._bk.name=this.value"><input class="bk-inp" id="bk-f-phone" placeholder="聯絡電話 *" type="tel" value="'+(bk.phone||'')+'" oninput="window._bk.phone=this.value"><textarea class="bk-inp" id="bk-f-note" placeholder="備註（選填）" style="height:64px;resize:none"></textarea>';
  const bodies=[svcItems,anyCard+tCards,calHTML,slotHTML,confirmHTML];
  const nextLabels=['下一步 →','下一步 →','下一步 →','下一步 →','確認預約 ✓'];
  const canNext=[!!bk.svc,!!bk.t,!!bk.date,!!bk.time,true];
  if(bk.step===99)return '<div style="background:var(--bg);padding:28px 16px;min-height:620px"><div class="bk-phone"><div class="bk-hero"><h1>領航物理治療所</h1><p>預約確認</p></div><div style="text-align:center;padding:36px 20px"><div style="width:64px;height:64px;background:var(--mint-l);border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2DC8A0" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div><h2 style="font-size:18px;font-weight:700;margin-bottom:8px">預約成功！</h2><p style="font-size:13px;color:var(--slate);line-height:1.7">我們已收到您的預約<br>確認通知將透過 LINE 傳送</p></div></div></div>';
  return '<div style="background:var(--bg);padding:28px 16px;min-height:620px"><div class="bk-phone"><div class="bk-hero"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h1>領航物理治療所</h1><p>線上預約　'+STEPS[bk.step]+'（'+(bk.step+1)+'/5）</p></div>'+(bk.step===4?'<div class="bk-line-bar" onclick="bkLineLogin()">'+(bk.lineLogin?'LINE 已登入 ✓':'LINE 登入')+'</div>':'')+'</div><div class="bk-progress" style="margin-top:12px"><div class="bk-progress-fill" style="width:'+(bk.step/4*100).toFixed(0)+'%"></div></div></div><div class="bk-body"><div class="bk-label">'+STEPS[bk.step]+'</div>'+bodies[bk.step]+'</div><div class="bk-nav">'+(bk.step>0?'<button class="bk-back" onclick="bkNav(-1)">← 返回</button>':'')+'<button class="bk-next" onclick="bkNav(1)" '+(canNext[bk.step]?'':'disabled="disabled"')+'>'+nextLabels[bk.step]+'</button></div></div></div>';
};
function bkRefresh(){document.getElementById('frame').innerHTML=views.book();}
function bkSel(key,val){if(!window._bk)window._bk={step:0,svc:null,t:null,date:null,time:null,lineLogin:false,name:'',phone:''};window._bk[key]=val;bkRefresh();}
function bkNav(d){
  if(!window._bk)window._bk={step:0,svc:null,t:null,date:null,time:null,lineLogin:false,name:'',phone:''};
  const bk=window._bk,next=bk.step+d;if(next<0)return;
  if(next>=5){const name=document.getElementById('bk-f-name')?.value.trim(),phone=document.getElementById('bk-f-phone')?.value.trim();if(!name||!phone){showToast('請填寫姓名與電話');return;}bk.name=name;bk.phone=phone;bk.step=99;bkRefresh();showToast('預約成功！LINE 確認通知即將發送 ✓');setTimeout(()=>{window._bk={step:0,svc:null,t:null,date:null,time:null,lineLogin:false,name:'',phone:''};},6000);return;}
  bk.step=next;bkRefresh();
}
function bkLineLogin(){if(!window._bk)window._bk={step:0,svc:null,t:null,date:null,time:null,lineLogin:false,name:'',phone:''};window._bk.lineLogin=true;window._bk.name='王小明';window._bk.phone='0911-222-333';bkRefresh();showToast('LINE 登入成功！資料已帶入 ✓');}

// ── 搜尋 ──
function filterRows(tbodyId,q){
  q=q.toLowerCase().trim();const rows=document.querySelectorAll('#'+tbodyId+' tr');let count=0;
  rows.forEach(tr=>{const txt=(tr.dataset.s||tr.textContent).toLowerCase();const show=!q||txt.includes(q);tr.classList.toggle('hidden-row',!show);if(show)count++;});
  const wrap=document.getElementById(tbodyId);if(wrap){let noRes=wrap.nextElementSibling;if(!noRes||!noRes.classList.contains('no-results-row')){noRes=document.createElement('tr');noRes.className='no-results-row';noRes.innerHTML='<td colspan="10" style="text-align:center;padding:24px;color:var(--slate)">找不到符合的結果</td>';wrap.parentNode&&wrap.parentNode.appendChild(noRes);}noRes.style.display=count===0&&q?'':'none';}
}

// ── 初始化 ──
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});
document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
function go(v){
  if(typeof views[v]!=='function'){showToast('此頁面開發中');return;}
  // 權限檢查（登入頁和客戶頁不限制）
  const publicPages=['login','book','intake'];
  if(!publicPages.includes(v)&&currentUser&&!currentUser.pages.includes(v)){
    showToast('您沒有此頁面的存取權限');return;
  }
  document.getElementById('frame').innerHTML=views[v]();
  document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  if(v==='bookings')calToday();
}
go('login');
setTimeout(initGCalClient, 1500); // init after GAPI loads
