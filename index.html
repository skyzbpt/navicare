<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>領航物理治療所 管理系統</title>
<style>
:root{
  --navy:#1a4d68;--navy-d:#123b52;--navy-l:#eef4f7;
  --mint:#2DC8A0;--mint-d:#1f9e7e;--mint-l:#edfaf6;
  --slate:#6b8a9c;--mist:#dce6ec;--line:#eef3f6;--bg:#f6fafb;
  --warn:#e0992a;--danger:#e05c5c;--ink:#1f3a47;
  --r:14px;--r-sm:10px;--r-lg:20px;
  --sh:0 1px 3px rgba(26,77,104,.05);
  --sh-md:0 4px 16px rgba(26,77,104,.08);
  --sh-lg:0 12px 48px rgba(26,77,104,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',-apple-system,'Segoe UI',sans-serif;background:#e8f0f4;color:var(--ink);font-size:13px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
::placeholder{color:#a8bcc8}
.outer{max-width:1180px;margin:0 auto;padding:24px 16px}
.switcher{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.sw-label{font-size:12px;color:var(--slate);font-weight:600;margin-right:2px}
.sw{padding:7px 13px;border-radius:999px;border:1px solid var(--mist);background:#fff;font-size:12px;font-weight:500;color:var(--slate);transition:.15s}
.sw.active{background:var(--navy);border-color:var(--navy);color:#fff}
.sw:hover:not(.active){border-color:var(--mint);color:var(--mint-d)}
.frame{background:#fff;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-lg);min-height:620px}

.btn{padding:10px 18px;background:var(--mint);color:#fff;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:600;transition:.15s}
.btn:hover{background:var(--mint-d)}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:8px}
.btn.ghost{background:var(--mint-l);color:var(--mint-d)}
.btn.ghost:hover{background:#def5ee}
.btn.gray{background:#f0f5f7;color:var(--slate)}
.btn.gray:hover{background:#e6eef2}
.btn.danger{background:#fdecec;color:var(--danger)}
.btn.danger:hover{background:#fbdede}
.tag{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:600}
.tag.green{background:#e3f6ea;color:#1a8a4f}
.tag.gray{background:#eef3f6;color:var(--slate)}
.tag.mint{background:var(--mint-l);color:var(--mint-d)}
.tag.amber{background:#fdf3e0;color:#b07818}

.login-wrap{min-height:620px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#eef4f7,#edfaf6)}
.login-box{background:#fff;border-radius:var(--r-lg);padding:40px 38px;width:340px;box-shadow:var(--sh-md);text-align:center}
.login-logo{width:54px;height:54px;background:var(--navy);border-radius:15px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.login-box h2{font-size:18px;margin-bottom:4px}
.login-box p{font-size:12px;color:var(--slate);margin-bottom:24px}

.layout{display:flex;min-height:620px}
.sidebar{width:220px;background:var(--navy);color:#fff;flex-shrink:0;padding:16px 0;display:flex;flex-direction:column}
.brand{padding:0 18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .ic{width:34px;height:34px;background:var(--mint);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand b{font-size:13px;display:block}
.brand span{font-size:10px;color:#9fc0d4}
.menu{padding:10px;flex:1;overflow-y:auto}
.menu-group{font-size:10px;color:#6f9bb5;font-weight:700;letter-spacing:1px;padding:13px 12px 5px}
.menu a{display:flex;align-items:center;gap:11px;padding:9px 12px;color:#c2d6e2;border-radius:var(--r-sm);font-size:13px;font-weight:500;margin-bottom:2px;cursor:pointer;transition:.15s}
.menu a:hover{background:rgba(255,255,255,.06);color:#fff}
.menu a.active{background:var(--mint);color:#fff}
.menu a svg{width:17px;height:17px;flex-shrink:0;opacity:.9}
.s-logout{margin:8px 12px 0;padding:9px;background:rgba(255,255,255,.06);color:#c2d6e2;border:none;border-radius:var(--r-sm);font-size:12px}
.s-logout:hover{background:rgba(255,255,255,.1)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.topbar h2{font-size:17px}
.content{padding:24px;background:var(--bg);flex:1;overflow:auto}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:var(--r);border:1px solid var(--line);padding:16px 18px;box-shadow:var(--sh)}
.stat-card .sc-n{font-size:26px;font-weight:900;color:var(--navy);line-height:1.1}
.stat-card .sc-n.mint{color:var(--mint-d)}
.stat-card .sc-l{font-size:12px;color:var(--slate);margin-top:5px}
.stat-card.highlight{border-color:var(--mint);background:var(--mint-l)}
.stat-card.highlight .sc-n{color:var(--mint-d)}

.card{background:#fff;border-radius:var(--r);border:1px solid var(--line);margin-bottom:16px;overflow:hidden;box-shadow:var(--sh)}
.card-head{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-head h3{font-size:14px}
.card-body{padding:20px}
.card-body.flush{padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 18px;font-size:11px;color:var(--slate);font-weight:700;background:var(--bg);border-bottom:1px solid var(--line)}
td{padding:12px 18px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.t-name{font-weight:600}
.t-sub{font-size:11px;color:var(--slate)}
.num{font-variant-numeric:tabular-nums}

.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border:1.5px solid var(--mist);border-radius:var(--r-sm);outline:none;transition:.15s;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mint)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .bl{width:120px;font-size:12px;color:var(--slate);flex-shrink:0}
.bar-track{flex:1;background:var(--bg);border-radius:6px;height:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;min-width:2px}
.bar-row .bv{width:80px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0}
.banner{padding:12px 16px;border-radius:var(--r-sm);font-size:12px;margin-bottom:14px;display:flex;gap:8px;line-height:1.7}
.banner.info{background:var(--navy-l);border:1px solid #bcd6e6;color:var(--navy)}
.status-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.status-row:last-child{border-bottom:none}
.empty{text-align:center;color:var(--slate);padding:44px 20px;font-size:13px}

.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap input{padding:9px 32px 9px 13px;border:1.5px solid var(--mist);border-radius:9px;outline:none;font-size:13px;min-width:180px}
.search-wrap input:focus{border-color:var(--mint)}
.s-clear{position:absolute;right:8px;background:none;border:none;font-size:15px;color:var(--slate);cursor:pointer}

.modal-bg{position:fixed;inset:0;background:rgba(26,77,104,.38);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);width:460px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:var(--sh-lg)}
.modal-head{padding:16px 22px;color:#fff;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.modal-head .x{background:rgba(255,255,255,.2);border:none;width:30px;height:30px;border-radius:9px;font-size:18px;color:#fff;line-height:1;cursor:pointer}
.modal-head .x:hover{background:rgba(255,255,255,.32)}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}

.edit-tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg)}
.edit-tab{padding:12px 18px;border:none;background:none;font-size:13px;font-weight:600;color:var(--slate);cursor:pointer;border-bottom:2px solid transparent}
.edit-tab.active{color:var(--mint-d);border-bottom-color:var(--mint)}
.edit-panel{display:none;padding:18px 22px}
.edit-panel.active{display:block}
.sec-label{font-size:11px;font-weight:700;color:var(--slate);letter-spacing:.5px;margin:16px 0 10px}
.sec-label:first-child{margin-top:0}

.pay-pills{display:flex;gap:7px;flex-wrap:wrap}
.pay-pill{padding:7px 15px;border:1.5px solid var(--mist);border-radius:999px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--slate);transition:.15s;font-family:inherit}
.pay-pill.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.status-picker{display:flex;gap:7px;flex-wrap:wrap}
.sp{padding:8px 15px;border-radius:999px;border:1.5px solid var(--mist);font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:var(--slate)}
.sp.sel{background:var(--navy);border-color:var(--navy);color:#fff}

#sToast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 24px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--sh-md);white-space:pre-line;text-align:center}
#sToast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* VAS */
.vas-grid{display:flex;gap:5px;flex-wrap:wrap}
.vas-btn{width:38px;height:38px;border-radius:9px;border:2px solid var(--mist);background:#fff;font-size:14px;font-weight:700;cursor:pointer;color:var(--slate);transition:.12s}
.vas-btn.sel{color:#fff;transform:scale(1.08)}
.vas-cur{font-size:12px;color:var(--slate);margin-top:8px}

/* body regions */
.bp-grid{display:flex;flex-wrap:wrap;gap:6px}
.bp-btn{padding:7px 12px;border-radius:8px;border:1.5px solid var(--mist);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--slate);transition:.12s;font-family:inherit}
.bp-btn.sel{background:var(--mint);border-color:var(--mint);color:#fff}

/* SOAP */
.soap-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--sh);margin-bottom:14px}
.soap-card-head{padding:13px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px}
.soap-card-body{padding:18px}
.soap-card-body.collapsed{display:none}
.soap-sec{margin-bottom:14px}
.soap-sec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;font-weight:700}
.badge{width:22px;height:22px;border-radius:6px;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.badge.S{background:#3b82f6}.badge.O{background:var(--mint)}.badge.A{background:#f59e0b}.badge.P{background:#8b5cf6}
.soap-sec textarea{width:100%;padding:9px 12px;border:1.5px solid var(--mist);border-radius:8px;outline:none;resize:vertical;min-height:62px;font-family:inherit;font-size:13px;line-height:1.6}
.soap-sec textarea:focus{border-color:var(--mint)}
.chev{display:inline-flex;transition:transform .2s}

/* education */
.edu-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.edu-row{display:flex;align-items:center;gap:14px;background:#fff;padding:14px 16px}
.edu-row:hover{background:var(--bg)}
.edu-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.edu-body{flex:1;min-width:0}
.edu-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.edu-title{font-size:14px;font-weight:700;margin:3px 0}
.edu-desc{font-size:11px;color:var(--slate);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.edu-meta{font-size:10px;color:var(--slate);margin-top:3px}

/* schedule */
.day-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;margin-bottom:10px}
.day-card.off{background:var(--bg)}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.day-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700}
.day-badge{width:26px;height:26px;border-radius:8px;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.shift-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.shift-name{flex:0 0 100px;padding:8px 10px;border:1.5px solid var(--mist);border-radius:8px;outline:none;font-family:inherit;font-size:13px;font-weight:600}
.shift-time{padding:8px 10px;border:1.5px solid var(--mist);border-radius:8px;outline:none;font-family:inherit;font-size:13px}
.shift-del{width:30px;height:30px;flex-shrink:0;border:none;border-radius:8px;background:#fdecec;color:var(--danger);font-size:16px;cursor:pointer}

/* packages */
.pkg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pkg-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:18px;cursor:pointer;box-shadow:var(--sh);transition:.15s}
.pkg-card:hover{border-color:var(--mint);box-shadow:var(--sh-md)}
.pkg-name{font-size:15px;font-weight:700;margin-bottom:3px}
.pkg-svc{font-size:11px;color:var(--mint-d);font-weight:600}
.pkg-price{font-size:24px;font-weight:900;color:var(--navy);margin:8px 0 4px}
.pkg-orig{font-size:12px;color:var(--slate);text-decoration:line-through;margin-left:6px}
.pkg-desc{font-size:11px;color:var(--slate);border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.pkg-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--slate);border-style:dashed;min-height:130px;font-weight:600}
.pkg-add:hover{color:var(--mint-d);background:var(--mint-l)}

/* calendar */
.cal-pill{display:flex;align-items:center;gap:5px;padding:5px 11px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--slate);font-family:inherit}
.cal-pill.active{background:var(--navy);border-color:var(--navy);color:#fff}
.cal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* intake / receipt */
.intake-wrap{min-height:620px;background:var(--bg)}
.intake-top{background:var(--navy);color:#fff;padding:20px 24px}
.intake-steps{display:flex;gap:4px;padding:18px 24px 0;max-width:640px;margin:0 auto}
.istep{flex:1;height:4px;border-radius:2px;background:var(--mist)}
.istep.done{background:var(--mint)}.istep.cur{background:#fff;box-shadow:inset 0 0 0 1px var(--navy)}
.intake-card{max-width:640px;margin:16px auto 24px;background:#fff;border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.gender-btn{padding:9px 20px;border:1.5px solid var(--mist);border-radius:999px;background:#fff;color:var(--slate);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.gender-btn.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.consent-box{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:16px;height:240px;overflow-y:auto;font-size:12px;line-height:2;white-space:pre-wrap;margin-bottom:14px}
.receipt{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',serif;max-width:420px;margin:0 auto;padding:24px 28px;background:#fff;border:1px solid #ccc;font-size:13px;color:#111;line-height:1.9}
.rc-head{text-align:center;border-bottom:2.5px double #111;padding-bottom:12px;margin-bottom:14px}
.rc-clinic{font-size:18px;font-weight:900;letter-spacing:1px}
.rc-reg{font-size:10px;color:#555;margin-top:2px}
.rc-title{font-size:22px;font-weight:900;letter-spacing:6px;margin:6px 0 2px}
.rc-no{font-size:11px;color:#555}
.rc-sect{margin-bottom:12px}
.rc-st{font-size:11px;font-weight:700;color:#555;border-bottom:1px solid #ddd;padding-bottom:3px;margin-bottom:8px}
.rc-r{display:flex;gap:8px;margin-bottom:3px}
.rc-k{min-width:84px;color:#555;font-size:12px;flex-shrink:0}
.rc-v{font-size:12px;font-weight:600}
.rc-total{display:flex;justify-content:space-between;border-top:2px solid #111;padding-top:8px;margin-top:6px;font-size:15px;font-weight:900}
.rc-foot{font-size:10px;color:#555;border-top:1px solid #ddd;padding-top:10px;margin-top:14px;line-height:1.9}
.rc-stamps{display:flex;justify-content:space-around;margin-top:18px;padding-top:14px;border-top:1px dashed #ccc}
.rc-stamp{text-align:center}
.rc-stamp .sl{font-size:10px;color:#888;margin-bottom:6px}

@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:fixed;top:0;left:50%;transform:translateX(-50%);background:#fff;padding:24px;border:none !important;box-shadow:none !important}
  .no-print{display:none !important}
  @page{margin:12mm}
}

@media(max-width:880px){
  .outer{padding:12px 8px}
  .layout{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:8px;gap:4px}
  .brand{border-bottom:none;border-right:1px solid rgba(255,255,255,.1);padding:0 12px 0 4px;flex-shrink:0}
  .menu{display:flex;padding:0;gap:4px}
  .menu-group,.s-logout{display:none}
  .menu a{flex-direction:column;gap:3px;padding:7px 9px;font-size:10px;white-space:nowrap;text-align:center}
  .stat-grid,.grid2{grid-template-columns:1fr 1fr;gap:10px}
  .content{padding:16px 12px}
}
@media(max-width:560px){.stat-grid,.grid2{grid-template-columns:1fr}}
</style>

</head>
<body>
<div class="outer" style="padding:0;max-width:100%">
  <div class="frame" id="frame" style="border-radius:0;min-height:100vh"></div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div id="sToast"></div>

<script>
/* ============ 資料層（示範資料已全部清空） ============ */
const SERVICES=[];
let SVC_ID=100;

let THERAPISTS=[
  {id:'Sky',name:'Sky 物理治療師',title:'物理治療師',base:0,rate:0,workDays:[],license:''}
];
const TC={Sky:'#1a4d68'};
const TN={Sky:'Sky 物理治療師'};
const COLORS=['#1a4d68','#2DC8A0','#F59E0B','#8B5CF6','#EC4899','#3b82f6','#06b6d4'];

const ST={
  confirmed:{label:'已確認',bg:'#3b82f6',light:'#eff6ff'},
  in_progress:{label:'進行中',bg:'#2DC8A0',light:'#edfaf6'},
  completed:{label:'已完成',bg:'#22c55e',light:'#f0fdf4'},
  no_show:{label:'未到診',bg:'#e05c5c',light:'#fef2f2'},
  cancelled:{label:'已取消',bg:'#6b7280',light:'#f9fafb'}
};

let BOOKINGS=[];
let BOOKING_ID=0;
const BK_LOG={};
let PATIENTS=[];
const INTAKE_DATA={};
let SOAP_NOTES=[];
let SOAP_ID=100;
let PACKAGES=[];
let PKG_ID=100;
let EDU_DATA=[];
let EDU_ID=100;
const EDU_SENT={};
let EDU_CATS=['全部','疼痛管理','運動治療','顱薦椎','身心靈','生活衛教'];
let eduFilter='全部';

const ALL_PT_TAGS=[
  {id:'low_back',name:'下背痛',color:'#ef4444'},
  {id:'neck',name:'頸肩痛',color:'#f97316'},
  {id:'cycling',name:'公路車族',color:'#3b82f6'},

var RENDER_URL='https://line-webhook-x1ux.onrender.com'; // 你的 Render 伺服器網址

function sendLineMsg(userId,message,cb){
  if(!userId){showToast('此病患尚未綁定 LINE');return;}
  if(!RENDER_URL){showToast('請先填入 RENDER_URL');return;}
  fetch(RENDER_URL+'/send-line',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({userId:userId,message:message})
  }).then(function(r){
    return r.json().then(function(data){return {ok:r.ok,status:r.status,data:data};}).catch(function(){return {ok:r.ok,status:r.status,data:null};});
  }).then(function(res){
    /* LINE API 成功時回 {}，失敗時回 {message:...} 或 {error:...} */
    var err=res.data&&(res.data.message||res.data.error||(res.data.details&&res.data.details[0]&&res.data.details[0].message));
    if(res.ok&&!err){showToast('LINE 已送出 ✓');if(cb)cb();}
    else{showToast('LINE 失敗：'+(err||('HTTP '+res.status)));}
  }).catch(function(e){showToast('無法連線至伺服器：'+e.message);});
}

  if(!_lineUsers.length){showToast('尚無 LINE 好友資料');return;}
  var matched=0,already=0;
  _lineUsers.forEach(function(u){
    if(lineBoundPatient(u.userId)){already++;return;}
    var nm=(u.displayName||'').trim();
    if(!nm)return;
    var p=PATIENTS.find(function(x){return !x.lineId&&(x.name||'').trim()===nm;});
    if(p){p.lineId=u.userId;p.line=true;if(u.pictureUrl)p.avatar=u.pictureUrl;matched++;}
  });
  renderLineSync();
  if(matched)showToast('自動配對成功 '+matched+' 位，已導入頭貼'+(already?'（'+already+' 位先前已綁定）':''));
  else showToast('沒有可自動配對的好友'+(already?'（'+already+' 位已綁定）':'，請確認姓名是否一致'));

/* ============ 總覽 ============ */
function calcRetention(){
  var byPhone={};
  BOOKINGS.filter(function(b){return b.status==='completed';}).forEach(function(b){(byPhone[b.phone]=byPhone[b.phone]||[]).push(b.date);});
  var phones=Object.keys(byPhone);
  var returning=phones.filter(function(ph){return byPhone[ph].length>1;}).length;
  var rate=phones.length?Math.round(returning/phones.length*100):0;
  var today=new Date(todayStr());var lapsed=0;
  phones.forEach(function(ph){var last=byPhone[ph].slice().sort().pop();if((today-new Date(last))/86400000>60)lapsed++;});
  return {rate:rate,lapsed:lapsed};
}
views.dashboard=function(){
  var today=todayStr();
  var done=BOOKINGS.filter(function(b){return b.status==='completed';});
  var rev=done.reduce(function(a,b){return a+svcOf(b.svc).price;},0);
  var todayBks=BOOKINGS.filter(function(b){return b.date===today;});
  var future=BOOKINGS.filter(function(b){return b.date>today&&b.status==='confirmed';});
  var tCount={};THERAPISTS.forEach(function(t){tCount[t.id]=done.filter(function(b){return b.t===t.id;}).length;});
  var maxT=Math.max.apply(null,Object.keys(tCount).map(function(k){return tCount[k];}).concat([1]));
  var tRows=THERAPISTS.map(function(t){
    return '<div class="bar-row"><div class="bl">'+t.name+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(tCount[t.id]/maxT*100)+'%;background:'+tColor(t.id)+'">'+tCount[t.id]+'</div></div></div>';
  }).join('')||'<div class="empty">尚無治療師</div>';
  var ret=calcRetention();
  var avg=done.length?Math.round(rev/done.length):0;
  return shell('dashboard','總覽',
    '<div class="stat-grid">'+
    '<div class="stat-card highlight"><div class="sc-n mint">'+done.length+'</div><div class="sc-l">累計治療人次</div></div>'+

    '<div class="stat-card"><div class="sc-n">'+todayBks.length+'</div><div class="sc-l">今日預約</div></div>'+
    '<div class="stat-card"><div class="sc-n">'+future.length+'</div><div class="sc-l">未來待診</div></div></div>'+

    '<div class="card"><div class="card-head"><h3>治療師人次</h3></div><div class="card-body">'+tRows+'</div></div>'+

/* ============ 預約管理 ============ */
var calWeek=null;var calFilter={};
function startOfWeek(d){var r=new Date(d);var day=r.getDay();r.setDate(r.getDate()-(day===0?6:day-1));r.setHours(0,0,0,0);return r;}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function calToday(){calWeek=startOfWeek(new Date());renderCal();}
function calNav(dir){if(!calWeek)calWeek=startOfWeek(new Date());calWeek.setDate(calWeek.getDate()+dir*7);renderCal();}
function setCalFilter(tid){if(tid==='all')calFilter={};else calFilter[tid]=!calFilter[tid];document.getElementById('calPills').innerHTML=calPills();renderCal();}
function calActive(tid){return Object.keys(calFilter).filter(function(k){return calFilter[k];}).length===0||calFilter[tid];}
function anyFilter(){return Object.keys(calFilter).some(function(k){return calFilter[k];});}
function calPills(){
  var h='<button class="cal-pill'+(!anyFilter()?' active':'')+'" onclick="setCalFilter(\'all\')">全部</button>';
  THERAPISTS.forEach(function(t){
    var sel=!!calFilter[t.id];
    h+='<button class="cal-pill'+(sel?' active':'')+'" style="'+(sel?'background:'+tColor(t.id)+';border-color:'+tColor(t.id)+';color:#fff;':'')+'" onclick="setCalFilter(\''+t.id+'\')"><span class="cal-dot" style="background:'+(sel?'rgba(255,255,255,.7)':tColor(t.id))+'"></span>'+t.name.replace('物理治療師','').trim()+'</button>';
  });
  return h;
}
function renderCal(){
  var mount=document.getElementById('calMount');if(!mount)return;
  if(!calWeek)calWeek=startOfWeek(new Date());
  var DOW=['一','二','三','四','五','六','日'];
  var today=todayStr();
  var days=[];for(var i=0;i<7;i++){var d=new Date(calWeek);d.setDate(calWeek.getDate()+i);days.push(d);}
  var rng=document.getElementById('calRange');
  if(rng)rng.textContent=(calWeek.getMonth()+1)+'/'+calWeek.getDate()+' - '+(days[6].getMonth()+1)+'/'+days[6].getDate();
  var h='<div style="overflow-x:auto"><table style="min-width:720px"><thead><tr><th style="width:48px">時間</th>';
  var leaveTs=THERAPISTS.filter(function(t){return calActive(t.id);});
  var schedAny=leaveTs.some(hasSchedule);
  function dayLeaves(ds){return leaveTs.filter(function(t){return isLeaveDay(t.id,ds);});}
  days.forEach(function(d){var ds=dstr(d);var t=ds===today;var lv=dayLeaves(ds);
    var lvMark=lv.length?'<div style="display:flex;gap:2px;justify-content:center;margin-top:2px">'+lv.map(function(x){return '<span class="cal-dot" style="background:var(--danger)" title="'+esc(x.name)+' 休診"></span>';}).join('')+'</div>':'';
    h+='<th style="text-align:center;color:'+(t?'var(--mint-d)':'var(--slate)')+'">週'+DOW[(d.getDay()+6)%7]+'<br><span style="font-size:13px;color:'+(t?'var(--mint-d)':'var(--ink)')+'">'+d.getDate()+'</span>'+lvMark+'</th>';});
  h+='</tr></thead><tbody>';
  for(var m=510;m<1320;m+=60){
    h+='<tr><td style="font-size:11px;color:var(--slate);text-align:right;vertical-align:top">'+String(Math.floor(m/60)).padStart(2,'0')+':00</td>';
    days.forEach(function(d){
      var ds=dstr(d);
      var working=leaveTs.some(function(t){return isWorkingSlot(t.id,ds,m);});
      var onLeave=schedAny&&!working;
      var list=BOOKINGS.filter(function(b){return b.date===ds&&b.start>=m&&b.start<m+60&&calActive(b.t);});
      h+='<td style="border:1px solid var(--line);padding:2px;vertical-align:top;min-width:90px;height:42px'+(onLeave?';background:#fef2f2':'')+'">';
      list.forEach(function(b){var s=ST[b.status||'confirmed'];h+='<div onclick="bkDetail('+b.id+')" style="background:'+tColor(b.t)+'18;border-left:3px solid '+tColor(b.t)+';border-radius:4px;padding:2px 5px;cursor:pointer;margin-bottom:2px"><div style="font-size:11px;font-weight:700;color:'+tColor(b.t)+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(b.name)+'</div><div style="font-size:10px;color:var(--slate)">'+esc(svcOf(b.svc).name)+' <span style="color:'+s.bg+'">'+s.label+'</span></div></div>';});
      h+='</td>';
    });
    h+='</tr>';
  }
  h+='</tbody></table></div>';
  mount.innerHTML=h;
}

function searchBkPatient(q){
  var box=document.getElementById('nb-results');if(!box)return;
  q=(q||'').trim().toLowerCase();
  if(!q){box.innerHTML='';return;}
  var hits=PATIENTS.filter(function(p){return (p.name||'').toLowerCase().indexOf(q)>-1||(p.phone||'').toLowerCase().indexOf(q)>-1;}).slice(0,6);
  if(!hits.length){box.innerHTML='<div style="font-size:12px;color:var(--slate);padding:6px 4px">查無此病患，可直接於下方填寫新增</div>';return;}
  box.innerHTML='<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden">'+hits.map(function(p){
    return '<div onclick="pickBkPatient(\''+esc(p.phone)+'\')" style="padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center" onmouseover="this.style.background=\'var(--bg)\'" onmouseout="this.style.background=\'\'"><div><span style="font-weight:700;font-size:13px">'+esc(p.name)+'</span> <span style="font-size:11px;color:var(--slate)">'+esc(p.phone)+'</span></div>'+(p.lineId?'<span class="tag green" style="background:#06C75522;color:#06C755">LINE</span>':'')+'</div>';
  }).join('')+'</div>';
}
function pickBkPatient(ph){
  var p=getPatient(ph);if(!p)return;
  document.getElementById('nb-name').value=p.name||'';
  document.getElementById('nb-phone').value=p.phone||'';
  document.getElementById('nb-results').innerHTML='';
  document.getElementById('nb-search').value=p.name+' '+(p.lineId?'(已綁 LINE)':'(未綁 LINE)');
  showToast('已帶入 '+p.name);
}
function submitBk(){
  var name=document.getElementById('nb-name').value.trim();
  var phone=document.getElementById('nb-phone').value.trim();
  var date=document.getElementById('nb-date').value;
  var tv=document.getElementById('nb-time').value;
  if(!name||!phone||!date||!tv){showToast('請填寫完整資料');return;}
  var tid=document.getElementById('nb-t').value;
  /* 休假日不可預約 */
  if(isLeaveDay(tid,date)){showToast(tName(tid)+' 於 '+date+' 為休假日，無法預約');return;}
  var hm=tv.split(':');
  var startMin=Number(hm[0])*60+Number(hm[1]);
  var svcId=document.getElementById('nb-svc').value;
  /* 非上班時段不可預約（含服務時長須落在班表內） */
  if(!isWithinShift(tid,date,startMin,svcOf(svcId).dur)){showToast('此時段非 '+tName(tid)+' 的上班時間，無法預約');return;}
  var id=++BOOKING_ID;
  var b={id:id,name:name,phone:phone,t:tid,svc:svcId,date:date,start:startMin,time:tv,note:document.getElementById('nb-note').value||'',pay:'cash',status:'confirmed'};
  BOOKINGS.push(b);
  BK_LOG[id]=[new Date().toLocaleString('zh-TW',{hour12:false}).slice(0,16)+' 預約成立'];
  if(!getPatient(phone))PATIENTS.push({phone:phone,name:name,dob:'',idNum:'',gender:'',line:false,lineId:'',note:''});
  var notify=document.getElementById('nb-line')&&document.getElementById('nb-line').checked;
  closeModal();renderCal();showToast('預約已建立');
  if(gcalToken)syncOne(id);
  if(notify){
    var p=getPatient(phone);
    if(p&&p.lineId){
      sendLineMsg(p.lineId,lineTemplates(b).confirm,function(){if(BK_LOG[id])BK_LOG[id].push(new Date().toLocaleString('zh-TW',{hour12:false}).slice(0,16)+' LINE 預約確認已送出');});
    }
  }
}
function bkDetail(id){
  var b=BOOKINGS.find(function(x){return x.id===id;});if(!b)return;
  var c=tColor(b.t),cur=b.status||'confirmed';
  var hh=Math.floor(b.start/60),mm=b.start%60;
  var tOpts=THERAPISTS.map(function(t){return '<option value="'+t.id+'"'+(t.id===b.t?' selected':'')+'>'+t.name+'</option>';}).join('');
  var sOpts=SERVICES.map(function(s){return '<option value="'+s.id+'"'+(s.id===b.svc?' selected':'')+'>'+s.name+' ('+s.dur+'分)</option>';}).join('');

/* Google Calendar 同步 */
var gcalToken=null,gcalClient=null,gcalTokenExp=0,gcalConsented=false;
function loadGsi(cb){
  if(typeof google!=='undefined'&&google.accounts&&google.accounts.oauth2){cb();return;}
  var existing=document.getElementById('__gsi');
  if(existing){existing.addEventListener('load',cb);return;}
  var s=document.createElement('script');s.id='__gsi';s.src='https://accounts.google.com/gsi/client';
  s.onload=function(){cb();};
  s.onerror=function(){showToast('Google SDK 載入失敗，請確認網路');};
  document.head.appendChild(s);
}
function ensureGCal(cb){
  /* token 尚未過期就直接用，不重新驗證 */
  if(gcalToken&&Date.now()<gcalTokenExp){cb();return;}
  if(GOOGLE_CLIENT_ID.indexOf('YOUR_GOOGLE')>-1){showToast('請先設定 Google Client ID');return;}
  loadGsi(function(){
    if(!gcalClient){
      gcalClient=google.accounts.oauth2.initTokenClient({
        client_id:GOOGLE_CLIENT_ID,
        scope:'openid email profile https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/gmail.send',
        callback:function(r){
          if(r.error){
            /* 靜默續期失敗（例如使用者尚未授權），改用一次完整同意 */
            if(!gcalConsented){gcalConsented=true;gcalClient.requestAccessToken({prompt:'consent'});return;}
            showToast('行事曆授權失敗：'+r.error);return;
          }
          gcalToken=r.access_token;
          gmailToken=r.access_token;
          gcalTokenExp=Date.now()+(Number(r.expires_in||3600)-60)*1000;
          gcalConsented=true;
          cb();
        }
      });
    }
    /* 已同意過就靜默續期（prompt:''），否則第一次要求同意 */
    gcalClient.requestAccessToken({prompt:gcalConsented?'':'consent'});
  });
}
function fmtTimeMin(min){var h=Math.floor(min/60),m=min%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
function calId(){return encodeURIComponent(CLINIC_INFO.calendarId||'primary');}
function gcalUpsert(b){
  var sv=svcOf(b.svc);
  var startStr=b.date+'T'+fmtTimeMin(b.start)+':00+08:00';
  var endStr=b.date+'T'+fmtTimeMin(b.start+sv.dur)+':00+08:00';
  var body={
    summary:b.name+'｜'+sv.name,
    description:'治療師：'+tName(b.t)+'\n電話：'+b.phone+(b.note?'\n備註：'+b.note:''),
    start:{dateTime:startStr,timeZone:'Asia/Taipei'},
    end:{dateTime:endStr,timeZone:'Asia/Taipei'}
  };
  var url='https://www.googleapis.com/calendar/v3/calendars/'+calId()+'/events';
  var method='POST';
  if(b.gcalEventId){url+='/'+b.gcalEventId;method='PATCH';}
  return fetch(url,{method:method,headers:{'Authorization':'Bearer '+gcalToken,'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(res){return res.json().then(function(data){return {ok:res.ok,status:res.status,data:data};});})
    .then(function(r){
      if(r.ok&&r.data&&r.data.id){b.gcalEventId=r.data.id;return true;}
      /* 事件已被刪除（404）時，清掉 id 並改用新建 */
      if(r.status===404&&b.gcalEventId){b.gcalEventId=null;return gcalUpsert(b);}
      var msg=(r.data&&r.data.error&&r.data.error.message)||('HTTP '+r.status);
      throw new Error(msg);
    });
}
function syncOne(id){
  var b=BOOKINGS.find(function(x){return x.id===id;});if(!b)return;
  ensureGCal(function(){
    gcalUpsert(b).then(function(){showToast('已同步至 Google 行事曆 ✓');})
      .catch(function(e){showToast('同步失敗：'+e.message);});
  });
}
function syncAllGCal(){
  ensureGCal(function(){
    var list=BOOKINGS.filter(function(b){return b.status!=='cancelled';});
    if(!list.length){showToast('目前沒有可同步的預約');return;}
    showToast('同步中…');
    Promise.all(list.map(function(b){return gcalUpsert(b).then(function(){return true;}).catch(function(e){b._syncErr=e.message;return false;});}))
      .then(function(res){
        var ok=res.filter(function(x){return x;}).length;
        var firstErr=list.find(function(b){return b._syncErr;});
        if(ok===list.length)showToast('已同步全部 '+ok+' 筆 ✓');
        else showToast('同步 '+ok+'/'+list.length+' 筆，失敗原因：'+(firstErr?firstErr._syncErr:'未知'));
      });
  });
}
/* 讀取使用者的 Google 行事曆清單 */
function listGCalendars(cb){
  ensureGCal(function(){
    fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList',{headers:{'Authorization':'Bearer '+gcalToken}})
      .then(function(r){return r.json();})
      .then(function(data){cb(data.items||[]);})
      .catch(function(){cb([]);});
  });
}

function tagModal(ph){

function renderTagList(ph){

function editTagName(id,val){

function editTagColor(id,val,ph){

function delTag(tid,ph){var i=ALL_PT_TAGS.findIndex(function(t){return t.id===tid;});if(i>-1)ALL_PT_TAGS.splice(i,1);delete PT_TAG_MAP[tid];Object.keys(PT_TAG_DATA).forEach(function(k){var a=PT_TAG_DATA[k];var j=a.indexOf(tid);if(j>-1)a.splice(j,1);});renderTagList(ph);}

/* ============ 營運分析 ============ */
views.analytics=function(){
  var done=BOOKINGS.filter(function(b){return b.status==='completed';});
  var rev=done.reduce(function(a,b){return a+svcOf(b.svc).price;},0);
  var stats={};SERVICES.forEach(function(s){stats[s.id]={name:s.name,count:0,rev:0};});
  done.forEach(function(b){if(stats[b.svc]){stats[b.svc].count++;stats[b.svc].rev+=svcOf(b.svc).price;}});
  var arr=Object.keys(stats).map(function(k){return stats[k];}).sort(function(a,b){return b.count-a.count;});
  var maxC=Math.max.apply(null,arr.map(function(s){return s.count;}).concat([1]));
  var svcRows=arr.map(function(s){return '<div class="bar-row"><div class="bl">'+s.name+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(s.count/maxC*100)+'%;background:var(--navy)">'+s.count+'</div></div><div class="bv">'+fmtNT(s.rev)+'</div></div>';}).join('');
  var tRows=THERAPISTS.map(function(t){var bks=done.filter(function(b){return b.t===t.id;});return '<tr><td class="t-name">'+t.name+'</td><td>'+bks.length+' 次</td><td class="num">'+fmtNT(bks.reduce(function(a,b){return a+svcOf(b.svc).price;},0))+'</td></tr>';}).join('');
  var avg=done.length?Math.round(rev/done.length):0;
  var rate=BOOKINGS.length?Math.round(done.length/BOOKINGS.length*100):0;
  return shell('analytics','營運分析',
    '<div class="stat-grid"><div class="stat-card"><div class="sc-n">'+done.length+'</div><div class="sc-l">完成人次</div></div><div class="stat-card"><div class="sc-n mint">'+fmtNT(rev)+'</div><div class="sc-l">總營收</div></div><div class="stat-card"><div class="sc-n">'+fmtNT(avg)+'</div><div class="sc-l">平均客單價</div></div><div class="stat-card"><div class="sc-n">'+rate+'%</div><div class="sc-l">完診率</div></div></div>'+
    '<div class="grid2"><div class="card"><div class="card-head"><h3>服務人次 / 營收</h3></div><div class="card-body">'+(svcRows||'<div class="empty">尚無資料</div>')+'</div></div>'+
    '<div class="card"><div class="card-head"><h3>治療師人次</h3></div><div class="card-body flush"><table><thead><tr><th>治療師</th><th>人次</th><th>營收</th></tr></thead><tbody>'+tRows+'</tbody></table></div></div></div>');
};

/* ============ 排班設定 ============ */
var schedT=THERAPISTS[0].id;
var DOW_N=['日','一','二','三','四','五','六'];
var DOW_O=[1,2,3,4,5,6,0];
function ensureWeek(t){if(!t.week){t.week={};}return t.week;}
function setSchedT(tid){schedT=tid;go('schedule');}
function addShift(tid,day){var t=THERAPISTS.find(function(x){return x.id===tid;});ensureWeek(t);if(!t.week[day])t.week[day]=[];syncShifts(tid);t.week[day].push({name:'時段'+(t.week[day].length+1),start:'09:00',end:'13:00'});go('schedule');}
function rmShift(tid,day,i){var t=THERAPISTS.find(function(x){return x.id===tid;});syncShifts(tid);t.week[day].splice(i,1);if(!t.week[day].length)delete t.week[day];go('schedule');}
function toggleOff(tid,day){var t=THERAPISTS.find(function(x){return x.id===tid;});ensureWeek(t);syncShifts(tid);if(t.week[day]&&t.week[day].length)delete t.week[day];else t.week[day]=[{name:'早班',start:'09:00',end:'13:00'}];go('schedule');}
function syncShifts(tid){var t=THERAPISTS.find(function(x){return x.id===tid;});if(!t||!t.week)return;DOW_O.forEach(function(day){var sh=t.week[day];if(!sh)return;sh.forEach(function(s,i){var nm=document.getElementById('ws-'+day+'-'+i+'-n');var st=document.getElementById('ws-'+day+'-'+i+'-s');var en=document.getElementById('ws-'+day+'-'+i+'-e');if(nm&&nm.value)s.name=nm.value.trim();if(st)s.start=st.value;if(en)s.end=en.value;});});}
function saveSched(tid){var t=THERAPISTS.find(function(x){return x.id===tid;});syncShifts(tid);t.workDays=Object.keys(t.week).map(Number).filter(function(d){return t.week[d]&&t.week[d].length;});go('schedule');showToast(t.name+' 排班已儲存');}
function ensureLeaves(t){if(!t.leaves)t.leaves=[];return t.leaves;}
function addLeave(tid){
  var t=THERAPISTS.find(function(x){return x.id===tid;});ensureLeaves(t);
  var date=document.getElementById('lv-date').value;
  var reason=document.getElementById('lv-reason').value.trim();
  if(!date){showToast('請選擇休假日期');return;}
  if(t.leaves.some(function(l){return l.date===date;})){showToast('該日期已在休假清單中');return;}
  t.leaves.push({date:date,reason:reason});
  t.leaves.sort(function(a,b){return a.date.localeCompare(b.date);});
  go('schedule');showToast('已新增特別休假日');
}
function rmLeave(tid,date){
  var t=THERAPISTS.find(function(x){return x.id===tid;});ensureLeaves(t);
  var i=t.leaves.findIndex(function(l){return l.date===date;});if(i>-1)t.leaves.splice(i,1);
  go('schedule');showToast('已移除休假日');
}
function isLeaveDay(tid,date){var t=THERAPISTS.find(function(x){return x.id===tid;});return !!(t&&t.leaves&&t.leaves.some(function(l){return l.date===date;}));}
function hmToMin(s){var p=String(s||'').split(':');return Number(p[0])*60+(Number(p[1])||0);}
function hasSchedule(t){return !!(t.week&&Object.keys(t.week).some(function(k){return t.week[k]&&t.week[k].length;}));}
function isWorkingSlot(tid,ds,m){
  var t=THERAPISTS.find(function(x){return x.id===tid;});
  if(!t)return false;
  if(isLeaveDay(tid,ds))return false;
  var wd=new Date(ds+'T00:00:00').getDay();
  var sh=(t.week&&t.week[wd])||[];
  return sh.some(function(s){var st=hmToMin(s.start),en=hmToMin(s.end);return st<m+60&&en>m;});
}
/* 檢查指定時間（含整段服務時長）是否落在治療師上班時段內 */
function isWithinShift(tid,ds,startMin,durMin){
  var t=THERAPISTS.find(function(x){return x.id===tid;});
  if(!t)return false;
  if(isLeaveDay(tid,ds))return false;
  if(!hasSchedule(t))return true; /* 未設定班表者不限制 */
  var wd=new Date(ds+'T00:00:00').getDay();
  var sh=(t.week&&t.week[wd])||[];
  var endMin=startMin+(durMin||0);
  return sh.some(function(s){var st=hmToMin(s.start),en=hmToMin(s.end);return startMin>=st&&endMin<=en;});
}
function leaveRows(t){
  ensureLeaves(t);
  if(!t.leaves.length)return '<div class="empty">尚無特別休假日</div>';
  return t.leaves.map(function(l){
    var d=new Date(l.date+'T00:00:00');var w=DOW_N[d.getDay()];
    return '<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)">'+
      '<div class="row" style="gap:10px"><span class="day-badge" style="background:var(--danger)">假</span><div><div style="font-weight:700">'+l.date+' （週'+w+'）</div>'+(l.reason?'<div style="font-size:11px;color:var(--slate)">'+esc(l.reason)+'</div>':'')+'</div></div>'+
      '<button class="shift-del" onclick="rmLeave(\''+t.id+'\',\''+l.date+'\')">&times;</button></div>';
  }).join('');
}
views.schedule=function(){
  var t=THERAPISTS.find(function(x){return x.id===schedT;})||THERAPISTS[0];
  if(!t)return shell('schedule','排班設定','<div class="empty">尚無治療師</div>');
  ensureWeek(t);
  var pills=THERAPISTS.map(function(th){var sel=th.id===schedT;return '<button class="cal-pill'+(sel?' active':'')+'" style="'+(sel?'background:'+tColor(th.id)+';border-color:'+tColor(th.id)+';color:#fff;':'')+'" onclick="setSchedT(\''+th.id+'\')"><span class="cal-dot" style="background:'+(sel?'rgba(255,255,255,.7)':tColor(th.id))+'"></span>'+th.name.replace('物理治療師','').trim()+'</button>';}).join('');
  var cards=DOW_O.map(function(day){
    var sh=t.week[day]||[];var off=!sh.length;var c=tColor(t.id);
    var rows=sh.map(function(s,i){return '<div class="shift-row"><input id="ws-'+day+'-'+i+'-n" class="shift-name" value="'+esc(s.name)+'" style="border-left:3px solid '+c+'"><input id="ws-'+day+'-'+i+'-s" type="time" class="shift-time" value="'+s.start+'"><span style="color:var(--slate)">-</span><input id="ws-'+day+'-'+i+'-e" type="time" class="shift-time" value="'+s.end+'"><button class="shift-del" onclick="rmShift(\''+t.id+'\','+day+','+i+')">&times;</button></div>';}).join('');
    return '<div class="day-card'+(off?' off':'')+'"><div class="day-head"><div class="day-title"><span class="day-badge" style="background:'+(off?'var(--mist)':c)+'">'+DOW_N[day]+'</span>週'+DOW_N[day]+'</div><div class="row" style="gap:6px">'+(off?'<button class="btn sm ghost" onclick="toggleOff(\''+t.id+'\','+day+')">設為上班</button>':'<button class="btn sm ghost" onclick="addShift(\''+t.id+'\','+day+')">+ 時段</button><button class="btn sm gray" onclick="toggleOff(\''+t.id+'\','+day+')">休診</button>')+'</div></div>'+(off?'<div style="color:var(--slate);font-size:13px">休診</div>':rows)+'</div>';
  }).join('');
  var workN=DOW_O.filter(function(d){return (t.week[d]||[]).length;}).length;
  ensureLeaves(t);
  return shell('schedule','排班設定',
    '<div class="card"><div class="card-head"><h3><span class="cal-dot" style="background:'+tColor(t.id)+';display:inline-block;margin-right:6px"></span>'+t.name+' 每週班表</h3><div class="row" style="gap:8px"><span class="tag mint">每週 '+workN+' 天</span><button class="btn sm" onclick="saveSched(\''+t.id+'\')">儲存排班</button></div></div><div class="card-body">'+cards+'</div></div>'+
    '<div class="card"><div class="card-head"><h3>特別休假日</h3><span class="tag amber">'+t.leaves.length+' 天</span></div><div class="card-body">'+
    '<div class="row" style="gap:8px;margin-bottom:14px"><input id="lv-date" type="date" min="'+todayStr()+'" max="2100-12-31" style="padding:9px 11px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><input id="lv-reason" placeholder="事由（選填，例：國定假日 / 進修 / 請假）" style="flex:1;min-width:150px;padding:9px 11px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><button class="btn sm" onclick="addLeave(\''+t.id+'\')">+ 新增休假</button></div>'+
    '<div id="leaveList">'+leaveRows(t)+'</div>'+
    '<div class="banner info" style="margin-top:14px"><span>i</span><div>特別休假日為單一日期的休診設定，優先於每週班表；設定後該日於預約行事曆會以紅點標示為休診。</div></div>'+
    '</div></div>',
    '<div class="row" style="gap:5px">'+pills+'</div>');
};

function uploadStamp(input,key){
  var file=input.files&&input.files[0];if(!file)return;
  if(file.size>1.5*1024*1024){showToast('圖片請小於 1.5MB');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    var data=e.target.result;
    if(key.indexOf('t-')===0)STAMP_T[key.slice(2)]=data;
    else STAMPS[key]=data;
    go('receipt');showToast('印章已上傳');
  };
  reader.readAsDataURL(file);
}
function clearStamp(key){
  if(key.indexOf('t-')===0)delete STAMP_T[key.slice(2)];
  else STAMPS[key]='';
  go('receipt');showToast('已移除印章');
}

function checkBookLeave(){
  var tid=document.getElementById('cb-t').value;
  var date=document.getElementById('cb-date').value;
  var tv=document.getElementById('cb-time').value;
  var svcId=document.getElementById('cb-svc').value;
  var box=document.getElementById('cb-leave');
  var btn=document.getElementById('cb-submit');
  var warn='';
  if(tid&&date){
    if(isLeaveDay(tid,date)){
      warn='⚠ 此治療師於 '+date+' 休診，請改選其他日期';
    }else if(tv){
      var hm=tv.split(':');var startMin=Number(hm[0])*60+Number(hm[1]);
      if(!isWithinShift(tid,date,startMin,svcOf(svcId).dur)){
        warn='⚠ 此時段非治療師的看診時間，請改選其他時段';
      }
    }
  }
  if(warn){
    if(box){box.style.display='block';box.textContent=warn;}
    if(btn){btn.disabled=true;btn.style.opacity='.5';btn.style.cursor='not-allowed';}
  }else{
    if(box)box.style.display='none';
    if(btn){btn.disabled=false;btn.style.opacity='1';btn.style.cursor='pointer';}
  }
}
function customerBook(){
  var name=document.getElementById('cb-name').value.trim();
  var phone=document.getElementById('cb-phone').value.trim();
  var date=document.getElementById('cb-date').value;var tv=document.getElementById('cb-time').value;
  if(!name||!phone||!date||!tv){showToast('請填寫完整資料');return;}
  var tid=document.getElementById('cb-t').value;
  /* 休假日不可預約 */
  if(isLeaveDay(tid,date)){showToast('該治療師於 '+date+' 休診，請改選其他日期');return;}
  var hm=tv.split(':');var startMin=Number(hm[0])*60+Number(hm[1]);
  var svcId=document.getElementById('cb-svc').value;
  /* 非上班時段不可預約 */
  if(!isWithinShift(tid,date,startMin,svcOf(svcId).dur)){showToast('此時段非治療師的看診時間，請改選其他時段');return;}
  var id=++BOOKING_ID;
  BOOKINGS.push({id:id,name:name,phone:phone,t:tid,svc:svcId,date:date,start:startMin,time:tv,note:'線上預約',pay:'cash',status:'confirmed'});
  if(!getPatient(phone))PATIENTS.push({phone:phone,name:name,dob:'',idNum:'',gender:'',line:false,lineId:'',note:''});
  document.getElementById('frame').innerHTML='<div style="min-height:620px;background:var(--bg);display:flex;align-items:center;justify-content:center"><div style="background:#fff;border-radius:18px;padding:40px;text-align:center;max-width:360px;box-shadow:var(--sh-md)"><div style="font-size:46px;margin-bottom:14px">&#10003;</div><h2 style="font-size:20px;margin-bottom:8px">預約已送出</h2><p style="color:var(--slate);font-size:13px;margin-bottom:22px">我們會在就診前與您確認。</p><button class="btn" onclick="go(\'book\')">再次預約</button></div></div>';
  showToast('預約已送出');
}

/* ============ 初診問卷 ============ */
var _iStep=1;var _iData={};var _iGender='';
views.intake=function(){
  if(_iStep===99){
    return '<div class="intake-wrap" style="display:flex;align-items:center;justify-content:center"><div style="background:#fff;border-radius:18px;padding:40px;text-align:center;max-width:360px;box-shadow:var(--sh-md)"><div style="font-size:46px;margin-bottom:14px">&#10003;</div><h2 style="font-size:20px;margin-bottom:8px">初診資料已送出</h2><p style="color:var(--slate);font-size:13px;margin-bottom:22px">感謝填寫，治療師將於就診前確認。</p><button class="btn" onclick="resetIntake()">重新填寫</button></div></div>';
  }
  var steps=['基本資料','主訴與患處','疼痛強度','告知同意'];
  var bar='<div class="intake-steps">'+steps.map(function(s,i){return '<div class="istep '+(i+1<_iStep?'done':i+1===_iStep?'cur':'')+'"></div>';}).join('')+'</div>';
  var body='';
  if(_iStep===1){
    body='<div style="padding:20px 24px"><h3 style="font-size:15px;margin-bottom:16px;color:var(--navy)">基本資料</h3>'+
      '<div class="field"><label>姓名 *</label><input id="i-name" value="'+esc(_iData.name||'')+'"></div>'+
      '<div class="grid2"><div class="field"><label>電話 *</label><input id="i-phone" value="'+esc(_iData.phone||'')+'"></div><div class="field"><label>出生年月日 *</label><input id="i-dob" type="date" min="1900-01-01" max="'+todayStr()+'" value="'+(_iData.dob||'')+'"></div></div>'+
      '<div class="field"><label>身分證字號 *</label><input id="i-id" value="'+esc(_iData.idNum||'')+'" style="font-family:monospace;letter-spacing:1px" oninput="this.value=this.value.toUpperCase()"></div>'+
      '<div class="field"><label>性別 *</label><div class="row"><button type="button" class="gender-btn'+(_iGender==='male'?' sel':'')+'" id="ig-male" onclick="iGender(\'male\')">男</button><button type="button" class="gender-btn'+(_iGender==='female'?' sel':'')+'" id="ig-female" onclick="iGender(\'female\')">女</button></div></div>'+
      '<button class="btn" style="width:100%;padding:13px" onclick="iNext(1)">下一步</button></div>';
  }else if(_iStep===2){
    body='<div style="padding:20px 24px"><h3 style="font-size:15px;margin-bottom:14px;color:var(--navy)">主訴與患處</h3>'+
      '<div style="font-size:12px;font-weight:600;color:var(--slate);margin-bottom:8px">疼痛 / 不適部位（可複選）*</div>'+bpHTML('i-bp',_iData.bodyParts||[])+
      '<div class="field" style="margin-top:14px"><label>主要問題描述 *</label><textarea id="i-complaint" style="height:70px;resize:none" placeholder="例：右側下背痛，久坐後加劇">'+esc(_iData.complaint||'')+'</textarea></div>'+
      '<div class="field"><label>持續時間</label><input id="i-duration" value="'+esc(_iData.duration||'')+'" placeholder="例：三個月"></div>'+
      '<div class="row" style="gap:8px"><button class="btn gray" onclick="iBack(1)">上一步</button><button class="btn" style="flex:1;padding:13px" onclick="iNext(2)">下一步</button></div></div>';
  }else if(_iStep===3){
    body='<div style="padding:20px 24px"><h3 style="font-size:15px;margin-bottom:14px;color:var(--navy)">疼痛強度（VAS）</h3>'+
      '<div style="font-size:12px;color:var(--slate);margin-bottom:12px">請點選目前最接近的疼痛分數</div>'+vasHTML('i-vas',_iData.vas||0)+
      '<div class="row" style="gap:8px;margin-top:20px"><button class="btn gray" onclick="iBack(2)">上一步</button><button class="btn" style="flex:1;padding:13px" onclick="iNext(3)">下一步</button></div></div>';
  }else if(_iStep===4){
    var consent='【服務前言與聲明】\n本所本次處置採「非以疾病為目的」之健康促進模式（如動作評估、紅繩 Neurac 訓練、體能強化、放鬆伸展等）。若需針對特定疾病進行醫療復健，建請先經醫師診斷並開立照會或醫囑，再由本所物理治療師依醫囑執行。\n\n服務條款：\n一、立同意書人應由受服務之個案本人親自簽具；未成年或無法親簽者，得由法定代理人簽具。\n二、服務過程中如有不適，個案應立即反應並要求暫停。\n三、服務項目包含運動按摩、筋膜放鬆與伸展、體能強化、紅繩運動訓練等。\n四、過程中或後可能出現過敏、痠痛、頭暈等情況，立同意書人已知悉並同意。\n五、當日身體不適或服藥者，請先告知物理治療師。\n六、個人資料供本所作為健康促進服務使用。\n七、本所設有錄音錄影設備以維護雙方權益，資料依個資法妥善保存。\n八、本同意書自簽署日起一年內有效。\n\n本人已充分瞭解上述說明並同意，且確認服務提供者皆為領有合格證照之物理治療師。';
    body='<div style="padding:20px 24px"><h3 style="font-size:15px;margin-bottom:14px;color:var(--navy)">告知同意書</h3>'+
      '<div class="consent-box">'+esc(consent)+'</div>'+
      '<div class="grid2"><div class="field"><label>簽名（全名）*</label><input id="i-sig"></div><div class="field"><label>與個案關係</label><input id="i-rel" value="本人"></div></div>'+
      '<div class="field"><label style="color:var(--slate)">簽署日期</label><div style="font-weight:600;padding:6px 0">'+new Date().toLocaleDateString('zh-TW')+'</div></div>'+
      '<div class="row" style="gap:8px"><button class="btn gray" onclick="iBack(3)">上一步</button><button class="btn" style="flex:1;padding:13px" onclick="iSubmit()">確認送出</button></div></div>';
  }
  return '<div class="intake-wrap"><div class="intake-top"><div style="font-size:17px;font-weight:700">領航物理治療所</div><div style="font-size:12px;opacity:.85">初診問卷 · 步驟 '+_iStep+' / 4</div></div>'+bar+'<div class="intake-card">'+body+'</div></div>';
};
function iGender(g){_iGender=g;document.getElementById('ig-male').classList.toggle('sel',g==='male');document.getElementById('ig-female').classList.toggle('sel',g==='female');}
function iBack(s){_iStep=s;document.getElementById('frame').innerHTML=views.intake();}
function iNext(step){
  if(step===1){
    var name=document.getElementById('i-name').value.trim();var phone=document.getElementById('i-phone').value.trim();
    var dob=document.getElementById('i-dob').value;var idn=document.getElementById('i-id').value.trim();
    if(!name){showToast('請填寫姓名');return;}if(!phone){showToast('請填寫電話');return;}if(!dob){showToast('請選擇出生年月日');return;}if(!idn){showToast('請填寫身分證字號');return;}if(!_iGender){showToast('請選擇性別');return;}
    _iData.name=name;_iData.phone=phone;_iData.dob=dob;_iData.idNum=idn;_iData.gender=_iGender;
  }else if(step===2){
    var bp=bpValues('i-bp');var comp=document.getElementById('i-complaint').value.trim();
    if(!bp.length){showToast('請點選疼痛部位');return;}if(!comp){showToast('請描述主訴');return;}
    _iData.bodyParts=bp;_iData.complaint=comp;_iData.duration=document.getElementById('i-duration').value.trim();
  }else if(step===3){
    _iData.vas=_vasStore['i-vas']!=null?_vasStore['i-vas']:0;
  }
  _iStep=step+1;document.getElementById('frame').innerHTML=views.intake();
}
function iSubmit(){
  var sig=document.getElementById('i-sig').value.trim();if(!sig){showToast('請填寫簽名');return;}
  _iData.sigName=sig;_iData.sigRel=document.getElementById('i-rel').value.trim()||'本人';_iData.sigDate=new Date().toLocaleDateString('zh-TW');
  if(_iData.phone){
    INTAKE_DATA[_iData.phone]=JSON.parse(JSON.stringify(_iData));
    var p=getPatient(_iData.phone);
    if(!p){p={phone:_iData.phone,line:false,lineId:'',note:''};PATIENTS.push(p);}
    p.name=_iData.name||p.name;p.dob=_iData.dob||p.dob;p.idNum=_iData.idNum||p.idNum;p.gender=_iData.gender||p.gender;
    /* 初診表完成後推播 LINE */
    if(p.lineId){
      var msg='【領航物理治療所】\n'+esc(p.name)+' 您好，我們已收到您的初診資料 ✓\n主訴：'+(_iData.complaint||'-')+'\n感謝您的填寫，治療師將於就診前詳閱。';
      sendLineMsg(p.lineId,msg);
    }
  }
  _iStep=99;document.getElementById('frame').innerHTML=views.intake();
}
function resetIntake(){_iStep=1;_iData={};_iGender='';document.getElementById('frame').innerHTML=views.intake();}

/* ============ 路由 ============ */
function go(v){
  if(typeof views[v]!=='function'){showToast('此頁面開發中');return;}
  var pub=['login','book','intake'];
  /* 後台頁面必須登入才能進入 */
  if(pub.indexOf(v)<0){
    if(!currentUser){
      document.getElementById('frame').innerHTML=views.login();
      document.querySelectorAll('.sw').forEach(function(b){b.classList.toggle('active',b.dataset.v==='login');});
      showToast('請先登入');
      return;
    }
    if(currentUser.pages.indexOf(v)<0){showToast('您沒有此頁面的存取權限');return;}
  }
  document.getElementById('frame').innerHTML=views[v]();
  document.querySelectorAll('.sw').forEach(function(b){b.classList.toggle('active',b.dataset.v===v);});
  if(v==='bookings')calToday();
}
document.getElementById('modalBg').addEventListener('click',function(e){if(e.target.id==='modalBg')closeModal();});
document.querySelectorAll('.sw').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.v);});});
go('login');
</script>
</body>
</html>
