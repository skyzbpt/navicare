<html lang="zh-TW">
<head>

<!-- 防點擊劫持：frame-ancestors 於 <meta> CSP 會被瀏覽器忽略，須於代管層（Render 靜態服務）以 HTTP 標頭設定 Content-Security-Policy: frame-ancestors 'none' 或 X-Frame-Options: DENY。 -->
<title>領航物理治療所 管理系統</title>
<link rel="icon" type="image/svg+xml" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231a4d68'/><g transform='translate(4 4)' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><polyline points='9 22 9 12 15 12 15 22'/></g></svg>">
<style>
:root{
  --navy:#1a4d68;--navy-d:#123b52;--navy-l:#eef4f7;
  /* --mint-d 是填色（白字疊在上面）；--mint-t 是「薄荷綠當文字」時用的深色版，
     在白底／--mint-l 底上都達得到 4.5:1 */
  --mint:#2DC8A0;--mint-d:#1f9e7e;--mint-t:#127a5f;--mint-l:#edfaf6;
  /* --slate 是全站次要文字色。原本的 #6b8a9c 在白底只有 3.7:1，未達 WCAG AA 對小字的
     4.5:1 要求；改深後所有 11–12px 的說明文字才讀得清楚。 */
  --slate:#5c7a8c;--mist:#dce6ec;--line:#eef3f6;--bg:#f6fafb;
  --warn:#a06508;--warn-l:#fdf3e0;--danger:#c94040;--ink:#1f3a47;
  --focus:#0b7285;
  --r:14px;--r-sm:10px;--r-lg:20px;
  --sh:0 1px 3px rgba(26,77,104,.05);
  --sh-md:0 4px 16px rgba(26,77,104,.08);
  --sh-lg:0 12px 48px rgba(26,77,104,.12);
  --tap:38px; /* 互動元件的最小點擊高度 */
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',-apple-system,'Segoe UI',sans-serif;background:#e8f0f4;color:var(--ink);font-size:13px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
::placeholder{color:#7d97a8}
/* 鍵盤操作可見性：全站大量使用 outline:none，鍵盤使用者原本完全看不到焦點在哪。
   :focus-visible 只在鍵盤操作時出現，不影響滑鼠點擊的視覺。 */
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sidebar :focus-visible{outline-color:#fff}
.modal-head :focus-visible{outline-color:#fff}
/* 跳至主要內容：鍵盤使用者不必逐一 Tab 過整個側邊選單 */
.skip-link{position:absolute;left:-9999px;top:0;z-index:300;background:var(--navy);color:#fff;padding:10px 18px;border-radius:0 0 var(--r-sm) 0;font-size:13px;font-weight:600;text-decoration:none}
.skip-link:focus{left:0}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
.outer{max-width:1180px;margin:0 auto;width:100%}
.frame{background:#fff;border-radius:0;overflow:hidden;box-shadow:var(--sh-lg);min-height:100vh}
.btn{padding:10px 18px;min-height:var(--tap);background:var(--mint);color:#fff;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--mint-d)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:7px 13px;min-height:32px;font-size:12px;border-radius:8px}
.btn.ghost{background:var(--mint-l);color:var(--mint-t)}
.btn.ghost:hover{background:#def5ee}
.btn.gray{background:#f0f5f7;color:var(--slate)}
.btn.gray:hover{background:#e6eef2}
.btn.danger{background:#fdecec;color:var(--danger)}
.btn.danger:hover{background:#fbdede}
.tag{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:600}
.tag.green{background:#e3f6ea;color:#157a44}
.tag.gray{background:#eef3f6;color:var(--slate)}
.tag.mint{background:var(--mint-l);color:var(--mint-t)}
.tag.amber{background:var(--warn-l);color:#8a5a12}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#eef4f7,#edfaf6)}
.login-box{background:#fff;border-radius:var(--r-lg);padding:40px 38px;width:340px;box-shadow:var(--sh-md);text-align:center}
.login-logo{width:54px;height:54px;background:var(--navy);border-radius:15px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.login-box h2{font-size:18px;margin-bottom:4px}
.login-box p{font-size:12px;color:var(--slate)}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--navy);color:#fff;flex-shrink:0;padding:16px 0;display:flex;flex-direction:column}
.brand{padding:0 18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .ic{width:34px;height:34px;background:var(--mint);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand b{font-size:13px;display:block}
.brand span{font-size:10px;color:#9fc0d4}
.menu{padding:10px;flex:1;overflow-y:auto}
.menu-group{font-size:10px;color:#6f9bb5;font-weight:700;letter-spacing:1px;padding:13px 12px 5px}
.menu a{display:flex;align-items:center;gap:11px;padding:9px 12px;color:#c2d6e2;border-radius:var(--r-sm);font-size:13px;font-weight:500;margin-bottom:2px;cursor:pointer;transition:.15s}
.menu a:hover{background:rgba(255,255,255,.06);color:#fff}
.menu a.active{background:var(--mint);color:#fff}
.menu a svg{width:17px;height:17px;flex-shrink:0;opacity:.9}
.s-logout{margin:8px 12px 0;padding:9px;background:rgba(255,255,255,.06);color:#c2d6e2;border:none;border-radius:var(--r-sm);font-size:12px}
.s-logout:hover{background:rgba(255,255,255,.1)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
/* 頁首固定：長清單捲到一半時，頁面標題與「新增／同步」等主要操作仍留在畫面上 */
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.topbar h2{font-size:17px}
.notify-bell{position:relative;width:38px;height:38px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--navy);cursor:pointer;transition:.15s;flex-shrink:0}
.notify-bell:hover{background:var(--navy-l);border-color:var(--mist)}
.notify-bell.has-new{color:var(--mint-t,#127a5f)}
.notify-bell.has-new svg{animation:bellRing 2s ease-in-out infinite}
@keyframes bellRing{0%,50%,100%{transform:rotate(0)}55%{transform:rotate(12deg)}60%{transform:rotate(-10deg)}65%{transform:rotate(8deg)}70%{transform:rotate(-6deg)}75%{transform:rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;transform-origin:center}
.notify-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--danger,#e05c5c);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 1px 4px rgba(224,92,92,.4)}
.content{padding:24px;background:var(--bg);flex:1;overflow-y:auto;overflow-x:hidden}
.sw-label{font-size:12px;color:var(--slate);font-weight:600}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:var(--r);border:1px solid var(--line);padding:16px 18px;box-shadow:var(--sh)}
.stat-card .sc-n{font-size:26px;font-weight:900;color:var(--navy);line-height:1.1}
.stat-card .sc-n.mint{color:var(--mint-t)}
.stat-card .sc-l{font-size:12px;color:var(--slate);margin-top:5px}
.stat-card.highlight{border-color:var(--mint);background:var(--mint-l)}
.stat-card.highlight .sc-n{color:var(--mint-t)}
.card{background:#fff;border-radius:var(--r);border:1px solid var(--line);margin-bottom:16px;overflow:hidden;box-shadow:var(--sh)}
.card-head{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-head h3{font-size:14px}
.card-body{padding:20px}
.card-body.flush{padding:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
table{width:100%;border-collapse:collapse}
/* 表頭不換行，窄螢幕時「次數」之類的短欄名才不會被拆成兩行。
   註：這裡不用 position:sticky——表格外層 .card-body.flush 有 overflow-x:auto，
   會成為自己的捲動容器，吸附的表頭反而會蓋住第一列資料。 */
th{text-align:left;padding:12px 18px;font-size:11px;color:var(--slate);font-weight:700;background:var(--bg);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 18px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
/* 篩選後沒有結果時的提示列（由 JS 切換 hidden） */
.no-result td{text-align:center;color:var(--slate);padding:34px 20px}
.t-name{font-weight:600}
.t-sub{font-size:11px;color:var(--slate)}
.num{font-variant-numeric:tabular-nums}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border:1.5px solid var(--mist);border-radius:var(--r-sm);outline:none;transition:.15s;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mint)}
.field input[type="date"],.field input[type="time"]{-webkit-appearance:none;appearance:none;width:100%;height:auto;line-height:1.65}
.field input{height:42px}
.field textarea{height:auto}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .bl{width:120px;font-size:12px;color:var(--slate);flex-shrink:0}
.bar-track{flex:1;background:var(--bg);border-radius:6px;height:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;min-width:2px}
.bar-row .bv{width:80px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0}
.banner{padding:12px 16px;border-radius:var(--r-sm);font-size:12px;margin-bottom:14px;display:flex;gap:8px;line-height:1.7}
.banner.info{background:var(--navy-l);border:1px solid #bcd6e6;color:var(--navy)}
.status-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.status-row:last-child{border-bottom:none}
.empty{text-align:center;color:var(--slate);padding:44px 20px;font-size:13px}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap input{padding:9px 32px 9px 13px;border:1.5px solid var(--mist);border-radius:9px;outline:none;font-size:13px;min-width:180px}
.search-wrap input:focus{border-color:var(--mint)}
.s-clear{position:absolute;right:8px;background:none;border:none;font-size:15px;color:var(--slate);cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(26,77,104,.38);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);width:460px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:var(--sh-lg)}
.modal-head{padding:16px 22px;color:#fff;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.modal-head .x{background:rgba(255,255,255,.2);border:none;width:30px;height:30px;border-radius:9px;font-size:18px;color:#fff;line-height:1;cursor:pointer}
.modal-head .x:hover{background:rgba(255,255,255,.32)}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.edit-tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg)}
.edit-tab{padding:12px 18px;border:none;background:none;font-size:13px;font-weight:600;color:var(--slate);cursor:pointer;border-bottom:2px solid transparent}
.edit-tab.active{color:var(--mint-t);border-bottom-color:var(--mint)}
.edit-panel{display:none;padding:18px 22px}
.edit-panel.active{display:block}
.sec-label{font-size:11px;font-weight:700;color:var(--slate);letter-spacing:.5px;margin:16px 0 10px}
.sec-label:first-child{margin-top:0}
.pay-pills{display:flex;gap:7px;flex-wrap:wrap}
.pay-pill{padding:7px 15px;border:1.5px solid var(--mist);border-radius:999px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--slate);transition:.15s;font-family:inherit}
.pay-pill.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.status-picker{display:flex;gap:7px;flex-wrap:wrap}
.sp{padding:8px 15px;border-radius:999px;border:1.5px solid var(--mist);font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:var(--slate)}
.sp.sel{background:var(--navy);border-color:var(--navy);color:#fff}
#sToast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 24px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--sh-md);white-space:pre-line;text-align:center}
#sToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 新通知彈窗：有新的線上預約／初診表時自動跳出。
   原本只有鈴鐺紅點＋音效＋分頁標題閃爍，瀏覽器通知權限一旦被拒就完全沒有畫面提示。
   刻意不做成遮罩式對話框——櫃台可能正在填病歷，蓋掉畫面會打斷作業。 */
/* 垂直位置讓開頁首（最高約 70px），彈窗跳出時鈴鐺與同步鍵仍點得到，看起來也像是從鈴鐺展開 */
#notifyPop{position:fixed;top:76px;right:14px;z-index:150;width:330px;max-width:calc(100vw - 28px);display:none}
#notifyPop.show{display:block;animation:npIn .22s ease-out}
@keyframes npIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.np-card{background:#fff;border-radius:var(--r);border:1px solid var(--mist);box-shadow:var(--sh-lg);overflow:hidden}
.np-head{background:var(--navy);color:#fff;padding:11px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.np-head .x{background:rgba(255,255,255,.2);border:none;width:26px;height:26px;border-radius:8px;font-size:16px;color:#fff;line-height:1;cursor:pointer;flex-shrink:0}
.np-head .x:hover{background:rgba(255,255,255,.32)}
.np-head .x:focus-visible{outline-color:#fff}
.np-body{padding:4px 14px}
.np-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.np-row:last-child{border-bottom:none}
.np-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.np-t{font-weight:700;font-size:13px}
.np-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--bg)}
.bp-grid{display:flex;flex-wrap:wrap;gap:6px}
.bp-btn{padding:7px 12px;border-radius:8px;border:1.5px solid var(--mist);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--slate);transition:.12s;font-family:inherit}
.bp-btn.sel{background:var(--mint);border-color:var(--mint);color:#fff}
.soap-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--sh);margin-bottom:14px}
.soap-card-head{padding:13px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px}
.soap-card-body{padding:18px}
.soap-card-body.collapsed{display:none}
.soap-sec{margin-bottom:14px}
.soap-sec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;font-weight:700}
.badge{width:22px;height:22px;border-radius:6px;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.badge.S{background:#3b82f6}.badge.O{background:var(--mint)}.badge.A{background:#f59e0b}.badge.P{background:#8b5cf6}
.soap-sec textarea{width:100%;padding:9px 12px;border:1.5px solid var(--mist);border-radius:8px;outline:none;resize:vertical;min-height:62px;font-family:inherit;font-size:13px;line-height:1.6}
.soap-sec textarea:focus{border-color:var(--mint)}
.chev{display:inline-flex;transition:transform .2s}
.edu-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.edu-row{display:flex;align-items:center;gap:14px;background:#fff;padding:14px 16px}
.edu-row:hover{background:var(--bg)}
.edu-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.edu-body{flex:1;min-width:0}
.edu-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.edu-title{font-size:14px;font-weight:700;margin:3px 0}
.edu-desc{font-size:11px;color:var(--slate);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.edu-meta{font-size:10px;color:var(--slate);margin-top:3px}
.day-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;margin-bottom:10px}
.day-card.off{background:var(--bg)}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.day-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700}
.day-badge{width:26px;height:26px;border-radius:8px;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.shift-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.shift-name{flex:0 0 100px;padding:8px 10px;border:1.5px solid var(--mist);border-radius:8px;outline:none;font-family:inherit;font-size:13px;font-weight:600}
.shift-time{padding:8px 10px;border:1.5px solid var(--mist);border-radius:8px;outline:none;font-family:inherit;font-size:13px}
.shift-del{width:30px;height:30px;flex-shrink:0;border:none;border-radius:8px;background:#fdecec;color:var(--danger);font-size:16px;cursor:pointer}
input[type="date"].date-empty{color:transparent;position:relative}
input[type="date"].date-empty::before{content:attr(data-ph);color:#a8bcc8;position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}
input[type="date"].date-empty:focus{color:var(--ink)}
input[type="date"].date-empty:focus::before{content:none}
.pkg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pkg-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:18px;cursor:pointer;box-shadow:var(--sh);transition:.15s}
.pkg-card:hover{border-color:var(--mint);box-shadow:var(--sh-md)}
.pkg-name{font-size:15px;font-weight:700;margin-bottom:3px}
.pkg-svc{font-size:11px;color:var(--mint-t);font-weight:600}
.pkg-price{font-size:24px;font-weight:900;color:var(--navy);margin:8px 0 4px}

function sanitizeHTML(h){
  try{
    var doc=(new DOMParser()).parseFromString('<body>'+h+'</body>','text/html');
    doc.querySelectorAll('script,iframe,object,embed,base,link,meta,noscript,template').forEach(function(el){if(el.parentNode)el.parentNode.removeChild(el);});
    var SAFE_EVT=['onclick','oninput','onchange'];
    doc.querySelectorAll('*').forEach(function(el){

// 通知提示音（Web Audio 合成，無需外部檔案）
var _audioCtx=null;
function playNotifySound(){
  try{
    if(!_audioCtx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;_audioCtx=new AC();}
    if(_audioCtx.state==='suspended')_audioCtx.resume();
    var ctx=_audioCtx;var now=ctx.currentTime;
    // 雙音「叮咚」：兩個音符
    [{f:880,t:0,d:0.18},{f:1174,t:0.16,d:0.32}].forEach(function(n){
      var osc=ctx.createOscillator();var gain=ctx.createGain();
      osc.type='sine';osc.frequency.value=n.f;
      osc.connect(gain);gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0,now+n.t);
      gain.gain.linearRampToValueAtTime(0.22,now+n.t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001,now+n.t+n.d);
      osc.start(now+n.t);osc.stop(now+n.t+n.d);
    });
  }catch(e){}
}
// 新增一筆通知到歷史（最多保留 5 筆）
function addNotify(kind,count,silent){
  // 去重：同類型、相同數量且仍未讀的通知不重複建立（避免重載/重複輪詢灌爆 5 筆上限）
  if(NOTIFY_LOG.some(function(n){return n.kind===kind&&!n.read&&n.count===count;}))return;
  var _narr=new Uint32Array(1);crypto.getRandomValues(_narr);NOTIFY_LOG.unshift({id:'n'+Date.now()+_narr[0].toString(36),kind:kind,count:count,at:new Date().toISOString(),read:false});
  if(NOTIFY_LOG.length>5)NOTIFY_LOG=NOTIFY_LOG.slice(0,5);
  if(!silent){
    playNotifySound();
    var label=kind==='bk'?'線上預約':kind==='intake'?'初診表單':'回診關懷';
    flashTitle('🔔 '+label+' '+count);
    try{if(window.Notification&&Notification.permission==='granted')new Notification('領航物理治療所',{body:label+' '+count+' 筆待處理',tag:'navigator-'+kind});}catch(e){}
  }
  /* 待匯入的線上預約／初診表是「新進來、要馬上處理」的事，登入時也該直接跳彈窗。
     「需要關心的名單」則是長期存在的統計值，登入就彈會變成每次登入都被打擾一次，
     因此只有在數字真的增加時（silent=false）才彈；平時仍會顯示在鈴鐺與通知面板裡。 */
  if(!silent||kind!=='care')showNotifyPop();
}

// 計算「1 個月以上未回診」的個案數（需要關心的名單最緊急的一組）
function lapsedCount(){try{return careStats().list.filter(function(r){return r.bucket==='m1';}).length;}catch(e){return 0;}}
// 查詢待匯入數量與待關心名單；若比上次多，建立通知
function checkPendingCount(){
  if(!RENDER_URL||!currentUser)return;
  fetch(RENDER_URL+'/pending-submissions').then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(data){
    var bks=(data&&data.bookings)||[];var ins=(data&&data.intakes)||[];
    var bk=bks.length;var intake=ins.length;
    var lapsed=lapsedCount();
    var first=_notifyFirstRun;
    // 以 id 判斷是否有「沒見過」的新項目（數量持平也抓得到）
    var hasNewBk=bks.some(function(x){return x&&x.id!=null&&!_seenSubIds[x.id];});
    var hasNewIn=ins.some(function(x){return x&&x.id!=null&&!_seenSubIds[x.id];});
    // 重建為「目前仍待處理」的 id 集合（持久化後，重載不會把已看過的待匯入項目再次當成新項目），同時避免無限累積
    var _ns={};bks.forEach(function(x){if(x&&x.id!=null)_ns[x.id]=1;});ins.forEach(function(x){if(x&&x.id!=null)_ns[x.id]=1;});_seenSubIds=_ns;
    // 首次（登入）以靜音方式提示，避免突然發聲；之後新進的會發聲＋閃爍
    if(hasNewBk&&bk>0)addNotify('bk',bk,first);
    if(hasNewIn&&intake>0)addNotify('intake',intake,first);
    if(first){
      if(lapsed>0&&!NOTIFY_LOG.some(function(n){return n.kind==='care'&&!n.read&&n.count===lapsed;}))addNotify('care',lapsed,true);
    }else{
      if(lapsed>(_lastSeen.lapsed||0))addNotify('care',lapsed);

function startNotifyPolling(){
  // 預先建立／喚醒音訊（瀏覽器需使用者互動後才能播放，登入動作已滿足）
  try{var AC=window.AudioContext||window.webkitAudioContext;if(AC&&!_audioCtx)_audioCtx=new AC();if(_audioCtx&&_audioCtx.state==='suspended')_audioCtx.resume();}catch(e){}
  // 徵詢瀏覽器通知權限（延遲 3 秒讓畫面穩定再請求，確保使用者已完成互動操作）
  try{if(window.Notification&&Notification.permission==='default')setTimeout(function(){Notification.requestPermission();},3000);}catch(e){}
  _notifyFirstRun=true; // 首次檢查不發聲（避免登入就響），但仍會把待匯入項目記成通知
  checkPendingCount();
  if(_notifyTimer)clearInterval(_notifyTimer);
  _notifyTimer=setInterval(checkPendingCount,60000); // 每 1 分鐘檢查一次
}
function notifyTimeAgo(iso){

  var h=Math.floor(m/60);
  if(h<24)return h+' 小時前';
  return Math.floor(h/24)+' 天前';
}

// 共用同步流程：匯入 LIFF 線上預約／初診表填寫、同步 LINE 好友、更新通知；onStart/onDone 控制各自的 UI 呈現
function runSync(onStart,onDone){
  if(typeof onStart==='function')onStart();
  if(!RENDER_URL||!currentUser){if(typeof onDone==='function')onDone(false);return;}
  pullSubmissions(true); // 匯入 LIFF 線上預約與初診表的填寫
  // 同步 LINE 好友（更新頭貼／待綁定狀態，不跳頁）
  fetch(RENDER_URL+'/line-users').then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(data){
    _lineUsers=Array.isArray(data)?data:(data.users||[]);
    _lineUsers.forEach(function(u){var b=lineBoundPatient(u.userId);if(b&&u.pictureUrl&&b.avatar!==u.pictureUrl)b.avatar=u.pictureUrl;});
  }).catch(function(){});
  setTimeout(function(){
    fetch(RENDER_URL+'/pending-submissions').then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(data){
      var bk=((data&&data.bookings)||[]).length;
      var intake=((data&&data.intakes)||[]).length;
      var lapsed=lapsedCount();
      if(bk>_lastSeen.bk)addNotify('bk',bk);
      if(intake>_lastSeen.intake)addNotify('intake',intake);
      if(lapsed>(_lastSeen.lapsed||0))addNotify('care',lapsed);
      _lastSeen.bk=bk;_lastSeen.intake=intake;_lastSeen.lapsed=lapsed;
      _notifyCount.bk=bk;_notifyCount.intake=intake;
      refreshNotifyBell();
      rebuildNotifyPanel();
      if(typeof onDone==='function')onDone(true);
    }).catch(function(){if(typeof onDone==='function')onDone(false);showToast('讀取失敗，請稍後再試');});
  },1500);
}

   /me 不存在或連不上時保留備援角色，畫面照常可用，敏感操作仍由後端擋。 */
function applyServerRole(done){
  if(!RENDER_URL||!currentUser){if(done)done();return;}

function triggerGoogleLogin(){
  var btn=document.getElementById('gSignInBtn');
  var btnHtml=btn?btn.innerHTML:'';
  /* 登入後要等 Google 驗證 + /me + 讀取整份快照，過程可能好幾秒。
     原本只把按鈕調淡，看起來像沒反應；改成明確的「登入中…」狀態並停用按鈕。 */
  function setLoading(v,label){
    if(!btn)return;
    btn.disabled=!!v;
    btn.setAttribute('aria-busy',v?'true':'false');
    btn.style.opacity=v?'.7':'1';
    btn.style.pointerEvents=v?'none':'';
    btn.innerHTML=v
      ?('<svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>'+esc(label||'登入中…'))
      :btnHtml;

  setLoading(true);
  function finishLogin(token,expIn){
    fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+token}}).then(function(res){return res.json();}).then(function(info){
      var email=(info.email||'');var cfg=EMAIL_WHITELIST[email]||EMAIL_WHITELIST[email.toLowerCase()];

        loadFromServer(function(){setLoading(false);go((currentUser.pages.indexOf('dashboard')>-1)?'dashboard':(currentUser.pages[0]||'login'));startNotifyPolling();});
      });
    }).catch(function(){setLoading(false);showLoginError('無法取得帳號資訊，請再試一次');});
  }
  function initAndLogin(){
    try{
      if(!loginClient){loginClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'openid email profile',callback:function(r){if(r.error){if(!loginConsented){loginConsented=true;loginClient.requestAccessToken({prompt:'consent'});return;}setLoading(false);showLoginError('登入失敗：'+r.error);return;}loginConsented=true;finishLogin(r.access_token,r.expires_in);}});}

function _runBackupEncrypt(pw){
  var data=new TextEncoder().encode(JSON.stringify(buildSnapshot()));
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var iv=crypto.getRandomValues(new Uint8Array(12));
  crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey'])
  .then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);})
  .then(function(key){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,data);})
  .then(function(cipher){
    var out=new Uint8Array(4+1+16+12+cipher.byteLength);
    var off=0;[0x4E,0x43,0x45,0x4B].forEach(function(b){out[off++]=b;});out[off++]=1;
    out.set(salt,off);off+=16;out.set(iv,off);off+=12;out.set(new Uint8Array(cipher),off);
    downloadFile(out,'application/octet-stream','領航備份-'+fileStamp()+'.ncek');
    showToast('加密備份已下載 ✓');
  }).catch(function(e){showToast('加密失敗：'+e.message);});
}
function _decryptBackupBuf(buf,pw){
  var bytes=new Uint8Array(buf);
  if(bytes.length<34||bytes[0]!==0x4E||bytes[1]!==0x43||bytes[2]!==0x45||bytes[3]!==0x4B)return Promise.reject(new Error('非加密備份格式'));
  var salt=bytes.slice(5,21),iv=bytes.slice(21,33),cipher=bytes.slice(33);
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey'])
  .then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);})
  .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,cipher);})
  .then(function(plain){return JSON.parse(new TextDecoder().decode(plain));});
}

var _saveExpiredNotified=false;
/* 儲存合併：多數呼叫點連續觸發 saveAll()，改為防抖合併成一次全量 POST，
   降低網路負載與並發覆蓋競態；關鍵時機（關閉分頁、還原前）以 flushSave() 立即送出。 */
var _saveTimer=null,_savePending=false,_saveInFlight=false;
function _saveNow(){
  _saveTimer=null;
  if(!RENDER_URL||!currentUser){_savePending=false;return Promise.resolve();}
  if(_resetDone){_savePending=false;return Promise.resolve();}
  if(_saveInFlight){_savePending=true;return Promise.resolve();} // 前一次尚未完成，等它結束後再補存
  if(typeof navigator!=='undefined'&&navigator.onLine===false){_savePending=true;setOfflineBanner(true);return Promise.resolve();}
  _saveInFlight=true;_savePending=false;
  var snap=buildSnapshot();
  return fetch(RENDER_URL+'/clinic-data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(snap)}).then(function(r){
    if(r.status===401||r.status===403){
      if(!_saveExpiredNotified){_saveExpiredNotified=true;showSaveExpiredModal();}
      return;
    }
    _saveExpiredNotified=false;setOfflineBanner(false);
  }).catch(function(e){console.warn('saveAll 失敗',e.message);_savePending=true;setOfflineBanner(true);})
  .then(function(){_saveInFlight=false;if(_savePending)_saveNow();}); // 期間若有新變更或失敗，補送一次
}
function saveAll(){
  if(!RENDER_URL||!currentUser)return Promise.resolve();
  if(_resetDone)return Promise.resolve();
  _savePending=true;
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(_saveNow,700);

function loadGsi(cb){loadLib('__gsi','https://accounts.google.com/gsi/client',function(){return typeof google!=='undefined'&&google.accounts&&google.accounts.oauth2;},function(err){if(err){showToast('Google SDK 載入失敗');return;}cb();});}
function ensureGCal(cb){
  if(gcalToken&&Date.now()<gcalTokenExp){cb();return;}
  if(GOOGLE_CLIENT_ID.indexOf('YOUR_GOOGLE')>-1){showToast('預覽模式：行事曆同步停用');return;}
  loadGsi(function(){if(!gcalClient){gcalClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'openid email profile https://www.googleapis.com/auth/calendar.events',callback:function(r){if(r.error){if(!gcalConsented){gcalConsented=true;gcalClient.requestAccessToken({prompt:'consent'});return;}showToast('行事曆授權失敗：'+r.error);return;}gcalToken=r.access_token;gcalTokenExp=Date.now()+(Number(r.expires_in||3600)-60)*1000;gcalConsented=true;cb();}});}gcalClient.requestAccessToken({prompt:gcalConsented?'':'consent'});});
}
function fmtTimeMin(min){var h=Math.floor(min/60),m=min%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
function calId(cidOverride){return encodeURIComponent(cidOverride||CLINIC_INFO.calendarId||'primary');}
// 取得某預約應同步的行事曆 ID（優先用治療師個人行事曆，否則用診所預設）
function calIdForBooking(b){
  var t=b&&b.t?THERAPISTS.find(function(x){return x.id===b.t;}):null;
  if(t&&t.calendarId)return t.calendarId;
  return CLINIC_INFO.calendarId||'primary';
}
function gcalUpsert(b){
  var sv=svcOf(b.svc);var startStr=b.date+'T'+fmtTimeMin(b.start)+':00+08:00';var endStr=b.date+'T'+fmtTimeMin(b.start+sv.dur)+':00+08:00';
  var body={summary:b.name+'｜'+sv.name,description:'治療師：'+tName(b.t)+'\n電話：'+b.phone+(b.note?'\n備註：'+b.note:''),start:{dateTime:startStr,timeZone:'Asia/Taipei'},end:{dateTime:endStr,timeZone:'Asia/Taipei'}};
  var cid=calId(calIdForBooking(b));
  var url='https://www.googleapis.com/calendar/v3/calendars/'+cid+'/events';var method='POST';if(b.gcalEventId){url+='/'+b.gcalEventId;method='PATCH';}
  return fetch(url,{method:method,headers:{'Authorization':'Bearer '+gcalToken,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(res){return res.json().then(function(data){return {ok:res.ok,status:res.status,data:data};});}).then(function(r){if(r.ok&&r.data&&r.data.id){b.gcalEventId=r.data.id;return true;}if(r.status===404&&b.gcalEventId){b.gcalEventId=null;return gcalUpsert(b);}throw new Error((r.data&&r.data.error&&r.data.error.message)||('HTTP '+r.status));});
}

// 批次把多筆預約同步到 Google 行事曆（線上預約匯入後使用），完成後存回 gcalEventId
function syncManyToGCal(ids){
  ids=(ids||[]).filter(function(id){var b=BOOKINGS.find(function(x){return x.id===id;});return b&&!b.gcalEventId;});
  if(!ids.length)return;
  ensureGCal(function(){
    var ok=0,fail=0,done=0;
    ids.forEach(function(id){
      var b=BOOKINGS.find(function(x){return x.id===id;});
      if(!b){if(++done===ids.length)finish();return;}
      gcalUpsert(b).then(function(){ok++;}).catch(function(){fail++;}).then(function(){if(++done===ids.length)finish();});
    });
    function finish(){saveAll();if(ok)showToast('已將 '+ok+' 筆線上預約同步至 Google 行事曆 ✓'+(fail?'（'+fail+' 筆失敗）':''));else if(fail)showToast('行事曆同步失敗 '+fail+' 筆，可於預約管理手動同步');}
  });
}

    var parts=[];if(newBk)parts.push('預約 '+newBk+' 筆');if(newIntake)parts.push('初診表 '+newIntake+' 份');if(newPt)parts.push('新增病患 '+newPt+' 位');

/* ============ 排班相關工具 ============ */
function hmToMin(s){var p=String(s||'').split(':');return Number(p[0])*60+(Number(p[1])||0);}
function isLeaveDay(tid,date){var t=THERAPISTS.find(function(x){return x.id===tid;});return !!(t&&t.leaves&&t.leaves.some(function(l){return l.date===date&&(l.allDay===undefined||l.allDay===true);}));}
function hasLeaveConflict(tid,date,startMin,endMin){var t=THERAPISTS.find(function(x){return x.id===tid;});if(!t||!t.leaves)return false;return t.leaves.some(function(l){if(l.date!==date)return false;if(l.allDay===undefined||l.allDay===true)return true;var ls=hmToMin(l.startTime),le=hmToMin(l.endTime);return startMin<le&&endMin>ls;});}
function hasSchedule(t){return !!(t.week&&Object.keys(t.week).some(function(k){return t.week[k]&&t.week[k].length;}));}
function isWorkingSlot(tid,ds,m){var t=THERAPISTS.find(function(x){return x.id===tid;});if(!t)return false;if(hasLeaveConflict(tid,ds,m,m+15))return false;var wd=new Date(ds+'T00:00:00').getDay();var sh=(t.week&&t.week[wd])||[];return sh.some(function(s){var st=hmToMin(s.start),en=hmToMin(s.end);return st<m+15&&en>m;});}
function isWithinShift(tid,ds,startMin,durMin){var t=THERAPISTS.find(function(x){return x.id===tid;});if(!t)return false;if(isLeaveDay(tid,ds))return false;var dur=Number(durMin)||0;var endMin=startMin+Math.max(dur,1);if(hasLeaveConflict(tid,ds,startMin,endMin))return false;if(!hasSchedule(t))return true;var wd=new Date(ds+'T00:00:00').getDay();var sh=(t.week&&t.week[wd])||[];if(!sh.length)return false;return sh.some(function(s){var st=hmToMin(s.start),en=hmToMin(s.end);return startMin>=st&&startMin<en&&endMin<=en;});}
/* 同治療師時段衝突檢查（嬋柔團課 s13 允許多人；excludeId 為改期時排除自己）*/
var GROUP_SVC_IDS=['s13'];
function slotConflict(tid,date,startMin,svcId,excludeId){
  if(GROUP_SVC_IDS.indexOf(svcId)>-1)return null;
  var endMin=startMin+(svcOf(svcId).dur||50);
  var hit=null;
  BOOKINGS.forEach(function(b){
    if(hit)return;
    if(b.id===excludeId)return;
    if(b.t!==tid||b.date!==date)return;
    if(b.status==='cancelled'||b.status==='canceled')return;
    /* 新預約若為團課，前面已 return null；走到這裡代表新預約是 1 對 1，
       因此即使既有預約是團課（治療師正在上課）也算衝突，不可再排 1 對 1 */
    var bs=Number(b.start)||0;var be=bs+(svcOf(b.svc).dur||50);
    if(startMin<be&&bs<endMin)hit=b;
  });
  return hit;
}

function renderCal(){
  var mount=document.getElementById('calMount');if(!mount)return;
  if(!calWeek)calWeek=startOfWeek(new Date());
  var DOW=['一','二','三','四','五','六','日'];var today=todayStr();
  var days=[];for(var i=0;i<7;i++){var d=new Date(calWeek);d.setDate(calWeek.getDate()+i);days.push(d);}
  var rng=document.getElementById('calRange');if(rng)rng.textContent=(calWeek.getMonth()+1)+'/'+calWeek.getDate()+' - '+(days[6].getMonth()+1)+'/'+days[6].getDate();
  var leaveTs=THERAPISTS.filter(function(t){return calActive(t.id);});
  var schedAny=leaveTs.some(hasSchedule);
  function dayLeaves(ds){return leaveTs.filter(function(t){return isLeaveDay(t.id,ds);});}
  var HOUR_H=48,DAY_START=480,DAY_END=1320;var HRS=(DAY_END-DAY_START)/60;var GRID_H=HRS*HOUR_H;
  function placeEvents(evs){
    evs.sort(function(a,b){return a.start-b.start||a.end-b.end;});
    var clusters=[],cur=[],curEnd=-1;
    evs.forEach(function(e){if(cur.length&&e.start>=curEnd){clusters.push(cur);cur=[];curEnd=-1;}cur.push(e);curEnd=Math.max(curEnd,e.end);});
    if(cur.length)clusters.push(cur);
    clusters.forEach(function(g){var lanes=[];g.forEach(function(e){var placed=false;for(var i=0;i<lanes.length;i++){if(lanes[i]<=e.start){e.col=i;lanes[i]=e.end;placed=true;break;}}if(!placed){e.col=lanes.length;lanes.push(e.end);}});g.forEach(function(e){e.cols=lanes.length;});});
    return evs;
  }
  var head='<div style="display:flex;min-width:760px"><div style="width:48px;flex-shrink:0"></div>';
  days.forEach(function(d){var ds=dstr(d);var t=ds===today;var lv=dayLeaves(ds);var lvMark=lv.length?'<div style="display:flex;gap:2px;justify-content:center;margin-top:2px">'+lv.map(function(x){return '<span class="cal-dot" style="background:var(--danger)" title="'+esc(x.name)+' 休診"></span>';}).join('')+'</div>':'';head+='<div style="flex:1;text-align:center;padding:6px 2px;border-left:1px solid var(--line);color:'+(t?'var(--mint-d)':'var(--slate)')+';font-size:12px">週'+DOW[(d.getDay()+6)%7]+'<br><span style="font-size:13px;color:'+(t?'var(--mint-d)':'var(--ink)')+'">'+d.getDate()+'</span>'+lvMark+'</div>';});
  head+='</div>';
  var axis='<div style="width:48px;flex-shrink:0;position:relative;height:'+GRID_H+'px">';
  for(var hi=0;hi<HRS;hi++){axis+='<div style="position:absolute;top:'+(hi*HOUR_H)+'px;right:4px;font-size:10px;color:var(--slate)">'+String((DAY_START/60)+hi).padStart(2,'0')+':00</div>';}
  axis+='</div>';
  var cols=days.map(function(d){var ds=dstr(d);
    var inner='';
    for(var k=0;k<HRS;k++){var mm0=DAY_START+k*60;var working=leaveTs.some(function(t){return isWorkingSlot(t.id,ds,mm0);});var onLeave=schedAny&&!working;inner+='<div style="position:absolute;left:0;right:0;top:'+(k*HOUR_H)+'px;height:'+HOUR_H+'px;border-top:1px solid var(--line)'+(onLeave?';background:#fef2f2':'')+'"></div>';}
    var evs=placeEvents(BOOKINGS.filter(function(b){return b.date===ds&&calActive(b.t);}).map(function(b){var dur=svcOf(b.svc).dur||50;return {b:b,start:b.start,end:b.start+dur};}));
    evs.forEach(function(e){var b=e.b;var top=(e.start-DAY_START)/60*HOUR_H;var ht=Math.max((e.end-e.start)/60*HOUR_H-2,16);var w=100/e.cols;var left=e.col*w;var hh=Math.floor(b.start/60),mn=b.start%60;var c=tColor(b.t);var two=ht>=30;inner+='<div onclick="bkDetail('+b.id+')" title="'+esc(b.name)+' '+esc(svcOf(b.svc).name)+'" style="position:absolute;top:'+top+'px;height:'+ht+'px;left:calc('+left+'% + 1px);width:calc('+w+'% - 3px);background:'+c+'1f;border-left:3px solid '+c+';border-radius:4px;padding:2px 4px;cursor:pointer;overflow:hidden;box-shadow:0 1px 2px rgba(26,77,104,.08)"><div style="font-size:10px;font-weight:700;color:'+c+';line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+String(hh).padStart(2,'0')+':'+String(mn).padStart(2,'0')+' '+esc(b.name)+'</div>'+(two?'<div style="font-size:9px;color:var(--slate);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(svcOf(b.svc).name)+'</div>':'')+'</div>';});
    return '<div style="flex:1;position:relative;height:'+GRID_H+'px;border-left:1px solid var(--line)">'+inner+'</div>';
  }).join('');
  var h='<div style="overflow-x:auto">'+head+'<div style="display:flex;min-width:760px;position:relative">'+axis+cols+'</div></div>';
  mount.innerHTML=h;
}

function saveBk(id){
  var b=BOOKINGS.find(function(x){return x.id===id;});if(!b)return;
  /* 先記下變更前的行事曆與事件，治療師（行事曆）改變時才能正確刪除/搬移舊事件 */
  var oldCalId=calIdForBooking(b);var oldEvt=b.gcalEventId;
  var newT=document.getElementById('eb-t').value;var newDate=document.getElementById('eb-date').value||b.date;var newSvc=document.getElementById('eb-svc').value;var tv=document.getElementById('eb-time').value;var newStart=b.start;if(tv){var hm=tv.split(':');newStart=Number(hm[0])*60+Number(hm[1]);}
  if(isLeaveDay(newT,newDate)){showToast(tName(newT)+' 於 '+newDate+' 為休假日');return;}
  var dur=svcOf(newSvc).dur;var endMin=newStart+dur;
  if(newStart<480||endMin>1320){showToast('預約時間需在 08:00–22:00 之間');return;}
  if(!isWithinShift(newT,newDate,newStart,dur)){showToast('此時段非 '+tName(newT)+' 的上班時間');return;}
  var confE=slotConflict(newT,newDate,newStart,newSvc,id);
  if(confE){showToast('此時段 '+tName(newT)+' 已有預約（'+confE.name+' '+confE.time+'），請改選其他時段');return;}
  b.name=document.getElementById('eb-name').value||b.name;b.phone=document.getElementById('eb-phone').value||b.phone;b.t=newT;b.svc=newSvc;b.date=newDate;b.start=newStart;if(tv)b.time=tv;b.note=document.getElementById('eb-note').value||'';
  var newStatus=_pendingStatus[id];var statusChanged=newStatus&&newStatus!==b.status;var prev=b.status;
  if(statusChanged)b.status=newStatus;
  delete _pendingStatus[id];
  var newCalId=calIdForBooking(b);var calChanged=(newCalId!==oldCalId);
  closeModal();renderCal();saveAll();
  if(statusChanged&&newStatus==='cancelled'&&prev!=='cancelled'){
    /* 用變更前的行事曆/事件刪除，避免在新治療師的行事曆上找不到而刪錯 */
    if(oldEvt){b.gcalEventId=null;gcalDelete(oldEvt,null,oldCalId);}
    var p=getPatient(b.phone);if(p&&p.lineId){sendLineMsg(p.lineId,lineTemplates(b).cancel);showToast('已儲存並通知取消');}else{showToast('已儲存（已取消，病患未綁定 LINE）');}
  }else{
    /* 若治療師（行事曆）改變，先移除舊行事曆上的事件並清掉 id，再由 syncOne 於新行事曆乾淨建立，避免孤兒事件 */
    if(calChanged&&oldEvt){b.gcalEventId=null;gcalDelete(oldEvt,null,oldCalId);}
    showToast('已儲存');syncOne(id);
  }
}

      fetch(RENDER_URL+'/push-receipt-image',{
        method:'POST',headers:{'Content-Type':'application/json'},

      }).then(function(r){return r.json().then(function(j){return{ok:r.ok,body:j};});})
      .then(function(res){
        if(res.ok){showToast('收據已推播至 LINE ✓');}
        else{showToast('推播失敗：'+((res.body&&res.body.message)||'未知錯誤'));}
        if(btn){btn.disabled=false;btn.textContent='推播 LINE';}
      }).catch(function(e){showToast('推播失敗：'+e.message);if(btn){btn.disabled=false;btn.textContent='推播 LINE';}});
    }).catch(function(e){showToast('產生圖片失敗：'+e.message);if(btn){btn.disabled=false;btn.textContent='推播 LINE';}});
  });
}

/* 表格內搜尋：隱藏不符的列，並在全部被濾掉時補一列提示，
   否則使用者只看到一片空白，分不清是「沒有符合」還是「壞掉了」。 */
function filterRows(tbodyId,q,emptyText){
  var body=document.getElementById(tbodyId);if(!body)return;
  q=(q||'').toLowerCase();
  var shown=0;
  Array.prototype.forEach.call(body.querySelectorAll('tr'),function(tr){
    if(tr.classList.contains('no-result'))return;
    var hit=tr.textContent.toLowerCase().indexOf(q)>-1;
    tr.style.display=hit?'':'none';
    if(hit)shown++;
  });
  var msg=body.querySelector('tr.no-result');
  if(!shown){
    if(!msg){
      msg=document.createElement('tr');msg.className='no-result';
      var td=document.createElement('td');td.colSpan=12;td.textContent=emptyText||'查無符合的資料';
      msg.appendChild(td);body.appendChild(msg);
    }
    msg.style.display='';
  }else if(msg){msg.style.display='none';}
}

/* 病患 key（phone 或 pid）改變時，把所有以舊 key 索引的資料一併搬到新 key。
   涵蓋預約、消費、病歷、初診、標籤、課程/套票、衛教傳送紀錄。供 savePt 與線上匯入採用同一電話時共用。 */
function migratePatientKey(oldKey,newKey){
  if(!oldKey||!newKey||oldKey===newKey)return;
  BOOKINGS.forEach(function(b){if(b.phone===oldKey)b.phone=newKey;});
  PAYMENTS.forEach(function(r){if(r.phone===oldKey)r.phone=newKey;});
  SOAP_NOTES.forEach(function(n){if(n.phone===oldKey)n.phone=newKey;});
  if(INTAKE_DATA[oldKey]){if(INTAKE_DATA[newKey]==null)INTAKE_DATA[newKey]=INTAKE_DATA[oldKey];delete INTAKE_DATA[oldKey];}
  if(PT_TAG_DATA[oldKey]){if(PT_TAG_DATA[newKey]==null)PT_TAG_DATA[newKey]=PT_TAG_DATA[oldKey];delete PT_TAG_DATA[oldKey];}
  if(PT_PACKAGES[oldKey]){if(PT_PACKAGES[newKey]==null)PT_PACKAGES[newKey]=PT_PACKAGES[oldKey];delete PT_PACKAGES[oldKey];}
  Object.keys(EDU_SENT).forEach(function(eid){(EDU_SENT[eid]||[]).forEach(function(r){if(r.phone===oldKey)r.phone=newKey;});});
}
function savePt(ph){
  var p=getPatient(ph);if(!p)return;var oldPhone=p.phone;var newPhone=document.getElementById('pe-phone').value.trim();
  if(newPhone&&newPhone!==oldPhone){if(!PHONE_RE.test(newPhone)){showToast('電話格式不正確（僅可含數字與 () - + 空白，5–20 碼）');return;}var dup=PATIENTS.find(function(x){return x!==p&&x.phone===newPhone;});if(dup){showToast('此電話已被其他病患使用');return;}
    /* 不能只在 oldPhone 有值時搬移：LINE/初診建立的病患原本以 pid 為 key，
       首次補填電話時 key 會從 pid 變成電話，仍需把 pid 名下的資料搬過去，否則套票/病歷/標籤全部孤立 */
    migratePatientKey(oldPhone||p.pid,newPhone);p.phone=newPhone;}
  p.name=document.getElementById('pe-name').value.trim()||p.name;p.dob=document.getElementById('pe-dob').value||p.dob;p.idNum=document.getElementById('pe-id').value||p.idNum;p.note=document.getElementById('pe-note').value||'';
  saveAll();closeModal();go('patients');showToast('已儲存');
}

function saveEditPkgSessions(ph,pid){

  saveAll();reopenPtPay(ph);showToast('課程堂數已更新');
}

  if(_anaMode==='month'){var idx=(y*12+(m-1))+offset;var yy=Math.floor(idx/12),mm=idx%12+1;var last=new Date(yy,mm,0).getDate();return {from:yy+'-'+String(mm).padStart(2,'0')+'-01',to:yy+'-'+String(mm).padStart(2,'0')+'-'+String(last).padStart(2,'0'),label:yy+' 年 '+mm+' 月'};}

/* 客單價基準：同一天＋同一位病患的消費紀錄合併為「一筆客單」 */

  var rev=rows.reduce(function(a,p){return a+(p.amount||0);},0);var count=rows.length;var custN=custTickets(rows);var avg=custN?Math.round(rev/custN):0;
  var svc={};rows.forEach(function(p){var k,nm;if(p.shockwave){k='__sw__';nm='震波套票（發數扣抵）';}else{k=p.svc||p.svcName;nm=p.svcName||svcOf(p.svc).name;}if(!svc[k])svc[k]={name:nm,count:0,rev:0};svc[k].count++;svc[k].rev+=(p.amount||0);});
  var byT={};rows.forEach(function(p){if(!byT[p.t])byT[p.t]={count:0,rev:0};if(!p.shockwave)byT[p.t].count++;byT[p.t].rev+=(p.amount||0);});

}

/* ============ 客戶回流 / 需要關心的名單 ============ */
var ATTN_BUCKETS=[
  {id:'d1',label:'1-2 天',short:'1-2天',color:'#3b82f6',light:'#eff6ff',desc:'近期剛來過'},
  {id:'d3',label:'3-6 天',short:'3-6天',color:'#2DC8A0',light:'#edfaf6',desc:'一週內'},
  {id:'d7',label:'7 天以上',short:'7天以上',color:'#e0992a',light:'#fdf3e0',desc:'超過一週未回診'},
  {id:'m1',label:'1 個月以上',short:'1個月以上',color:'#e05c5c',light:'#fef2f2',desc:'超過一個月，建議主動關心'}
];
function attnBucketOf(days){return days>=30?'m1':days>=7?'d7':days>=3?'d3':days>=1?'d1':null;}
function careStats(){
  var map={};
  BOOKINGS.filter(function(b){return b.status==='completed';}).forEach(function(b){
    var k=b.phone;if(!k)return;
    if(!map[k])map[k]={phone:k,name:b.name||'',count:0,last:'',t:''};
    map[k].count++;
    if(b.date>map[k].last){map[k].last=b.date;map[k].t=b.t;}
    if(!map[k].name&&b.name)map[k].name=b.name;
  });
  var today=new Date();today.setHours(0,0,0,0);
  var list=Object.keys(map).map(function(k){
    var r=map[k];var pt=getPatient(k);if(pt&&pt.name)r.name=pt.name;r.lineId=pt?pt.lineId:'';
    var pa=(r.last||'').split('-');var d=pa.length===3?new Date(+pa[0],+pa[1]-1,+pa[2]):today;
    r.days=Math.round((today-d)/86400000);r.bucket=attnBucketOf(r.days);
    return r;
  });
  var total=list.length;var returning=list.filter(function(r){return r.count>1;}).length;
  return {list:list,rate:total?Math.round(returning/total*100):0,total:total};
}
var _careFilter='all';

views.retention=function(){
  var cs=careStats();
  var counts={};ATTN_BUCKETS.forEach(function(b){counts[b.id]=0;});
  cs.list.forEach(function(r){if(r.bucket)counts[r.bucket]++;});
  var cards=ATTN_BUCKETS.map(function(b){var on=_careFilter===b.id;return '<div class="stat-card" onclick="setCareFilter(\''+(on?'all':b.id)+'\')" style="cursor:pointer;border-color:'+(on?b.color:'var(--line)')+';background:'+(on?b.light:'#fff')+'"><div class="sc-n" style="color:'+b.color+'">'+counts[b.id]+'</div><div class="sc-l">'+b.label+'<br><span style="font-size:10px">'+b.desc+'</span></div></div>';}).join('');
  var rows=cs.list.filter(function(r){return r.bucket&&(_careFilter==='all'||r.bucket===_careFilter);}).sort(function(a,b){return b.days-a.days;});
  var pills='<button class="pay-pill'+(_careFilter==='all'?' sel':'')+'" onclick="setCareFilter(\'all\')">全部需關心</button>'+ATTN_BUCKETS.map(function(b){var on=_careFilter===b.id;return '<button class="pay-pill'+(on?' sel':'')+'" style="'+(on?'background:'+b.color+';border-color:'+b.color+';color:#fff;':'')+'" onclick="setCareFilter(\''+b.id+'\')">'+b.short+'（'+counts[b.id]+'）</button>';}).join('');
  var table=rows.length?('<table><thead><tr><th>病患</th><th>上次就診</th><th>已隔</th><th>治療師</th><th>關心動作</th></tr></thead><tbody>'+rows.map(careRow).join('')+'</tbody></table>'):'<div class="empty">'+(_careFilter==='all'?'目前沒有需要特別關心的個案 👍':'此區間沒有個案')+'</div>';
  return shell('retention','客戶回流',
    '<div class="stat-grid">'+cards+'</div>'+
    '<div class="card"><div class="card-head"><h3>需要關心的名單</h3><div class="row" style="gap:6px;flex-wrap:wrap"><span class="tag mint">回流率 '+cs.rate+'%</span>'+pills+'</div></div><div class="card-body flush">'+table+'</div></div>'+
    '<div class="banner info"><span>i</span><div>依「距離上次完成療程的天數」分組：1-2 天、3-6 天、7 天以上、1 個月以上（每位個案僅歸入最符合的一組）。點上方卡片或標籤可快速篩選，並可直接推播 LINE 關心訊息。回流率為完成 2 次以上療程的病患佔比。</div></div>');
};

function saveEdu(){var title=document.getElementById('eu-title').value.trim();if(!title){showToast('請填寫標題');return;}var url=document.getElementById('eu-url').value.trim();if(_euType==='video'&&!url){showToast('影片請填寫連結網址');return;}EDU_DATA.push({id:++EDU_ID,type:_euType,title:title,cat:document.getElementById('eu-cat').value||EDU_CATS[1]||'未分類',url:url,desc:document.getElementById('eu-desc').value||'',createdAt:todayStr()});closeModal();go('education');showToast('已新增');}
function sendEduModal(id){var e=EDU_DATA.find(function(x){return x.id===id;});if(!e)return;if(!PATIENTS.length){showToast('尚無病患可傳送');return;}var sent=(EDU_SENT[id]||[]).map(function(r){return r.phone;});var rows=PATIENTS.map(function(p){var key=ptKey(p);var done=sent.indexOf(key)>-1;var chips=tagChips(key);return '<div class="row" style="gap:10px;padding:9px 0;border-bottom:1px solid var(--line)"><input type="checkbox" class="sendchk" value="'+esc(key)+'" data-name="'+esc(p.name)+'"'+(done?' checked disabled':'')+' style="width:16px;height:16px"><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px">'+esc(p.name)+'</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:3px">'+(chips||'<span style="font-size:11px;color:var(--slate)">（無標籤）</span>')+'</div></div>'+(p.lineId?'<span class="tag green" style="background:#06C75522;color:#06C755">LINE</span>':'<span class="tag gray">未綁 LINE</span>')+(done?'<span class="tag mint">已傳送</span>':'')+'</div>';}).join('');modal('<div class="modal-head" style="background:var(--navy)">傳送衛教內容<button class="x" aria-label="關閉" onclick="closeModal()">&times;</button></div><div class="modal-body"><div style="background:var(--navy-l);border-radius:10px;padding:12px;margin-bottom:14px"><div style="font-weight:700">'+esc(e.title)+'</div><div style="font-size:11px;color:var(--slate)">'+esc(e.cat)+'</div></div><div class="sec-label">選擇病患</div><label class="row" style="gap:8px;font-size:13px;margin-bottom:6px"><input type="checkbox" onchange="document.querySelectorAll(\'.sendchk:not(:disabled)\').forEach(function(c){c.checked=event.target.checked;})" style="width:16px;height:16px"> 全選</label>'+rows+'</div><div class="modal-foot"><button class="btn gray" onclick="closeModal()">關閉</button><button class="btn" onclick="confirmSend('+id+')">標記已傳送</button></div>');}
function confirmSend(id){var sel=Array.prototype.slice.call(document.querySelectorAll('.sendchk:checked:not(:disabled)'));if(!sel.length){showToast('請選擇至少一位病患');return;}var e=EDU_DATA.find(function(x){return x.id===id;});if(!e)return;if(!EDU_SENT[id])EDU_SENT[id]=[];var now=new Date().toLocaleString('zh-TW',{hour12:false}).slice(0,16);var lineCount=0,noLine=0;sel.forEach(function(c){EDU_SENT[id].push({phone:c.value,name:c.dataset.name,sentAt:now});var p=getPatient(c.value);if(p&&p.lineId){var msg='【領航物理治療所｜衛教分享】\n'+e.title+(e.desc?'\n'+e.desc:'')+(e.url?'\n\n👉 '+e.url:'');sendLineMsg(p.lineId,msg);lineCount++;}else{noLine++;}});closeModal();go('education');var tip='已標記傳送給 '+sel.length+' 位';if(lineCount)tip+='，其中 '+lineCount+' 位已推播 LINE';if(noLine)tip+='，'+noLine+' 位未綁定 LINE';showToast(tip);}

/* ============ 排班設定 ============ */
var schedT=(THERAPISTS[0]&&THERAPISTS[0].id)||'Sky';
var DOW_N=['日','一','二','三','四','五','六'];
var DOW_O=[1,2,3,4,5,6,0];
function ensureWeek(t){if(!t.week)t.week={};return t.week;}
function ensureLeaves(t){if(!t.leaves)t.leaves=[];return t.leaves;}
function setSchedT(tid){schedT=tid;go('schedule');}
function addShift(tid,day){var t=THERAPISTS.find(function(x){return x.id===tid;});ensureWeek(t);if(!t.week[day])t.week[day]=[];syncShifts(tid);t.week[day].push({name:'時段'+(t.week[day].length+1),start:'09:00',end:'13:00'});go('schedule');}
function rmShift(tid,day,i){var t=THERAPISTS.find(function(x){return x.id===tid;});syncShifts(tid);t.week[day].splice(i,1);if(!t.week[day].length)delete t.week[day];go('schedule');}
function toggleOff(tid,day){var t=THERAPISTS.find(function(x){return x.id===tid;});ensureWeek(t);syncShifts(tid);if(t.week[day]&&t.week[day].length)delete t.week[day];else t.week[day]=[{name:'早班',start:'09:00',end:'13:00'}];go('schedule');}
function syncShifts(tid){var t=THERAPISTS.find(function(x){return x.id===tid;});if(!t||!t.week)return;DOW_O.forEach(function(day){var sh=t.week[day];if(!sh)return;sh.forEach(function(s,i){var nm=document.getElementById('ws-'+day+'-'+i+'-n');var st=document.getElementById('ws-'+day+'-'+i+'-s');var en=document.getElementById('ws-'+day+'-'+i+'-e');if(nm&&nm.value)s.name=nm.value.trim();if(st)s.start=st.value;if(en)s.end=en.value;});});}
function saveSched(tid){var t=THERAPISTS.find(function(x){return x.id===tid;});syncShifts(tid);t.workDays=Object.keys(t.week).map(Number).filter(function(d){return t.week[d]&&t.week[d].length;});go('schedule');showToast(t.name+' 排班已儲存');}
function addLeave(tid){syncShifts(tid);var t=THERAPISTS.find(function(x){return x.id===tid;});ensureLeaves(t);var date=document.getElementById('lv-date').value;var reason=document.getElementById('lv-reason').value.trim();var allDayCb=document.getElementById('lv-allday');var allDay=!allDayCb||allDayCb.checked;var startTime=!allDay?(document.getElementById('lv-start').value||'09:00'):'';var endTime=!allDay?(document.getElementById('lv-end').value||'18:00'):'';if(!date){showToast('請選擇休假日期');return;}if(!allDay&&startTime>=endTime){showToast('結束時間必須晚於開始時間');return;}if(allDay&&t.leaves.some(function(l){return l.date===date&&(l.allDay===undefined||l.allDay===true);})){showToast('該日期已有全天休假');return;}t.leaves.push({date:date,allDay:allDay,startTime:startTime,endTime:endTime,reason:reason});t.leaves.sort(function(a,b){return a.date.localeCompare(b.date)||((a.startTime||'').localeCompare(b.startTime||''));});go('schedule');showToast('已新增'+(allDay?'全天':'時段')+'休假');}
function rmLeave(tid,idx){syncShifts(tid);var t=THERAPISTS.find(function(x){return x.id===tid;});ensureLeaves(t);if(idx>=0&&idx<t.leaves.length)t.leaves.splice(idx,1);go('schedule');showToast('已移除休假');}
function toggleLeaveTime(cb){var show=!cb.checked;['lv-start','lv-dash','lv-end'].forEach(function(id){var el=document.getElementById(id);if(el)el.style.display=show?'':'none';});}
function leaveRows(t){ensureLeaves(t);if(!t.leaves.length)return '<div class="empty">尚無特別休假日</div>';return t.leaves.map(function(l,i){var d=new Date(l.date+'T00:00:00');var w=DOW_N[d.getDay()];var isAllDay=l.allDay===undefined||l.allDay===true;var timeStr=isAllDay?'全天':((l.startTime||'--')+'–'+(l.endTime||'--'));return '<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><div class="row" style="gap:10px"><span class="day-badge" style="background:'+(isAllDay?'var(--danger)':'var(--warn)')+'">'+(isAllDay?'假':'段')+'</span><div><div style="font-weight:700">'+l.date+' （週'+w+'）<span class="tag '+(isAllDay?'amber':'mint')+'" style="margin-left:6px;font-size:10px">'+esc(timeStr)+'</span></div>'+(l.reason?'<div style="font-size:11px;color:var(--slate)">'+esc(l.reason)+'</div>':'')+'</div></div><button class="shift-del" onclick="rmLeave(\''+t.id+'\','+i+')">&times;</button></div>';}).join('');}
views.schedule=function(){
  var myT=_myTherapistId();if(myT)schedT=myT;
  var t=THERAPISTS.find(function(x){return x.id===schedT;})||THERAPISTS[0];if(!t)return shell('schedule','排班設定','<div class="empty">尚無治療師</div>');ensureWeek(t);ensureLeaves(t);
  var pills=myT?('<span class="cal-pill active" style="background:'+tColor(myT)+';border-color:'+tColor(myT)+';color:#fff;cursor:default" title="治療師僅能編輯自己的排班"><span class="cal-dot" style="background:rgba(255,255,255,.7)"></span>'+esc(t.name)+'（僅本人）</span>'):THERAPISTS.map(function(th){var sel=th.id===schedT;return '<button class="cal-pill'+(sel?' active':'')+'" style="'+(sel?'background:'+tColor(th.id)+';border-color:'+tColor(th.id)+';color:#fff;':'')+'" onclick="setSchedT(\''+th.id+'\')"><span class="cal-dot" style="background:'+(sel?'rgba(255,255,255,.7)':tColor(th.id))+'"></span>'+esc(th.name)+'</button>';}).join('');
  var cards=DOW_O.map(function(day){var sh=t.week[day]||[];var off=!sh.length;var c=tColor(t.id);var rows=sh.map(function(s,i){return '<div class="shift-row"><input id="ws-'+day+'-'+i+'-n" class="shift-name" value="'+esc(s.name)+'" style="border-left:3px solid '+c+'"><input id="ws-'+day+'-'+i+'-s" type="time" class="shift-time" value="'+s.start+'"><span style="color:var(--slate)">-</span><input id="ws-'+day+'-'+i+'-e" type="time" class="shift-time" value="'+s.end+'"><button class="shift-del" onclick="rmShift(\''+t.id+'\','+day+','+i+')">&times;</button></div>';}).join('');return '<div class="day-card'+(off?' off':'')+'"><div class="day-head"><div class="day-title"><span class="day-badge" style="background:'+(off?'var(--mist)':c)+'">'+DOW_N[day]+'</span>週'+DOW_N[day]+'</div><div class="row" style="gap:6px">'+(off?'<button class="btn sm ghost" onclick="toggleOff(\''+t.id+'\','+day+')">設為上班</button>':'<button class="btn sm ghost" onclick="addShift(\''+t.id+'\','+day+')">+ 時段</button><button class="btn sm gray" onclick="toggleOff(\''+t.id+'\','+day+')">休診</button>')+'</div></div>'+(off?'<div style="color:var(--slate);font-size:13px">休診</div>':rows)+'</div>';}).join('');
  var workN=DOW_O.filter(function(d){return (t.week[d]||[]).length;}).length;
  return shell('schedule','排班設定','<div class="card"><div class="card-head"><h3><span class="cal-dot" style="background:'+tColor(t.id)+';display:inline-block;margin-right:6px"></span>'+esc(t.name)+' 每週班表</h3><div class="row" style="gap:8px"><span class="tag mint">每週 '+workN+' 天</span><button class="btn sm" onclick="saveSched(\''+t.id+'\')">儲存排班</button></div></div><div class="card-body">'+cards+'</div></div>'+
    '<div class="card"><div class="card-head"><h3>特別休假日</h3><span class="tag amber">'+t.leaves.length+' 天</span></div><div class="card-body"><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center"><input id="lv-date" type="date" min="'+todayStr()+'" max="2100-12-31" onchange="this.classList.toggle(\'date-empty\',!this.value)" class="date-empty" data-ph="選擇休假日期" style="padding:9px 11px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><label class="row" style="gap:5px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer"><input type="checkbox" id="lv-allday" checked onchange="toggleLeaveTime(this)" style="width:auto;cursor:pointer"> 全天</label><input id="lv-start" type="time" value="09:00" style="display:none;padding:9px 10px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><span id="lv-dash" style="display:none;color:var(--slate);font-weight:700">–</span><input id="lv-end" type="time" value="18:00" style="display:none;padding:9px 10px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><input id="lv-reason" placeholder="事由（選填）" style="flex:1;min-width:120px;padding:9px 11px;border:1.5px solid var(--mist);border-radius:8px;outline:none"><button class="btn sm" onclick="addLeave(\''+t.id+'\')">+ 新增</button></div><div id="leaveList">'+leaveRows(t)+'</div><div class="banner info" style="margin-top:14px"><span>i</span><div>特別休假日優先於每週班表；設定後該日於預約行事曆會以紅點標示為休診。</div></div></div></div>',
    '<div class="row" style="gap:5px">'+pills+'</div>');
};

};
function publishCatalogModal(){

function doPublishCatalog(){
  var svc=[];document.querySelectorAll('.pub-svc:checked').forEach(function(c){svc.push(c.value);});
  var pkg=[];document.querySelectorAll('.pub-pkg:checked').forEach(function(c){pkg.push(c.value);});
  if(!svc.length){showToast('請至少選擇一項服務，線上預約才有可預約的項目');return;}
  PUBLISHED_SVC_IDS=svc;PUBLISHED_PKG_IDS=pkg;
  closeModal();publishCatalog();saveAll();
}
function publishCatalog(){
  if(!RENDER_URL){showToast('請先設定 RENDER_URL');return;}
  var svcSel=PUBLISHED_SVC_IDS!=null?PUBLISHED_SVC_IDS:SERVICES.map(function(s){return s.id;});
  var pkgSel=PUBLISHED_PKG_IDS!=null?PUBLISHED_PKG_IDS.map(String):PACKAGES.map(function(p){return String(p.id);});
  var pubSvcs=SERVICES.filter(function(s){return svcSel.indexOf(s.id)>-1;});
  var pubPkgs=PACKAGES.filter(function(p){return !p.shockwave&&pkgSel.indexOf(String(p.id))>-1;});
  var cat={services:pubSvcs.map(function(s){return {id:s.id,name:s.name,dur:s.dur,price:s.price,desc:s.desc||'',ts:s.ts||[]};}),therapists:THERAPISTS.map(function(t){return {id:t.id,name:t.name,title:t.title||'',color:tColor(t.id),week:t.week||{},leaves:t.leaves||[]};}),packages:pubPkgs.map(function(p){return {id:p.id,name:p.name,svcs:pkgSvcs(p),sessions:p.sessions,price:p.price,desc:p.desc||'',ts:p.ts||[]};})};
  showToast('發布中…');
  fetch(RENDER_URL+'/publish-catalog',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cat)}).then(function(r){if(r.ok)showToast('已發布 '+pubSvcs.length+' 項服務、'+pubPkgs.length+' 項課程 ✓');else showToast('發布失敗：HTTP '+r.status);}).catch(function(e){showToast('發布失敗：'+e.message);});
}

  ];

  spec.forEach(function(s){

  var box=document.getElementById('frame');
  if(box&&(!box.innerHTML||box.innerHTML.length<50)){
    box.innerHTML='<div style="padding:30px;font-family:monospace;font-size:12px;color:#c00;line-height:1.8"><b>JS 錯誤（請截圖回報）：</b><br>'+esc(ev.message||'')+'<br>行 '+Number(ev.lineno||0)+'，列 '+Number(ev.colno||0)+'<br><button style="margin-top:14px;padding:8px 16px;border:none;background:#1a4d68;color:#fff;border-radius:8px;cursor:pointer" onclick="location.reload()">重新整理</button></div>';
  }else{
    /* 畫面還在，只是某個操作出錯：給輕量提示，不破壞當前畫面 */
    __safeErrorToast(ev.message);
  }
});
/* 攔截未處理的 Promise 錯誤（非同步：fetch / 行事曆 / LINE 等） */
window.addEventListener('unhandledrejection',function(ev){
  console.error('未處理的非同步錯誤:',ev.reason);
  __safeErrorToast(ev.reason&&ev.reason.message);
});
function __bootApp(){
  if(typeof setFavicon==='function')setFavicon();
  var chk=__selfCheck();
  if(!chk.ok){
    var msg='<div style="padding:30px;font-family:monospace;font-size:13px;line-height:1.9"><b style="color:#c00;font-size:15px">⚠ 自我檢查發現缺漏</b><br><br>';
    if(chk.missing.length)msg+='<b>未定義的頁面：</b><br>'+chk.missing.join('、')+'<br><br>';
    if(chk.missingFn.length)msg+='<b>未定義的函式：</b><br>'+chk.missingFn.join('、')+'<br><br>';
    msg+='<span style="color:#666">這表示某段程式碼有語法錯誤中斷了後續定義，請把瀏覽器 Console（F12）的紅字錯誤回報。</span></div>';
    document.getElementById('frame').innerHTML=msg;
    return;
  }
  var start='login';
  go(start);
}
__bootApp();
</script>
</body>
</html>
