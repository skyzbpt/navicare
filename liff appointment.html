<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>領航物理治療所 · 初診問卷</title>
<style>
:root{
  --navy:#1a4d68;--mint:#2DC8A0;--mint-d:#1f9e7e;--mint-l:#edfaf6;
  --slate:#6b8a9c;--mist:#dce6ec;--line:#eef3f6;--bg:#f6fafb;
  --danger:#e05c5c;--ink:#1f3a47;--line-green:#06C755;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::placeholder{color:#a8bcc8}
.wrap{min-height:100vh}
.top{background:var(--navy);color:#fff;padding:20px 22px}
.top .ttl{font-size:18px;font-weight:700}
.top .sub{font-size:12px;opacity:.85;margin-top:2px}
.steps{display:flex;gap:4px;padding:16px 22px 0;background:var(--navy)}
.istep{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
.istep.done{background:var(--mint)}
.istep.cur{background:#fff}
.card{max-width:520px;margin:0 auto;padding:20px 22px 40px}
.lineprofile{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:18px;box-shadow:0 1px 3px rgba(26,77,104,.05)}
.lineprofile img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0}
.lineprofile .nm{font-weight:700;font-size:15px}
.lineprofile .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--line-green);font-weight:700;margin-top:2px}
.lineprofile .tag svg{width:13px;height:13px}
h3.sec{font-size:16px;margin-bottom:16px;color:var(--navy)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--mist);border-radius:10px;outline:none;transition:.15s;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mint)}
.field input[readonly]{background:var(--mint-l);border-color:var(--mint-l);color:var(--mint-d);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.gender-btn{padding:10px 22px;border:1.5px solid var(--mist);border-radius:999px;background:#fff;color:var(--slate);font-size:14px;font-weight:600}
.gender-btn.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.bp-grid{display:flex;flex-wrap:wrap;gap:7px}
.bp-btn{padding:8px 14px;border-radius:9px;border:1.5px solid var(--mist);background:#fff;font-size:13px;font-weight:600;color:var(--slate);transition:.12s}
.bp-btn.sel{background:var(--mint);border-color:var(--mint);color:#fff}
.vas-grid{display:flex;gap:5px;flex-wrap:wrap;justify-content:space-between}
.vas-btn{width:calc(9.09% - 5px);min-width:30px;aspect-ratio:1;border-radius:10px;border:2px solid var(--mist);background:#fff;font-size:15px;font-weight:700;color:var(--slate);transition:.12s}
.vas-btn.sel{color:#fff;transform:scale(1.06)}
.vas-cur{font-size:13px;color:var(--slate);margin-top:10px;text-align:center}
.btn{padding:13px 20px;background:var(--mint);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:700;transition:.15s;width:100%}
.btn:active{background:var(--mint-d)}
.btn.gray{background:#eef3f6;color:var(--slate)}
.consent-box{background:#fafbfc;border:1px solid var(--line);border-radius:12px;padding:16px;height:230px;overflow-y:auto;font-size:12.5px;line-height:2;white-space:pre-wrap;margin-bottom:14px}
.note{font-size:11px;color:var(--slate);text-align:center;margin-top:12px}
.done-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.done-card{background:#fff;border-radius:20px;padding:42px 32px;text-align:center;max-width:380px;box-shadow:0 12px 48px rgba(26,77,104,.12)}
.done-check{width:72px;height:72px;border-radius:50%;background:var(--mint-l);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--slate)}
.spinner{width:38px;height:38px;border:3px solid var(--mist);border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 4px 16px rgba(26,77,104,.2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:#fff8e8;border:1px solid #f0d090;color:#8a5a12;border-radius:10px;padding:11px 14px;font-size:12px;line-height:1.7;margin-bottom:16px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<!-- LIFF SDK -->
<script src="https://static.line-cdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ============================================================
   LIFF 初診問卷 — 整合領航物理治療所後端
   部署後請設定下列三個值：
   ============================================================ */
var LIFF_ID='YOUR_LIFF_ID';                 // ← LINE Developers 後台取得（必填）
var RENDER_URL='https://line-webhook-x1ux.onrender.com';  // ← 你的後端網址
var DEBUG_NO_LIFF=false;                    // ← true 可在瀏覽器測試（跳過 LINE）

/* ============================================================
   狀態
   ============================================================ */
var _step=1;
var _data={};
var _gender='';
var _vas=0;
var _profile=null;   // LINE 個人資料 {userId, displayName, pictureUrl}
var _idToken=null;   // 給後端驗證身分用

var BODY_REGIONS=['頭部','頸椎','左肩','右肩','胸椎','腰椎','薦髂關節','左髖','右髖','左膝','右膝','左踝','右踝','左肘','右肘','左腕','右腕'];

/* ============================================================
   工具
   ============================================================ */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function vasColor(v){v=Number(v);if(v===0)return '#22c55e';if(v<=3)return '#84cc16';if(v<=5)return '#eab308';if(v<=7)return '#f59e0b';if(v<=8)return '#f97316';return '#ef4444';}

/* ============================================================
   LIFF 初始化（核心）
   ============================================================ */
function boot(){
  if(DEBUG_NO_LIFF){
    _profile={userId:'U_debug_'+Date.now(),displayName:'測試使用者',pictureUrl:''};
    render();
    return;
  }
  if(LIFF_ID==='YOUR_LIFF_ID'){
    $('app').innerHTML='<div class="loading"><div style="color:var(--danger);font-weight:700">尚未設定 LIFF_ID</div><div style="font-size:13px;max-width:300px;text-align:center;line-height:1.8">請到 LINE Developers 後台建立 LIFF App，把 LIFF ID 填到程式碼最上方的 <code>LIFF_ID</code>。<br><br>或將 <code>DEBUG_NO_LIFF</code> 設為 true 在瀏覽器先測試。</div></div>';
    return;
  }
  $('app').innerHTML='<div class="loading"><div class="spinner"></div><div>正在連接 LINE…</div></div>';
  liff.init({liffId:LIFF_ID}).then(function(){
    if(!liff.isLoggedIn()){
      liff.login();   // 未登入 → 導向 LINE 登入後返回
      return;
    }
    // 取得個人資料 + idToken
    return Promise.all([liff.getProfile(), Promise.resolve(liff.getIDToken())]).then(function(arr){
      _profile=arr[0];
      _idToken=arr[1];
      // 嘗試從後端帶回此 LINE 用戶曾填過的資料（電話等）
      prefillFromServer(function(){ render(); });
    });
  }).catch(function(err){
    $('app').innerHTML='<div class="loading"><div style="color:var(--danger);font-weight:700">LINE 連接失敗</div><div style="font-size:13px;max-width:300px;text-align:center;line-height:1.8">'+esc(err.message||'未知錯誤')+'<br><br>請從 LINE 應用內重新開啟此連結。</div></div>';
  });
}

/* 從後端帶回此 userId 已知資料（電話、出生年月日等） */
function prefillFromServer(cb){
  if(!RENDER_URL||!_profile){cb();return;}
  fetch(RENDER_URL+'/patient-prefill?userId='+encodeURIComponent(_profile.userId))
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(d){
        _data.name=d.name||_profile.displayName||'';
        _data.phone=d.phone||'';
        _data.dob=d.dob||'';
        _data.idNum=d.idNum||'';
        if(d.gender){_data.gender=d.gender;_gender=d.gender;}
      }
      if(!_data.name)_data.name=_profile.displayName||'';
      cb();
    })
    .catch(function(){if(!_data.name)_data.name=_profile.displayName||'';cb();});
}

/* ============================================================
   畫面渲染
   ============================================================ */
function lineProfileCard(){
  if(!_profile)return '';
  var av=_profile.pictureUrl
    ?'<img src="'+esc(_profile.pictureUrl)+'" alt="">'
    :'<div style="width:46px;height:46px;border-radius:50%;background:var(--mint-l);display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:700;flex-shrink:0">'+esc((_profile.displayName||'?').slice(0,1))+'</div>';
  return '<div class="lineprofile">'+av+'<div><div class="nm">'+esc(_profile.displayName||'')+'</div><div class="tag"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 5.64 2 10.1c0 3.99 3.57 7.33 8.4 7.96.33.07.78.22.89.5.1.26.07.66.03.92l-.14.86c-.04.26-.2 1.02.9.56 1.1-.46 5.92-3.49 8.08-5.97C21.5 13.2 22 11.74 22 10.1 22 5.64 17.52 2 12 2z"/></svg>已透過 LINE 自動驗證身分</div></div></div>';
}

function bpHTML(selected){
  selected=selected||[];
  return '<div class="bp-grid">'+BODY_REGIONS.map(function(r){
    var sel=selected.indexOf(r)>-1;
    return '<button type="button" class="bp-btn'+(sel?' sel':'')+'" data-r="'+r+'" onclick="this.classList.toggle(\'sel\')">'+r+'</button>';
  }).join('')+'</div>';
}
function bpValues(){var out=[];document.querySelectorAll('.bp-btn.sel').forEach(function(b){out.push(b.dataset.r);});return out;}

function vasHTML(val){
  var h='<div class="vas-grid">';
  for(var i=0;i<=10;i++){
    var sel=Number(val)===i;
    h+='<button type="button" class="vas-btn'+(sel?' sel':'')+'" data-v="'+i+'" style="'+(sel?'background:'+vasColor(i)+';border-color:'+vasColor(i)+';':'color:'+vasColor(i)+';')+'" onclick="pickVas('+i+')">'+i+'</button>';
  }
  h+='</div><div class="vas-cur" id="vasCur">目前：'+(val||0)+' 分（0＝不痛，10＝最痛）</div>';
  return h;
}
function pickVas(v){
  _vas=v;
  document.querySelectorAll('.vas-btn').forEach(function(b){
    var bv=Number(b.dataset.v);var s=(bv===v);
    b.classList.toggle('sel',s);
    b.style.background=s?vasColor(bv):'';b.style.borderColor=s?vasColor(bv):'';b.style.color=s?'#fff':vasColor(bv);
  });
  $('vasCur').textContent='目前：'+v+' 分（0＝不痛，10＝最痛）';
}

function render(){
  if(_step===99){
    $('app').innerHTML='<div class="done-wrap"><div class="done-card"><div class="done-check"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--mint-d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><h2 style="font-size:21px;margin-bottom:8px">初診資料已送出</h2><p style="color:var(--slate);font-size:13px;line-height:1.8;margin-bottom:24px">感謝填寫！您的資料已自動與 LINE 綁定，治療師會於就診前確認。</p>'+(DEBUG_NO_LIFF?'<button class="btn gray" onclick="resetForm()">重新填寫</button>':'<button class="btn" onclick="closeLiff()">完成並關閉</button>')+'</div></div>';
    return;
  }
  var steps=['基本資料','主訴與患處','疼痛強度','告知同意'];
  var bar='<div class="steps">'+steps.map(function(s,i){return '<div class="istep '+(i+1<_step?'done':i+1===_step?'cur':'')+'"></div>';}).join('')+'</div>';
  var body='';

  if(_step===1){
    body='<h3 class="sec">基本資料</h3>'+lineProfileCard()+
      '<div class="banner">以下姓名已自動帶入您的 LINE 名稱，可直接修改為真實姓名。</div>'+
      '<div class="field"><label>真實姓名 <span class="req">*</span></label><input id="i-name" value="'+esc(_data.name||'')+'"></div>'+
      '<div class="grid2"><div class="field"><label>電話 <span class="req">*</span></label><input id="i-phone" type="tel" value="'+esc(_data.phone||'')+'" placeholder="09xx-xxx-xxx"></div><div class="field"><label>出生年月日 <span class="req">*</span></label><input id="i-dob" type="date" min="1900-01-01" max="'+todayStr()+'" value="'+esc(_data.dob||'')+'"></div></div>'+
      '<div class="field"><label>身分證字號 <span class="req">*</span></label><input id="i-id" value="'+esc(_data.idNum||'')+'" style="font-family:monospace;letter-spacing:1px" oninput="this.value=this.value.toUpperCase()"></div>'+
      '<div class="field"><label>性別 <span class="req">*</span></label><div class="row"><button type="button" class="gender-btn'+(_gender==='male'?' sel':'')+'" id="g-male" onclick="setGender(\'male\')">男</button><button type="button" class="gender-btn'+(_gender==='female'?' sel':'')+'" id="g-female" onclick="setGender(\'female\')">女</button></div></div>'+
      '<button class="btn" onclick="next(1)">下一步</button>';
  }
  else if(_step===2){
    body='<h3 class="sec">主訴與患處</h3>'+
      '<div class="field"><label>疼痛 / 不適部位（可複選） <span class="req">*</span></label>'+bpHTML(_data.bodyParts||[])+'</div>'+
      '<div class="field"><label>主要問題描述 <span class="req">*</span></label><textarea id="i-complaint" style="height:74px;resize:none" placeholder="例：右側下背痛，久坐後加劇">'+esc(_data.complaint||'')+'</textarea></div>'+
      '<div class="field"><label>持續時間</label><input id="i-duration" value="'+esc(_data.duration||'')+'" placeholder="例：三個月"></div>'+
      '<div class="row"><button class="btn gray" style="width:auto;flex:0 0 90px" onclick="back(1)">上一步</button><button class="btn" style="flex:1" onclick="next(2)">下一步</button></div>';
  }
  else if(_step===3){
    body='<h3 class="sec">疼痛強度（VAS）</h3><div style="font-size:13px;color:var(--slate);margin-bottom:14px">請點選目前最接近的疼痛分數</div>'+vasHTML(_data.vas||0)+
      '<div class="row" style="margin-top:24px"><button class="btn gray" style="width:auto;flex:0 0 90px" onclick="back(2)">上一步</button><button class="btn" style="flex:1" onclick="next(3)">下一步</button></div>';
  }
  else if(_step===4){
    var consent='【服務前言與聲明】\n本所本次處置採「非以疾病為目的」之健康促進模式（如動作評估、紅繩 Neurac 訓練、體能強化、放鬆伸展等）。若需針對特定疾病進行醫療復健，建請先經醫師診斷並開立照會或醫囑，再由本所物理治療師依醫囑執行。\n\n服務條款：\n一、立同意書人應由受服務之個案本人親自簽具；未成年或無法親簽者，得由法定代理人簽具。\n二、服務過程中如有不適，個案應立即反應並要求暫停。\n三、服務項目包含運動按摩、筋膜放鬆與伸展、體能強化、紅繩運動訓練等。\n四、過程中或後可能出現過敏、痠痛、頭暈等情況，立同意書人已知悉並同意。\n五、當日身體不適或服藥者，請先告知物理治療師。\n六、個人資料供本所作為健康促進服務使用。\n七、本所設有錄音錄影設備以維護雙方權益，資料依個資法妥善保存。\n八、本同意書自簽署日起一年內有效。\n\n本人已充分瞭解上述說明並同意，且確認服務提供者皆為領有合格證照之物理治療師。';
    body='<h3 class="sec">告知同意書</h3><div class="consent-box">'+esc(consent)+'</div>'+
      '<div class="grid2"><div class="field"><label>簽名（全名） <span class="req">*</span></label><input id="i-sig" value="'+esc(_data.name||'')+'"></div><div class="field"><label>與個案關係</label><input id="i-rel" value="本人"></div></div>'+
      '<div class="field"><label style="color:var(--slate)">簽署日期</label><div style="font-weight:600;padding:4px 0">'+new Date().toLocaleDateString('zh-TW')+'</div></div>'+
      '<div class="row"><button class="btn gray" style="width:auto;flex:0 0 90px" onclick="back(3)">上一步</button><button class="btn" style="flex:1" id="submitBtn" onclick="submit()">確認送出</button></div>';
  }

  $('app').innerHTML='<div class="wrap"><div class="top"><div class="ttl">領航物理治療所</div><div class="sub">初診問卷 · 步驟 '+_step+' / 4</div></div>'+bar+'<div class="card">'+body+'</div></div>';
}

/* ============================================================
   流程控制
   ============================================================ */
function setGender(g){_gender=g;$('g-male').classList.toggle('sel',g==='male');$('g-female').classList.toggle('sel',g==='female');}
function back(s){_step=s;render();}
function next(step){
  if(step===1){
    var name=$('i-name').value.trim();var phone=$('i-phone').value.trim();var dob=$('i-dob').value;var idn=$('i-id').value.trim();
    if(!name){toast('請填寫真實姓名');return;}
    if(!phone){toast('請填寫電話');return;}
    if(!dob){toast('請選擇出生年月日');return;}
    if(!idn){toast('請填寫身分證字號');return;}
    if(!_gender){toast('請選擇性別');return;}
    _data.name=name;_data.phone=phone;_data.dob=dob;_data.idNum=idn;_data.gender=_gender;
  }else if(step===2){
    var bp=bpValues();var comp=$('i-complaint').value.trim();
    if(!bp.length){toast('請點選疼痛部位');return;}
    if(!comp){toast('請描述主訴');return;}
    _data.bodyParts=bp;_data.complaint=comp;_data.duration=$('i-duration').value.trim();
  }else if(step===3){
    _data.vas=_vas;
  }
  _step=step+1;render();
}

function submit(){
  var sig=$('i-sig').value.trim();
  if(!sig){toast('請填寫簽名');return;}
  _data.sigName=sig;
  _data.sigRel=$('i-rel').value.trim()||'本人';
  _data.sigDate=new Date().toLocaleDateString('zh-TW');

  // 關鍵：附上 LINE userId 與 idToken，讓後端自動綁定 + 驗證身分
  var payload=JSON.parse(JSON.stringify(_data));
  if(_profile){
    payload.lineUserId=_profile.userId;
    payload.lineDisplayName=_profile.displayName;
    payload.linePictureUrl=_profile.pictureUrl;
  }
  if(_idToken)payload.idToken=_idToken;
  payload.source='liff';

  var btn=$('submitBtn');if(btn){btn.textContent='送出中…';btn.style.opacity='.6';btn.disabled=true;}

  if(!RENDER_URL){
    // 無後端時的本機測試
    setTimeout(function(){_step=99;render();},400);
    return;
  }

  fetch(RENDER_URL+'/submit-intake',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  }).then(function(r){
    if(r.ok){
      _step=99;render();
    }else{
      throw new Error('HTTP '+r.status);
    }
  }).catch(function(e){
    toast('送出失敗：'+e.message+'，請重試');
    if(btn){btn.textContent='確認送出';btn.style.opacity='1';btn.disabled=false;}
  });
}

function closeLiff(){
  if(!DEBUG_NO_LIFF && typeof liff!=='undefined' && liff.isInClient && liff.isInClient()){
    liff.closeWindow();
  }else{
    toast('已完成，可關閉此頁');
  }
}
