<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>線上預約｜領航物理治療所</title>

<!-- LINE LIFF SDK — 部署時取消此行 / 替換為正確 LIFF ID -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
/* ─── Token ─── */
:root{
  --sky:#1a4d68;--sky-d:#123b52;--sky-l:#eef4f7;
  --mint:#2DC8A0;--mint-d:#1f9e7e;--mint-l:#edfaf6;
  --line-green:#06C755;
  --ink:#1f3a47;--slate:#6b8a9c;--mist:#dce6ec;--bg:#f4f8fb;
  --white:#fff;--line:#eef3f6;
  --r:14px;--r-sm:10px;
  --shadow:0 2px 12px rgba(26,77,104,.08);
  --shadow-md:0 4px 20px rgba(26,77,104,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);font-family:'Noto Sans TC',-apple-system,sans-serif;color:var(--ink);min-height:100vh}

/* ─── Layout ─── */
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--white);position:relative;overflow:hidden}

/* ─── Hero ─── */
.hero{background:linear-gradient(145deg,var(--sky-d) 0%,var(--sky) 60%,#2a7fa8 100%);padding:28px 22px 22px;color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05);right:-40px;top:-60px}
.hero::after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07);left:-30px;bottom:-40px}
.clinic-name{font-size:11px;font-weight:700;letter-spacing:1.5px;opacity:.75;text-transform:uppercase;margin-bottom:6px}
.hero h1{font-size:20px;font-weight:900;letter-spacing:.3px;line-height:1.3}
.hero p{font-size:12px;opacity:.8;margin-top:5px}

/* LINE 個人資訊列 */
.line-bar{display:flex;align-items:center;gap:10px;margin-top:14px;background:rgba(255,255,255,.12);border-radius:10px;padding:9px 12px}
.line-avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.line-avatar img{width:100%;height:100%;object-fit:cover}
.line-name{font-size:13px;font-weight:700}
.line-tag{font-size:10px;opacity:.7}
.line-login-btn{flex:1;text-align:right;font-size:11px;opacity:.75;cursor:pointer;text-decoration:underline}

/* ─── 進度列 ─── */
.prog-bar{display:flex;gap:4px;padding:14px 22px 0;background:var(--sky);position:sticky;top:0;z-index:10}
.prog-seg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.2);transition:background .3s}
.prog-seg.done{background:var(--mint)}
.prog-seg.cur{background:#fff}

/* ─── 步驟 header ─── */
.step-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 4px}
.step-num{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--slate)}
.step-back{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--slate);cursor:pointer;padding:4px 0}
.step-back svg{width:14px;height:14px}

/* ─── 內容區 ─── */
.body{padding:14px 22px 100px}

/* ─── 選項卡片 ─── */
.opt-card{border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:14px;position:relative}
.opt-card:active{background:var(--sky-l)}
.opt-card.sel{border-color:var(--mint);background:var(--mint-l)}
.opt-card.sel::after{content:'✓';position:absolute;right:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--mint);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:22px;text-align:center}
.opt-ico{width:44px;height:44px;border-radius:12px;background:var(--sky-l);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.opt-card.sel .opt-ico{background:rgba(45,200,160,.15)}
.opt-title{font-size:15px;font-weight:700}
.opt-meta{font-size:12px;color:var(--slate);margin-top:2px}
.opt-badge{font-size:11px;color:var(--mint-d);font-weight:700;margin-top:3px}

/* 治療師頭像 */
.t-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}

/* ─── 日期格 ─── */
.date-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:4px}
.date-cell{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 0;text-align:center;cursor:pointer;transition:.15s}
.date-cell:active{background:var(--sky-l)}
.date-cell.sel{border-color:var(--mint);background:var(--mint);color:#fff}
.date-cell.off{opacity:.3;pointer-events:none}
.date-cell .dw{font-size:9px;color:var(--slate);font-weight:600;letter-spacing:.5px}
.date-cell.sel .dw{color:#d0f5ec}
.date-cell .dn{font-size:18px;font-weight:900;line-height:1.3}

/* ─── 時段格 ─── */
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.slot-cell{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 0;text-align:center;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.slot-cell:active{background:var(--sky-l)}
.slot-cell.sel{border-color:var(--mint);background:var(--mint);color:#fff}
.slot-cell.taken{opacity:.35;pointer-events:none;text-decoration:line-through}
.slot-cell.taken::after{content:'已預';display:block;font-size:9px;font-weight:400;opacity:.6}

/* ─── 表單 ─── */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--slate);margin-bottom:5px;letter-spacing:.3px}
.field input,.field textarea{width:100%;padding:13px 15px;border:1.5px solid var(--mist);border-radius:var(--r-sm);font-size:15px;font-family:inherit;color:var(--ink);outline:none;transition:.15s;background:#fff;-webkit-appearance:none}
.field input:focus,.field textarea:focus{border-color:var(--sky)}
.field textarea{resize:none;height:72px;line-height:1.6}

/* ─── 預約摘要 ─── */
.summary{background:var(--sky-l);border-radius:var(--r);padding:16px 18px;margin-bottom:18px;border:1px solid var(--line)}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
.sum-row:not(:last-child){border-bottom:1px solid var(--line)}
.sum-label{font-size:12px;color:var(--slate)}
.sum-val{font-size:13px;font-weight:700}
.sum-price{font-size:18px;font-weight:900;color:var(--mint-d)}

/* LINE 登入按鈕 */
.line-login-card{border:1.5px dashed var(--line-green);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;cursor:pointer;background:#f0fff6;transition:.15s}
.line-login-card:active{background:#e0ffe8}
.line-login-card .ico{width:36px;height:36px;background:var(--line-green);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.line-login-card .txt{font-size:13px;font-weight:700;color:var(--ink)}
.line-login-card .sub{font-size:11px;color:var(--slate);margin-top:2px}

/* ─── 底部按鈕 ─── */
.btm{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;padding:12px 22px 20px;border-top:1px solid var(--line);z-index:20}
.btn{width:100%;padding:16px;background:var(--sky);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;letter-spacing:.3px}
.btn:active{background:var(--sky-d)}
.btn:disabled{background:var(--mist);cursor:default}
.btn.mint{background:var(--mint)}
.btn.mint:active{background:var(--mint-d)}
.btn-ghost{width:100%;background:none;border:none;color:var(--slate);font-size:13px;padding:10px;cursor:pointer;font-family:inherit;margin-top:4px}

/* ─── 成功畫面 ─── */
.done-wrap{padding:48px 28px;text-align:center}
.done-ico{width:80px;height:80px;border-radius:50%;background:var(--mint-l);margin:0 auto 24px;display:flex;align-items:center;justify-content:center}
.done-ico svg{width:40px;height:40px;stroke:var(--mint)}
.done-wrap h2{font-size:22px;font-weight:900;margin-bottom:8px}
.done-wrap p{font-size:14px;color:var(--slate);line-height:1.8}
.done-detail{background:var(--sky-l);border-radius:var(--r);padding:16px 18px;margin-top:24px;text-align:left}

/* ─── Loading ─── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;color:var(--slate);gap:12px}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── 空狀態 ─── */
.empty{text-align:center;padding:36px 16px;color:var(--slate)}
.empty p{font-size:14px;margin-top:8px}

/* ─── Toast ─── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:99;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── 設定說明（開發用） ─── */
.setup-note{background:#fff8ed;border-left:4px solid #f59e0b;border-radius:0 10px 10px 0;padding:14px 16px;margin:16px 22px;font-size:12px;color:#92400e;line-height:1.8;display:none}
.setup-note b{font-weight:700}
.setup-note code{background:#fee;border-radius:4px;padding:1px 5px;font-family:monospace;font-size:11px}
</style>
</head>
<body>

<div class="app">
  <!-- Hero -->
  <div class="hero">
    <div class="clinic-name">領航物理治療所</div>
    <h1>線上預約</h1>
    <p>選擇您方便的時間，我們會提前提醒您</p>
    <!-- LINE 個人資訊（LIFF 登入後顯示） -->
    <div class="line-bar" id="lineBar" style="display:none">
      <div class="line-avatar" id="lineAvatar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div>
        <div class="line-name" id="lineName">LINE 使用者</div>
        <div class="line-tag">姓名已自動帶入</div>
      </div>
    </div>
    <div id="lineLoginHint" style="margin-top:12px;font-size:11px;opacity:.7;display:none">
      LINE 未登入 — 預約後需手動留下姓名電話
    </div>
  </div>

  <!-- 進度列 -->
  <div class="prog-bar" id="progBar">
    <div class="prog-seg"></div>
    <div class="prog-seg"></div>
    <div class="prog-seg"></div>
    <div class="prog-seg"></div>
    <div class="prog-seg"></div>
  </div>

  <!-- 主要內容 -->
  <div id="app"></div>

  <!-- 固定底部按鈕 -->
  <div class="btm" id="btm"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════
//  🔧 設定區域 — 部署時修改此處
// ════════════════════════════════════════════════
const CONFIG = {
  liffId: 'YOUR_LIFF_ID',          // ← 替換為您的 LIFF ID，例如 '1234567890-abcdefgh'
  apiBase: '',                      // ← 後端 API 網址，本地測試留空，Render 填入如 'https://navi-clinic.onrender.com'
  clinicName: '領航物理治療所',
  slotDuration: 30,                 // 時段間隔（分鐘）
  bookingDaysAhead: 14,             // 開放幾天後的預約
};

// ════════════════════════════════════════════════
//  📋 診所資料（與 server/config.js 保持同步）
// ════════════════════════════════════════════════
const SERVICES = [
  {id:'assess',   name:'初次評估',         dur:90, price:2000, desc:'完整身體評估與治療計畫',  icon:'🩺'},
  {id:'myofascia',name:'肌筋膜疼痛治療',   dur:60, price:1500, desc:'針對慢性疼痛與肌肉緊繃',  icon:'💆'},
  {id:'redcord',  name:'紅繩懸吊運動治療', dur:60, price:1600, desc:'核心穩定訓練・功能性動作', icon:'🔵'},
  {id:'cranio',   name:'顱薦椎療法',       dur:75, price:2200, desc:'顱薦椎節律平衡治療',      icon:'🧠'},
  {id:'energy',   name:'能量情緒釋放',     dur:60, price:1800, desc:'身心整合療癒',            icon:'✨'},
  {id:'cycling',  name:'公路車運動評估',   dur:90, price:2500, desc:'自行車姿勢與傷害預防',    icon:'🚲'},
];
const THERAPISTS = [
  {id:'Sky',name:'Sky 物理治療師',title:'物理治療師',color:'#1a4d68',workDays:[1,2,4,5],services:['assess','redcord','cranio','energy','cycling']},
  {id:'B',  name:'治療師 B',      title:'物理治療師',color:'#2DC8A0',workDays:[1,3,5,6],services:['assess','myofascia','redcord']},
  {id:'C',  name:'治療師 C',      title:'物理治療師',color:'#F59E0B',workDays:[2,3,4,6],services:['assess','myofascia','redcord','cranio']},
  {id:'D',  name:'治療師 D',      title:'物理治療師',color:'#8B5CF6',workDays:[1,2,4,5,6],services:['assess','redcord','cycling']},
  {id:'E',  name:'治療師 E',      title:'物理治療師',color:'#EC4899',workDays:[3,4,5,6],services:['energy','cranio','myofascia']},
];
// 模擬已被佔用的時段（實際應從 API 取得）
const MOCK_TAKEN = {
  'Sky': { '2026-06-23': ['09:00','10:30'], '2026-06-24': ['13:00','14:30'] },
  'B':   { '2026-06-23': ['10:00'], '2026-06-25': ['09:00','09:30'] },
};

// ════════════════════════════════════════════════
//  🗂 狀態管理
// ════════════════════════════════════════════════
const state = {
  step: 0,         // 0=loading 1=服務 2=治療師 3=日期 4=時段 5=確認 99=完成
  svc: null,
  therapist: null,
  date: null,
  time: null,
  name: '',
  phone: '',
  note: '',
};
let lineUserId = '';
let lineProfile = null;
const DAYS = ['日','一','二','三','四','五','六'];

// ════════════════════════════════════════════════
//  🔌 LIFF 初始化
// ════════════════════════════════════════════════
async function initLIFF() {
  const isDevMode = CONFIG.liffId === 'YOUR_LIFF_ID';
  if (isDevMode) {
    // 開發模式：顯示提示，跳過 LIFF
    document.getElementById('lineLoginHint').style.display = 'block';
    setStep(1);
    return;
  }
  try {
    await liff.init({ liffId: CONFIG.liffId });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    lineProfile = await liff.getProfile();
    lineUserId = lineProfile.userId;
    state.name = lineProfile.displayName || '';
    // 顯示 LINE 個人資訊
    const bar = document.getElementById('lineBar');
    const avatar = document.getElementById('lineAvatar');
    const nameEl = document.getElementById('lineName');
    if (lineProfile.pictureUrl) {
      avatar.innerHTML = '<img src="' + lineProfile.pictureUrl + '">';
    } else {
      avatar.textContent = (state.name || 'U')[0];
    }
    if (nameEl) nameEl.textContent = state.name;
    if (bar) bar.style.display = 'flex';
  } catch (e) {
    console.warn('LIFF init failed:', e);
    document.getElementById('lineLoginHint').style.display = 'block';
  }
  setStep(1);
}

// ════════════════════════════════════════════════
//  🎬 進度列 & 步驟切換
// ════════════════════════════════════════════════
function setStep(n) {
  state.step = n;
  const segs = document.querySelectorAll('.prog-seg');
  segs.forEach((s, i) => {
    s.classList.remove('done','cur');
    if (i < n - 1) s.classList.add('done');
    else if (i === n - 1) s.classList.add('cur');
  });
  const prog = document.getElementById('progBar');
  if (prog) prog.style.display = (n === 99) ? 'none' : 'flex';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ════════════════════════════════════════════════
//  🖥 渲染路由
// ════════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  const btm = document.getElementById('btm');
  if (!app || !btm) return;
  switch(state.step) {
    case 0:  return renderLoading(app, btm);
    case 1:  return renderTherapist(app, btm);
    case 2:  return renderService(app, btm);
    case 3:  return renderDate(app, btm);
    case 4:  return renderTime(app, btm);
    case 5:  return renderConfirm(app, btm);
    case 99: return renderDone(app, btm);
  }
}

function stepHeader(label, onBack) {
  return '<div class="step-header">' +
    '<div class="step-num">' + (state.step) + ' / 5　' + label + '</div>' +
    (onBack ? '<div class="step-back" onclick="' + onBack + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>返回</div>' : '') +
    '</div>';
}

// ── Step 1：選擇服務 ──
function renderService(app, btm) {
  let h = stepHeader('選擇服務', 'setStep(1)')
  h += '<div class="body">';
  SERVICES.forEach(s => {
    const sel = state.svc === s.id ? ' sel' : '';
    h += '<div class="opt-card' + sel + '" onclick="pickSvc(\'' + s.id + '\')">' +
      '<div class="opt-ico">' + s.icon + '</div>' +
      '<div style="flex:1"><div class="opt-title">' + s.name + '</div>' +
        '<div class="opt-meta">' + s.dur + ' 分鐘</div>' +
        '<div class="opt-badge">NT$' + s.price.toLocaleString() + '</div>' +
      '</div></div>';
  });
  h += '</div>';
  app.innerHTML = h;
  btm.innerHTML = state.svc
    ? '<button class="btn mint" onclick="setStep(3)">下一步　→</button>'
    : '<button class="btn" disabled>請先選擇服務項目</button>';
}
function pickSvc(id) { state.svc = id; state.date = null; state.time = null; render(); }

// ── Step 2：選擇治療師 ──
function renderTherapist(app, btm) {
  const selectedT = state.therapist === 'any' ? null : THERAPISTS.find(t => t.id === state.therapist);
  const avail = selectedT ? SERVICES.filter(s => selectedT.services.includes(s.id)) : SERVICES;
  let h = stepHeader('選擇治療師');
  h += '<div class="body">';

  // 不指定
  const anyS = state.therapist === 'any' ? ' sel' : '';
  h += '<div class="opt-card' + anyS + '" onclick="pickT(\'any\')">' +
    '<div class="opt-ico" style="font-size:20px;background:#f0f7fa">🎲</div>' +
    '<div style="flex:1"><div class="opt-title">不指定治療師</div><div class="opt-meta">系統安排最近可預約時段</div></div></div>';
  avail.forEach(t => {
    const sel = state.therapist === t.id ? ' sel' : '';
    const ini = t.name.replace(/[^\u4e00-\u9fff]/g, '').slice(-2) || t.name.slice(0, 2);
    h += '<div class="opt-card' + sel + '" onclick="pickT(\'' + t.id + '\')">' +
      '<div class="t-avatar" style="background:' + t.color + '">' + ini + '</div>' +
      '<div style="flex:1"><div class="opt-title">' + t.name + '</div><div class="opt-meta">' + t.title + '</div></div></div>';
  });
  h += '</div>';
  app.innerHTML = h;
  btm.innerHTML = state.therapist
    ? '<button class="btn mint" onclick="setStep(2)">下一步　→</button>'
    : '<button class="btn" disabled>請先選擇治療師</button>';
}
function pickT(id) { state.therapist = id; state.date = null; state.time = null; render(); }

// ── Step 3：選擇日期 ──
function renderDate(app, btm) {
  const t = state.therapist === 'any' ? null : THERAPISTS.find(x => x.id === state.therapist);
  const workDays = t ? t.workDays : [0,1,2,3,4,5,6];
  const today = new Date('2026-06-17'); // 開發用固定日期；實際: new Date()
  let h = stepHeader('選擇日期', 'setStep(2)');
  h += '<div class="body"><div class="date-grid">';
  for (let i = 0; i < CONFIG.bookingDaysAhead; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const ds = d.toLocaleDateString('sv-SE');
    const dow = d.getDay();
    const off = !workDays.includes(dow);
    const sel = state.date === ds ? ' sel' : '';
    const cls = 'date-cell' + (off ? ' off' : '') + sel;
    const click = off ? '' : 'onclick="pickDate(\'' + ds + '\')"';
    h += '<div class="' + cls + '" ' + click + '>' +
      '<div class="dw">週' + DAYS[dow] + '</div>' +
      '<div class="dn">' + d.getDate() + '</div></div>';
  }
  h += '</div></div>';
  app.innerHTML = h;
  btm.innerHTML = state.date
    ? '<button class="btn mint" onclick="setStep(4)">下一步　→</button>'
    : '<button class="btn" disabled>請選擇預約日期</button>';
}
function pickDate(ds) { state.date = ds; state.time = null; render(); }

// ── Step 4：選擇時段 ──
async function renderTime(app, btm) {
  app.innerHTML = '<div class="loading"><div class="spinner"></div><div>載入可預約時段…</div></div>';
  btm.innerHTML = '';
  let slots;
  try {
    if (CONFIG.apiBase) {
      const r = await fetch(CONFIG.apiBase + '/book/slots?therapist=' + state.therapist + '&service=' + state.svc + '&date=' + state.date);
      const d = await r.json();
      slots = d.slots || [];
    } else {
      // 開發模式：生成模擬時段
      slots = genMockSlots();
    }
  } catch(e) {
    app.innerHTML = '<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--mist)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><p>無法取得時段，請稍後再試</p></div>';
    btm.innerHTML = '<button class="btn-ghost" onclick="setStep(3)">← 重新選擇日期</button>';
    return;
  }
  const taken = (MOCK_TAKEN[state.therapist] || {})[state.date] || [];
  let h = stepHeader('選擇時段', 'setStep(3)');
  h += '<div class="body">';
  h += '<div style="font-size:12px;color:var(--slate);margin-bottom:12px">' + state.date + '　' + (state.therapist === 'any' ? '不指定' : THERAPISTS.find(t => t.id === state.therapist)?.name) + '</div>';
  if (!slots.length) {
    h += '<div class="empty"><p>這天已無可預約時段<br>請選擇其他日期</p></div>';
  } else {
    h += '<div class="slot-grid">';
    slots.forEach(s => {
      const t = taken.includes(s);
      const sel = state.time === s ? ' sel' : '';
      h += '<div class="slot-cell' + (t ? ' taken' : sel) + '" ' + (t ? '' : 'onclick="pickTime(\'' + s + '\')"') + '>' + s + '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  app.innerHTML = h;
  btm.innerHTML = state.time
    ? '<button class="btn mint" onclick="setStep(5)">下一步　→</button>'
    : '<button class="btn" disabled>請選擇時段</button>';
}
function genMockSlots() {
  const slots = [];
  for (let h = 9; h < 18; h++) {
    for (let m = 0; m < 60; m += CONFIG.slotDuration) {
      if (h === 12 || h === 17) continue; // 午休
      slots.push(String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'));
    }
  }
  return slots;
}
function pickTime(t) { state.time = t; render(); }

// ── Step 5：確認 ──
function renderConfirm(app, btm) {
  // Step 1: show all therapists
  const t = state.therapist === 'any' ? null : THERAPISTS.find(x => x.id === state.therapist);
  let h = stepHeader('確認預約', 'setStep(4)');
  h += '<div class="body">';
  // 摘要
  h += '<div class="summary">' +
    '<div class="sum-row"><span class="sum-label">服務項目</span><span class="sum-val">' + svc.name + '</span></div>' +
    '<div class="sum-row"><span class="sum-label">治療師</span><span class="sum-val">' + (t ? t.name : '不指定') + '</span></div>' +
    '<div class="sum-row"><span class="sum-label">預約時間</span><span class="sum-val">' + state.date + '　' + state.time + '</span></div>' +
    '<div class="sum-row"><span class="sum-label">時長</span><span class="sum-val">' + svc.dur + ' 分鐘</span></div>' +
    '<div class="sum-row"><span class="sum-label">費用</span><span class="sum-price">NT$' + svc.price.toLocaleString() + '</span></div>' +
    '</div>';
  // LINE 登入（未登入時顯示）
  if (!lineUserId) {
    h += '<div class="line-login-card" onclick="doLineLogin()">' +
      '<div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>' +
      '<div><div class="txt">LINE 快速登入</div><div class="sub">自動帶入姓名・預約後即時通知</div></div>' +
      '</div>';
  }
  // 表單
  h += '<div class="field"><label>姓名 *</label><input id="f-name" placeholder="請輸入您的姓名" value="' + (state.name || '') + '" oninput="state.name=this.value"></div>';
  h += '<div class="field"><label>聯絡電話 *</label><input id="f-phone" type="tel" placeholder="09XX-XXX-XXX" value="' + (state.phone || '') + '" oninput="state.phone=this.value"></div>';
  h += '<div class="field"><label>備註（選填）</label><textarea id="f-note" placeholder="希望針對的部位或症狀說明…">' + (state.note || '') + '</textarea></div>';
  h += '</div>';
  app.innerHTML = h;
  btm.innerHTML = '<button class="btn" id="submitBtn" onclick="doSubmit()">確認預約</button>';
}
function doLineLogin() {
  if (typeof liff !== 'undefined') {
    try { liff.login(); } catch(e) {}
  } else {
    showToast('開發模式：模擬 LINE 登入');
    lineUserId = 'U_mock_123';
    state.name = 'Sky 測試用戶';
    render();
  }
}

// ── 送出預約 ──
async function doSubmit() {
  const name = document.getElementById('f-name')?.value.trim();
  const phone = document.getElementById('f-phone')?.value.trim();
  const note = document.getElementById('f-note')?.value.trim() || '';
  if (!name) { showToast('請輸入姓名'); document.getElementById('f-name')?.focus(); return; }
  if (!phone || !/^09\d{2}/.test(phone.replace(/-/g,''))) { showToast('請輸入正確的手機號碼'); document.getElementById('f-phone')?.focus(); return; }
  state.name = name; state.phone = phone; state.note = note;
  const btn = document.getElementById('submitBtn');
  if (btn) { btn.disabled = true; btn.textContent = '預約處理中…'; }
  const payload = {
    therapistId: state.therapist,
    serviceId: state.svc,
    date: state.date,
    time: state.time,
    name, phone, note,
    lineUserId,
  };
  try {
    if (CONFIG.apiBase) {
      const r = await fetch(CONFIG.apiBase + '/book/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const d = await r.json();
      if (d.ok) { setStep(99); }
      else { showToast(d.error || '預約失敗，請重試'); if (btn) { btn.disabled = false; btn.textContent = '確認預約'; } }
    } else {
      // 開發模式：模擬成功
      await new Promise(r => setTimeout(r, 800));
      setStep(99);
    }
  } catch(e) {
    showToast('連線失敗，請確認網路後再試');
    if (btn) { btn.disabled = false; btn.textContent = '確認預約'; }
  }
}

// ── Step 99：完成 ──
function renderDone(app, btm) {
  const svc = SERVICES.find(s => s.id === state.svc);
  const t = state.therapist === 'any' ? null : THERAPISTS.find(x => x.id === state.therapist);
  app.innerHTML = '<div class="done-wrap">' +
    '<div class="done-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
    '<h2>預約成功 🎉</h2>' +
    '<p>我們已收到您的預約請求<br>' + (lineUserId ? '確認通知將透過 LINE 傳送給您' : '請記得準時到診') + '</p>' +
    '<div class="done-detail">' +
      '<div class="sum-row"><span class="sum-label">服務</span><span class="sum-val">' + svc.name + '</span></div>' +
      '<div class="sum-row"><span class="sum-label">治療師</span><span class="sum-val">' + (t ? t.name : '候補安排') + '</span></div>' +
      '<div class="sum-row"><span class="sum-label">時間</span><span class="sum-val">' + state.date + '　' + state.time + '</span></div>' +
      '<div class="sum-row"><span class="sum-label">姓名</span><span class="sum-val">' + state.name + '</span></div>' +
      '<div class="sum-row"><span class="sum-label">電話</span><span class="sum-val">' + state.phone + '</span></div>' +
    '</div>' +
    (lineUserId ? '<p style="margin-top:20px;font-size:12px;color:var(--slate)">📱 若有臨時更動，請透過 LINE 官方帳號聯絡我們</p>' : '') +
    '</div>';
  // 按鈕
  const closeable = typeof liff !== 'undefined' && CONFIG.liffId !== 'YOUR_LIFF_ID';
  btm.innerHTML = closeable
    ? '<button class="btn mint" onclick="liff.closeWindow()">關閉</button>'
    : '<button class="btn" onclick="resetAll()">再次預約</button>';
}

// ── Loading ──
function renderLoading(app, btm) {
  app.innerHTML = '<div class="loading"><div class="spinner"></div><div>初始化中…</div></div>';
  btm.innerHTML = '';
}

// ── Utils ──
function resetAll() {
  Object.assign(state, {step:1,svc:null,therapist:null,date:null,time:null,name:lineProfile?.displayName||'',phone:'',note:''});
  setStep(1);
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ════════════════════════════════════════════════
//  🚀 啟動
// ════════════════════════════════════════════════
setStep(0);
initLIFF();
</script>
